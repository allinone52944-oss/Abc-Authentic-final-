<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>ইউনিভার্সাল সনদ জেনারেটর ইঞ্জিন</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; gap: 20px; }
        .control-panel { width: 380px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
        .control-panel h3 { margin-top: 0; color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #444; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .document-container { width: 794px; height: 1123px; background: #ffffff; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; }
        .doc-content { position: relative; z-index: 2; padding: 50px; box-sizing: border-box; font-size: 15px; color: #000; line-height: 1.6; }
        .qr-slot { position: absolute; bottom: 60px; left: 50px; width: 90px; height: 90px; }
        .qr-slot canvas { width: 100% !important; height: 100% !important; }
        .cert-title { text-align: center; font-size: 20px; font-weight: bold; margin: 20px 0; text-decoration: underline; }
        .print-btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="control-panel">
        <h3>ইউনিভার্সাল মাষ্টার ইঞ্জিন</h3>
        <div class="form-group"><label>সনদের শিরোনাম:</label><input type="text" id="inputCertTitle" value="“জাতীয়তা সনদ”" oninput="syncData()"></div>
        <div class="form-group"><label>নাম:</label><input type="text" id="inputName" value="মোসাম্মৎ তানিয়া আকতার" oninput="syncData()"></div>
        <div class="form-group"><label>পিতার নাম:</label><input type="text" id="inputFather" value="মোহাম্মদ আলমগীর হোসেন" oninput="syncData()"></div>
        <div class="form-group"><label>QR কোড URL:</label><input type="text" id="inputUrl" value="https://www.southmadarshaup.com/verify?id=1081" oninput="updateQR()"></div>
        <button class="print-btn" onclick="window.print()">প্রিন্ট / PDF করুন</button>
    </div>
    <div class="document-container">
        <div class="doc-content">
            <div class="cert-title" id="valCertTitle">“জাতীয়তা সনদ”</div>
            <p>নাম: <span id="valName" style="font-weight:bold;">মোসাম্মৎ তানিয়া আকতার</span></p>
            <p>পিতার নাম: <span id="valFather">মোহাম্মদ আলমগীর হোসেন</span></p>
        </div>
        <div class="qr-slot"><canvas id="qrcodeCanvas"></canvas></div>
    </div>
    <script>
        function syncData() {
            document.getElementById("valCertTitle").innerText = document.getElementById("inputCertTitle").value;
            document.getElementById("valName").innerText = document.getElementById("inputName").value;
            document.getElementById("valFather").innerText = document.getElementById("inputFather").value;
        }
        function updateQR() {
            QRCode.toCanvas(document.getElementById("qrcodeCanvas"), document.getElementById("inputUrl").value, { width: 90, margin: 0 });
        }
        window.onload = updateQR;
    </script>
</body>
</html>
