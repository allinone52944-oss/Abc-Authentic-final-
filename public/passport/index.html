<script>
  function updatePassport() {
    const pNo = document.getElementById('inp-passNo').value;

    const dob = document.getElementById('inp-dob').value;
    const sex = document.getElementById('inp-sex').value;
    const nid = document.getElementById('inp-nid').value;
    const exp = document.getElementById('inp-expiry').value;

    document.getElementById('prev-passNo').innerText = pNo;
    document.getElementById('prev-name').innerText = name;
    document.getElementById('prev-nationality').innerText = nat;
    document.getElementById('prev-dob').innerText = dob;

    document.getElementById('prev-expiry').innerText = exp;

' + pNo + '<4BGD' + '9001157' + sex + '3601149' + '<<<<<<<<<<<<<<06';

  function loadPhoto(event) {
    const reader = new FileReader();
    reader.onload = function(){
      const output = document.getElementById('photo-preview');
      output.innerHTML = '<img src="' + reader.result + '">';
    };
    reader.readAsDataURL(event.target.files[0]);
  }
