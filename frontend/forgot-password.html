<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e40af">
<title>পাসওয়ার্ড রিসেট - All In One (Abc Authentic)</title>
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=2">
<style>
  body {
    background: #091326;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: var(--r-xl);
    padding: 36px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  }
  .auth-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    margin-bottom: 16px;
  }
  .auth-logo img { width: 32px; height: 32px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="/icons/abc-uncommon.svg" alt="ABC">
  </div>
  <h2 style="font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;">All In One (Abc Authentic)</h2>
  <div style="font-size:12px;color:#64748b;margin-bottom:24px;">বিশ্বাস ও সেবার ঠিকানা</div>

  <div id="step-form">
    <h3 style="color:#1e40af;margin-bottom:8px;">🔑 পাসওয়ার্ড রিসেট</h3>
    <p style="color:#64748b;font-size:14px;line-height:1.6;margin-bottom:20px;">আপনার রেজিস্টার্ড ইমেইল দিন —<br>রিসেট লিংক পাঠিয়ে দিচ্ছি (১ ঘণ্টা কার্যকর থাকবে)।</p>
    <div class="field" style="text-align:left;">
      <label>ইমেইল এড্রেস</label>
      <input type="email" id="fp_email" placeholder="email@example.com" autocomplete="email">
    </div>
    <div class="err" id="fp_err"></div>
    <button class="btn" id="fp_btn" style="width:100%;padding:13px;margin-top:10px;" onclick="doForgot()">রিসেট লিংক পাঠান →</button>
    <div style="margin-top:16px;"><a href="/login.html" style="color:#2563eb;font-weight:600;font-size:14px;text-decoration:none;">← লগইনে ফিরুন</a></div>
  </div>

  <div id="step-done" class="hidden">
    <div style="font-size:52px;margin-bottom:12px;">📧</div>
    <h3 style="color:#059669;margin-bottom:8px;">ইমেইল পাঠানো হয়েছে!</h3>
    <p style="color:#64748b;font-size:14px;line-height:1.6;">অ্যাকাউন্ট থাকলে রিসেট লিংক পেয়ে যাবেন।<br>অনুগ্রহ করে ইমেইলের স্প্যাম ফোল্ডারও চেক করুন।</p>
    <div style="margin-top:20px;"><a href="/login.html" style="color:#2563eb;font-weight:600;font-size:14px;text-decoration:none;">← লগইনে ফিরুন</a></div>
  </div>
</div>

<script>
async function doForgot() {
  const email = document.getElementById('fp_email').value.trim();
  const err = document.getElementById('fp_err');
  const btn = document.getElementById('fp_btn');
  err.textContent = '';
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    err.textContent = 'সঠিক ইমেইল এড্রেস দিন'; return;
  }
  btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে…';
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    document.getElementById('step-form').classList.add('hidden');
    document.getElementById('step-done').classList.remove('hidden');
  } catch (e) {
    err.textContent = 'নেটওয়ার্ক সমস্যা — আবার চেষ্টা করুন';
    btn.disabled = false; btn.textContent = 'রিসেট লিংক পাঠান →';
  }
}
</script>
</body>
</html>
