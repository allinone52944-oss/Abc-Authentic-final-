<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>পাসওয়ার্ড ভুলে গেছেন - All In One (Abc Authentic)</title>
<link rel="stylesheet" href="/css/coffee.css?v=2">
</head>
<body>
<div class="spiral"></div>
<div class="gold-orb" style="width:300px;height:300px;top:10%;left:5%;"></div>
<div class="gold-orb" style="width:200px;height:200px;bottom:15%;right:8%;animation-delay:-4s;"></div>

<div class="card" style="text-align:center;">
  <div class="logo">
    <h1>☕ ALL IN ONE</h1>
    <p>ABC AUTHENTIC</p>
    <div style="margin-top:12px;color:#c9a961;font-size:14px;letter-spacing:1px;">বিশ্বাস ও সেবার ঠিকানা</div>
  </div>

  <div id="step-form">
    <div style="font-size:52px;margin-bottom:8px;">🔑</div>
    <h3 style="color:var(--gold);margin:8px 0;">পাসওয়ার্ড রিসেট</h3>
    <p style="color:var(--muted);font-size:14px;">আপনার রেজিস্টার্ড ইমেইল দিন —<br>রিসেট লিংক পাঠিয়ে দিচ্ছি (১ ঘণ্টা কার্যকর)।</p>
    <div class="field" style="text-align:left;">
      <label>ইমেইল</label>
      <input type="email" id="fp_email" placeholder="email@example.com">
    </div>
    <div class="err" id="fp_err"></div>
    <button class="btn" id="fp_btn" onclick="doForgot()">রিসেট লিংক পাঠান →</button>
    <div style="margin-top:12px;"><a href="/login.html" style="color:var(--gold);font-size:14px;">← লগইনে ফিরুন</a></div>
  </div>

  <div id="step-done" class="hidden">
    <div style="font-size:52px;margin-bottom:8px;">📧</div>
    <h3 style="color:var(--gold);">ইমেইল পাঠানো হয়েছে!</h3>
    <p style="color:var(--muted);font-size:14px;">অ্যাকাউন্ট থাকলে রিসেট লিংক পেয়ে যাবেন।<br>ইমেইলের স্প্যাম ফোল্ডারও চেক করুন।</p>
    <div style="margin-top:12px;"><a href="/login.html" style="color:var(--gold);font-size:14px;">← লগইনে ফিরুন</a></div>
  </div>
</div>

<script>
async function doForgot() {
  const email = document.getElementById('fp_email').value.trim();
  const err = document.getElementById('fp_err');
  const btn = document.getElementById('fp_btn');
  err.textContent = '';
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    err.textContent = 'সঠিক ইমেইল দিন'; return;
  }
  btn.disabled = true; btn.textContent = 'পাঠানো হচ্ছে…';
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const d = await r.json();
    if (!r.ok) {
      err.textContent = d.error === 'TOO_MANY_REQUESTS'
        ? 'অনেকবার চেষ্টা করেছেন — ১ ঘণ্টা পরে আবার চেষ্টা করুন'
        : 'ব্যর্থ: ' + (d.error || 'অজানা ত্রুটি');
      return;
    }
    document.getElementById('step-form').classList.add('hidden');
    document.getElementById('step-done').classList.remove('hidden');
  } catch (e) { err.textContent = 'সংযোগ ব্যর্থ — আবার চেষ্টা করুন'; }
  finally { btn.disabled = false; btn.textContent = 'রিসেট লিংক পাঠান →'; }
}
document.getElementById('fp_email').addEventListener('keydown', e => { if (e.key === 'Enter') doForgot(); });
</script>
</body>
</html>
