<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>সেবার বিস্তারিত - All In One</title>
<style>
  .back-nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary-700);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 20px;
    padding: 6px 14px;
    border-radius: var(--r-md);
    background: var(--primary-50);
    transition: all 0.15s ease;
  }
  .back-nav:hover {
    background: var(--primary-100);
  }
  .detail-header {
    border-bottom: 1px solid var(--border-light);
    padding-bottom: 20px;
    margin-bottom: 20px;
  }
  .doc-list {
    background: #f8fafc;
    border: 1px solid var(--border-light);
    border-radius: var(--r-md);
    padding: 16px 20px;
    margin: 16px 0;
  }
  .doc-list li {
    margin-bottom: 8px;
    color: var(--text-main);
    font-size: 14px;
  }
  .doc-list li:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo">
      <div class="logo-icon">🔷</div>
      <div>
        <h2>All In One</h2>
        <p>বিশ্বাস ও সেবার ঠিকানা</p>
      </div>
    </div>
    <nav>
      <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico">🏠</span> ড্যাশবোর্ড</div>
      <div class="side-link on" onclick="location.href='/services.html'"><span class="ico">🛎️</span> সকল সেবা</div>
      <div class="side-link" onclick="location.href='/orders.html'"><span class="ico">📦</span> আমার অর্ডার</div>
      <div class="side-link" onclick="location.href='/wallet.html'"><span class="ico">💳</span> ওয়ালেট ও রিচার্জ</div>
      <div class="side-link" onclick="location.href='/profile.html'"><span class="ico">👤</span> পার্সোনাল প্রোফাইল</div>
    </nav>
  </div>

  <div class="main">
    <span class="back-nav" onclick="location.href='/services.html'">← সকল সেবায় ফিরুন</span>
    <div class="card" id="detail">
      <div class="skel" style="height:120px;margin-bottom:12px;"></div>
      <div class="skel" style="height:80px;"></div>
    </div>
  </div>
</div>

<button class="wa-fab" id="waFab" aria-label="WhatsApp-এ সাহায্য চান"><img src="/icons/abc-logo.png" alt="Abc"></button>

<!-- Mobile Tabbar -->
<div class="m-tabbar">
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/dashboard.html'"><div class="ico">🏠</div>হোম</div>
  <div class="m-tab on" aria-current="page"><div class="ico">🛎️</div>সেবা</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/orders.html'"><div class="ico">📦</div>অর্ডার</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/wallet.html'"><div class="ico">💳</div>ওয়ালেট</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/profile.html'"><div class="ico">👤</div>প্রোফাইল</div>
</div>

<script src="/js/app.js?v=13"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const id=new URLSearchParams(location.search).get('id');

async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  const u=(await me.json()).user;
  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent('আমি '+u.name+'। সেবা সম্পর্কে জানতে চাই।'),'_blank');
  };
  const r=await ABC.api('/services/'+id);
  if(!r.ok){
    document.getElementById('detail').innerHTML='<div style="color:#dc2626;padding:20px 0;">সেবাটি খুঁজে পাওয়া যায়নি</div>';
    return;
  }
  const {service:s}=await r.json();
  const docs=(s.documents_required||[]).map(d=>'<li>'+esc(d)+'</li>').join('')||'<li>কোনো বিশেষ ডকুমেন্ট প্রয়োজন নেই</li>';
  const sched=(s.schedule&&s.schedule.open)?'<div style="color:#64748b;font-size:13px;margin:8px 0;">🕘 সেবার সময়সূচি: '+esc(s.schedule.open)+' - '+esc(s.schedule.close||'')+'</div>':'';

  document.getElementById('detail').innerHTML=
    '<div class="detail-header">' +
      '<h2 style="font-size:24px;font-weight:800;color:#0f172a;margin-bottom:8px;">'+esc(s.name_bn||s.name)+'</h2>'+sched+
      '<div style="display:flex;align-items:center;gap:12px;margin-top:12px;">' +
        '<span class="ptype '+(s.type==='manual'?'manual':'auto')+'">'+(s.type==='manual'?'ম্যানুয়াল প্রসেসিং':'স্বয়ংক্রিয় প্রসেসিং')+'</span> '+
        '<span style="font-size:26px;font-weight:800;color:#1e40af;">৳'+Number(s.price).toLocaleString('bn-BD')+'</span>' +
      '</div>' +
    '</div>' +
    '<div style="margin-bottom:16px;">' +
      '<div style="font-size:15px;font-weight:700;color:#334155;">প্রয়োজনীয় তথ্যাদি ও ডকুমেন্ট:</div>' +
      '<ul class="doc-list">'+docs+'</ul>' +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:12px;">' +
      '<button class="btn-secondary" style="width:100%;padding:12px;" onclick="showRules()">📜 নিয়মাবলী ও নির্দেশিকা</button>' +
    '</div>' +
    (s.engine_id==='bdris-certificate'&&s.open?'<button class="btn" style="width:100%;margin-bottom:8px;padding:14px;" onclick="location.href=\'/bdris-certificate.html\'">⚡ এখনই সনদ তৈরি করুন →</button>':'')+
    (s.engine_id==='bdris-apply'&&s.open?'<button class="btn" style="width:100%;margin-bottom:8px;padding:14px;" onclick="location.href=\'/bdris-apply.html\'">⚡ এখনই আবেদন করুন →</button>':'')+
    (s.engine_id==='death-verify'&&s.open?'<button class="btn" style="width:100%;margin-bottom:8px;padding:14px;" onclick="location.href=\'/death-verify.html\'">⚡ এখনই যাচাই করুন →</button>':'')+
    (s.engine_id==='nid-replica'&&s.open?'<button class="btn" style="width:100%;margin-bottom:8px;padding:14px;" onclick="location.href=\'/nid-replica.html\'">⚡ এখনই তৈরি করুন →</button>':'')+
    (s.open?'<button class="btn" style="width:100%;padding:14px;" onclick="location.href=\'/order-create.html?service='+s.id+'\'">অর্ডার করুন →</button>'
           :'<div style="color:#dc2626;margin-top:12px;background:#fef2f2;padding:12px;border-radius:10px;text-align:center;font-weight:600;">⚠️ এই সেবা সাময়িকভাবে বন্ধ আছে</div>');

  window._rules=(s.type==='manual'&&s.manual_instructions)?s.manual_instructions:(s.rules_text||'কোনো বিশেষ নিয়ম নেই।');
}

function showRules(){
  const bg=document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">' +
    '<h3>📜 সেবার নিয়মাবলী ও শর্তাবলী</h3>' +
    '<div style="margin:16px 0;font-size:14px;line-height:1.7;color:#334155;">'+esc(window._rules).replace(/\n/g,'<br>')+'</div>' +
    '<button class="btn" style="width:100%;margin-top:14px;" onclick="this.closest(\'.modal-bg\').remove()">বুঝেছি</button>' +
  '</div>';
  bg.onclick=(e)=>{if(e.target===bg)bg.remove();};
  document.body.appendChild(bg);
}

init();
</script>
</body>
</html>
