<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bnNum(n){return Number(n||0).toLocaleString('bn-BD');}
function safeArray(val){
  if(!val) return [];
  if(Array.isArray(val)) return val;
  if(typeof val === 'string'){
    try { const p = JSON.parse(val); if(Array.isArray(p)) return p; } catch(_){}
  }
  return [];
}
const id=new URLSearchParams(location.search).get('id');

function autoIcon(name){
  const n=String(name||'');
  if(/জন্ম|birth/i.test(n))return '👶';
  if(/মৃত্যু|death/i.test(n))return '🕊️';
  if(/এনআইডি|NID|ভোটার/i.test(n))return '🪪';
  if(/পাসপোর্ট|passport/i.test(n))return '🛂';
  if(/টিকিট|ticket/i.test(n))return '🎫';
  if(/আবেদন|apply|application/i.test(n))return '📝';
  if(/সনদ|certificate/i.test(n))return '📜';
  if(/অর্ডার|order/i.test(n))return '📦';
  if(/রিচার্জ|recharge|বিকাশ|নগদ/i.test(n))return '💳';
  return '🛎️';
}

async function init(){
  const me=await ABC.api('/auth/me');
  if (me.status === 401) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  if (!me.ok) throw new Error('ACCOUNT_UNAVAILABLE');
  const u=(await me.json()).user;
  const userBalance = Number(u.balance || 0);

  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/8801835414122?text='+encodeURIComponent('আমি '+u.name+'। সেবা সম্পর্কে জানতে চাই।'),'_blank');
  };

  if (!id) {
    document.getElementById('detail').innerHTML='<div style="color:#dc2626;padding:20px 0;">কোনো সেবা আইডি উল্লেখ করা হয়নি</div>';
    return;
  }

  const r=await ABC.api('/services/'+encodeURIComponent(id));
  if (r.status === 401) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  if (r.status >= 500 || r.status === 429) throw new Error('SERVICE_UNAVAILABLE');
  if(!r.ok){
    document.getElementById('detail').innerHTML='<div style="color:#dc2626;padding:20px 0;">সেবাটি খুঁজে পাওয়া যায়নি</div>';
    return;
  }
  const {service:s}=await r.json();

  const isAuto = s.type !== 'manual';
  const hasEngine = Boolean(String(s.engine_id || '').trim());
  const catalogType = isAuto || hasEngine ? 'auto' : 'manual';
  const nav = window.ServiceNavigation;
  document.getElementById('backToServiceCatalog').href = nav?.catalogHref?.(null, s.category_id || 'uncategorized') || '/services.html?type=' + catalogType;
  const price = Number(s.price || 0);
  const catName = s.category_name_bn || s.category_name;
  const icon = (s.icon && s.icon !== '🛎️') ? s.icon : autoIcon(s.name_bn || s.name);

  // Docs — B1#4/B2#9: entries are strings (required) or
  // {name, required:false} (optional); optional docs are marked (ঐচ্ছিক).
  const docs=safeArray(s.documents_required).map(d=>{const n=typeof d==='string'?d:(d&&d.name)||'';const opt=d&&typeof d==='object'&&d.required===false;return '<li>📄 '+esc(n)+(opt?' <span style="color:#64748b;">(ঐচ্ছিক)</span>':'')+'</li>';}).join('')||'<li>কোনো বিশেষ ডকুমেন্ট প্রয়োজন নেই</li>';
  const sched = (s.schedule?.open && (isAuto || hasEngine || typeof s.schedule.order_intake_open !== 'boolean'))
    ? '<div style="color:#64748b;font-size:13px;margin:8px 0;">🕘 সেবার সময়সূচি: ' + esc(s.schedule.open) + ' - ' + esc(s.schedule.close || '') + '</div>' : '';

  // Balance Check
  const credit = hasEngine ? 0 : Number(s.service_credit || 0);
  const available = userBalance + credit;
  const creditText = credit ? ' + সেবার ক্রেডিট ৳' + bnNum(credit) : '';
  const hasEnoughBal = available >= price;
  const shortage = Math.max(0, price - available);
  const balBoxHtml = hasEnoughBal ?
    '<div class="bal-box ok">' +
      '<div>' +
        '<div style="font-weight:700;font-size:14px;">✅ এই সেবার জন্য পর্যাপ্ত ব্যালেন্স রয়েছে</div>' +
        '<div style="font-size:12px;margin-top:2px;">বর্তমান ওয়ালেট ব্যালেন্স: <b>৳' + bnNum(userBalance) + creditText + '</b> (প্রয়োজন: ৳' + bnNum(price) + ')</div>' +
      '</div>' +
      '<button class="btn btn-secondary" onclick="location.href=\'/wallet.html\'" style="padding:6px 14px;font-size:13px;">+ ব্যালেন্স দেখুন</button>' +
    '</div>' :
    '<div class="bal-box warn">' +
      '<div>' +
        '<div style="font-weight:700;font-size:14px;color:#b45309;">⚠️ এই সেবার জন্য ৳' + bnNum(shortage) + ' ঘাটতি রয়েছে</div>' +
        '<div style="font-size:12px;margin-top:2px;">বর্তমান ব্যালেন্স: ৳' + bnNum(userBalance) + creditText + ' • সেবার ফি: ৳' + bnNum(price) + '</div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="location.href=\'/wallet.html\'" style="padding:8px 16px;font-size:13px;font-weight:700;">+ এখনই রিচার্জ করুন</button>' +
    '</div>';

  // Service instructions
  let instHtml = '';
  if (s.manual_instructions) {
    instHtml += '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin-bottom:16px;color:#1e40af;font-size:13px;line-height:1.6;">' +
      '<b>📋 সেবার বিশেষ নির্দেশনা:</b><div style="margin-top:6px;white-space:pre-wrap;">' + esc(s.manual_instructions) + '</div></div>';
  }
  // Action CTA Logic
  let actionHtml = '';
  if (!s.open) {
    const officeClosed = s.type === 'manual' && !hasEngine;
    actionHtml = '<div style="color:#dc2626;margin-top:14px;background:#fef2f2;border:1px solid #fecaca;padding:14px;border-radius:12px;text-align:center;font-weight:700;font-size:14px;">' +
      (officeClosed ? 'এখন অফিস বন্ধ' : 'এই সেবাটি সাময়িকভাবে বন্ধ আছে।') + '</div>' +
      (officeClosed ? '<a class="btn btn-secondary" href="/order-create.html?service=' + encodeURIComponent(s.id) + '&amp;flow=directory">আগের অর্ডার দেখুন</a>' : '');
  } else if (hasEngine) {
    // AUTOMATED ENGINE SERVICE: Single focused engine action
    let engineUrl = '/' + encodeURIComponent(s.engine_id) + '.html';
    let engineLabel = '⚡ সরাসরি ইঞ্জিন সেবা শুরু করুন →';
    // The land services share land.html with a mode preselect,
    // except the khatian search, which lives on its own page
    // (audit #6) — without these overrides the generic rule
    // above sends customers to /land-search.html etc., which do
    // not exist (unknown .html paths fall back to the login page,
    // which looked exactly like a forced logout, 2026-10-23).
    if (s.engine_id === 'land-search') { engineUrl = '/land-khatian.html'; engineLabel = '⚡ এখনই খতিয়ান খুঁজুন →'; }
    else if (s.engine_id === 'land-scan') { engineUrl = '/land.html?mode=scan'; engineLabel = '⚡ এখনই নামে সম্পত্তি সন্ধান করুন →'; }
    else if (s.engine_id === 'land-verify') { engineUrl = '/land.html?mode=verify'; engineLabel = '⚡ এখনই জমি যাচাই করুন →'; }
    else if (s.engine_id === 'land-mouza-value') { engineUrl = '/land.html?mode=mouza'; engineLabel = '⚡ এখনই মৌজা মূল্য রিপোর্ট করুন →'; }
    // Explicit even though the generic '/'+engine_id+'.html' rule
    // would also resolve: a new engine must have an explicit map
    // or an exactly-named page (2026-10-23 logout bug); here it
    // gets both, so a routing regression can never send this
    // engine's customers to a nonexistent page / login page.
    else if (s.engine_id === 'land-khatian') { engineUrl = '/land-khatian.html'; engineLabel = '⚡ এখনই খতিয়ান অনুসন্ধান করুন →'; }
    else if (s.engine_id === 'land-mouza-map') { engineUrl = '/land-mouza-map.html'; engineLabel = '⚡ এখনই মৌজা ম্যাপ দেখুন →'; }
    else if (s.engine_id === 'passport') { engineUrl = '/passport.html'; engineLabel = '⚡ এখনই পাসপোর্ট ইঞ্জিন খুলুন →'; }
    else if (s.engine_id === 'epassport') { engineUrl = '/epassport.html'; engineLabel = '⚡ এখনই ই-পাসপোর্ট ইঞ্জিন খুলুন →'; }
    else if (s.engine_id === 'sanad') { engineUrl = '/sanad.html'; engineLabel = '⚡ এখনই সনদ ইঞ্জিন খুলুন →'; }
    else if (s.engine_id === 'birth-final') engineLabel = '⚡ এখনই সনদ তৈরি করুন →';
    else if (s.engine_id === 'bdris-apply') engineLabel = '⚡ এখনই জন্ম নিবন্ধন আবেদন শুরু করুন →';
    else if (s.engine_id === 'death-final') engineLabel = '⚡ এখনই মৃত্যু সনদ যাচাই করুন →';
    else if (s.engine_id === 'nid-replica') engineLabel = '⚡ এখনই NID তৈরি করুন →';
    else if (s.engine_id === 'qr-photo-verify') engineLabel = '⚡ এখনই QR + ছবি যাচাই করুন →';
    else if (s.engine_id === 'nid-server-copy') engineLabel = '⚡ এখনই NID সার্ভার কপি নিন →';
    else if (s.engine_id === 'nid-auto-server-copy') engineLabel = 'তিনটি সার্ভার কপি থেকে বেছে নিন →';
    else if (s.engine_id === 'auto-tin') engineLabel = 'TIN যাচাই করুন →';
    else if (s.engine_id === 'nid-server-report') { engineUrl = '/nid-server-report.html'; engineLabel = '⚡ এখনই সাইন টু সার্ভার কপি নিন →'; }
    else if (s.engine_id === 'nid-smart-card') { engineUrl = '/nid-smart-card.html'; engineLabel = '⚡ এখনই স্মার্ট কার্ড নিন →'; }

    const direct = nav?.destination(s);
    if (direct && !direct.startsWith('/service-detail.html?')) engineUrl = direct;
    actionHtml = '<div style="margin-top:10px;">' +
      '<a class="btn btn-primary" style="width:100%;padding:15px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,0.3);" href="' + esc(engineUrl) + '">' + engineLabel + '</a>' +
      '<div style="font-size:12px;color:#64748b;margin-top:8px;text-align:center;">ℹ️ এটি একটি পূর্ণাঙ্গ স্বয়ংক্রিয় সেবা। বাটনে ক্লিক করে সরাসরি প্রয়োজনীয় তথ্য দিয়ে কাজ সম্পন্ন করুন।</div>' +
    '</div>';
  } else {
    // MANUAL / GENERAL SERVICE - UNIFIED STREAMLINED ORDER FLOW
    actionHtml = '<div style="margin-top:10px;">' +
      '<button class="btn btn-primary" style="width:100%;padding:15px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,0.3);" onclick="location.href=\'/order-create.html?service=' + encodeURIComponent(s.id) + (s.type === 'manual' ? '&amp;flow=directory' : '') + '\'">🛒 আবেদন ও অর্ডার করুন →</button>' +
      '<div style="font-size:12px;color:#64748b;margin-top:8px;text-align:center;">ℹ️ এক ক্লিকে প্রয়োজনীয় তথ্য, নমুনা ফরম্যাট ও ডকুমেন্টস জমা দিয়ে অর্ডার নিশ্চিত করুন।</div>' +
    '</div>';
  }

  document.getElementById('detail').innerHTML =
    '<div class="detail-header">' +
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">' +
        '<div style="width:54px;height:54px;border-radius:14px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;">' + esc(icon) + '</div>' +
        '<div>' +
          '<h2 style="font-size:22px;font-weight:800;color:#0f172a;margin:0 0 4px;">' + esc(s.name_bn || s.name) + '</h2>' +
          '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
            (catName ? '<span style="font-size:12px;color:#64748b;background:#f1f5f9;padding:2px 8px;border-radius:6px;">📁 ' + esc(catName) + '</span>' : '') +
            '<span class="ptype ' + (isAuto ? 'auto' : 'manual') + '">' + (isAuto ? '⚡ স্বয়ংক্রিয়' : '📝 ম্যানুয়াল') + '</span>' +
            (s.open ? '<span class="ptype" style="background:#dcfce7;color:#166534;">চালু</span>' : '<span class="ptype closed">সাময়িক বন্ধ</span>') +
          '</div>' +
        '</div>' +
      '</div>' +
      sched +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;background:#f8fafc;padding:12px 18px;border-radius:12px;border:1px solid #e2e8f0;">' +
        '<div style="font-size:14px;color:#475569;font-weight:600;">সেবা চার্জ:</div>' +
        '<div style="font-size:24px;font-weight:800;color:#1e40af;">' + (s.engine_id === 'nid-auto-server-copy' ? 'সেবাভেদে মূল্য' : '৳' + bnNum(price)) + '</div>' +
      '</div>' +
      // Audit #49 — when the fee is cut (never guessed; only when the
      // API carries a rule and the service is priced).
      ((s.engine_id !== 'nid-auto-server-copy' && price > 0 && s.charge_rule) ?
        '<div style="margin-top:8px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;font-size:13px;color:#1e40af;">💳 <b>' + esc(s.charge_rule.label) + '</b> — ' + esc(s.charge_rule.detail) + (s.charge_rule.rule === 'success' ? '। না পেলে ৳০ — কোনো টাকা কাটা হবে না।' : '।') + '</div>' : '') +
      // B2#4 — BDRIS charges twice, at two separate moments
      // (application ৳90 before submit, original PDF ৳10 before
      // download). Filled from /api/bdris-apply/prices below; the
      // box stays empty if the price fetch fails — the ৳90 above
      // is never wrong, and no amount is ever guessed.
      '<div id="bdrisFeeNote"></div>' +
    '</div>' +

    ((!s.open && !isAuto && !hasEngine) || s.engine_id === 'nid-auto-server-copy' ? '' : balBoxHtml) +

    '<div style="margin-bottom:16px;">' +
      '<div style="font-size:15px;font-weight:700;color:#334155;">প্রয়োজনীয় তথ্যাদি ও ডকুমেন্ট:</div>' +
      '<ul class="doc-list">' + docs + '</ul>' +
    '</div>' +

    instHtml +

    '<div style="display:flex;gap:10px;margin-bottom:14px;">' +
      '<button class="btn-secondary" style="width:100%;padding:12px;font-size:14px;" onclick="showRules()">📜 নিয়মাবলী ও নির্দেশিকা</button>' +
    '</div>' +

    actionHtml;

  const promoHost=document.createElement('section');
  document.getElementById('detail').appendChild(promoHost);
  ABCPromo.mount(promoHost,{service:s,engine:hasEngine,onQuote:q=>{if(q){const link=document.createElement('a');link.className='btn';link.href='/order-create.html?service='+encodeURIComponent(s.id)+(s.type==='manual'&&!hasEngine?'&flow=directory':'');link.textContent='অর্ডার পাতায় কোড প্রয়োগ করুন →';promoHost.querySelector('.promo-result').appendChild(link);}}});
  if (!s.open && !nav?.isManual(s)) nav?.mountHistory(document.querySelector('.main'), s.id);

  // B2#4 — BDRIS fee breakdown (disclosure only; amounts come from
  // the server, never hardcoded). Non-blocking: the detail is
  // already rendered; a failed fetch leaves the note empty.
  if (s.engine_id === 'bdris-apply') {
    ABC.api('/bdris-apply/prices').then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) return;
      const note = document.getElementById('bdrisFeeNote');
      if (!note) return;
      const parts = [];
      if (Number(d.submitPrice) > 0) parts.push('আবেদন ৳' + bnNum(d.submitPrice));
      if (Number(d.pdfPrice) > 0) parts.push('আসল PDF ৳' + bnNum(d.pdfPrice));
      if (!parts.length) return;
      note.innerHTML = '<div style="margin-top:8px;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:13px;color:#92400e;">💰 মোট ফি দুই ধাপে: <b>' + esc(parts.join(' + ')) + '</b> — আবেদন জমার আগে আবেদন ফি, আসল PDF নেওয়ার আগে PDF ফি।</div>';
    }).catch(function () {});
  }

  window._rules = (s.type === 'manual' && s.manual_instructions) ? s.manual_instructions : (s.rules_text || 'কোনো বিশেষ নিয়ম নেই।');
}

function showRules(){
  const bg=document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal">' +
    '<h3>📜 সেবার নিয়মাবলী ও শর্তাবলী</h3>' +
    '<div style="margin:16px 0;font-size:14px;line-height:1.7;color:#334155;max-height:360px;overflow-y:auto;">' + esc(window._rules).replace(/\n/g,'<br>') + '</div>' +
    '<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="this.closest(\'.modal-bg\').remove()">বুঝেছি</button>' +
  '</div>';
  bg.onclick=(e)=>{if(e.target===bg)bg.remove();};
  document.body.appendChild(bg);
}

init().catch(() => {
  document.getElementById('detail').innerHTML = '<div role="alert">তথ্য লোড হয়নি। <button class="btn btn-secondary" onclick="location.reload()">আবার চেষ্টা করুন</button></div>';
});
</script>
<link rel="stylesheet" href="/css/promotions.css?v=20261114-1">
</body>
