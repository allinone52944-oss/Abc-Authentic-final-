<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>মৃত্যু নিবন্ধন যাচাই - All In One</title>
<link rel="stylesheet" href="/css/coffee.css?v=8">
<style>
.steps{display:flex;gap:6px;margin:14px 0 18px;}
.step{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative;padding-top:26px;}
.step .dot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--espresso);}
.step.on{color:var(--gold);}
.step.on .dot{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.4);}
.step.done .dot{border-color:var(--gold);background:var(--gold);color:#2b1d14;}
.step.done{color:var(--gold);}
.wiz{display:none;}
.wiz.on{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.captcha-img{display:block;margin:0 auto 12px;max-width:100%;height:64px;border:2px solid var(--gold);border-radius:10px;background:#fff;image-rendering:pixelated;}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(212,175,55,.3);border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-4px;margin-right:8px;}
@keyframes sp{to{transform:rotate(360deg);}}
.kv{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid rgba(212,175,55,.15);font-size:14px;}
.kv b{color:var(--gold);font-weight:600;}
.kv span{color:var(--cream);text-align:right;max-width:60%;}
#certFrame{width:100%;height:62vh;border:2px solid var(--gold);border-radius:12px;background:#fff;}
.err{display:none;background:rgba(255,90,90,.12);border:1px solid #ff7b7b;color:#ffb3b3;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px;}
.err.on{display:block;}
.ok{display:none;background:rgba(90,200,120,.12);border:1px solid #5ac878;color:#b8f0c8;padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px;}
.ok.on{display:block;}
.row2{display:flex;gap:10px;}
.row2 .btn,.row2 .btn-secondary{flex:1;}
.hint{font-size:12px;color:var(--muted);margin-top:6px;}
</style>
<!-- cache-bust 2026-10-13: force fresh document load -->
</head>
<body class="app">
<div class="spiral"></div>
<div class="app-shell">
  <div class="app-header">
    <div class="brand">☕ মৃত্যু নিবন্ধন যাচাই</div>
    <div class="hdr-actions"><button class="icon-btn" onclick="location.href='/dashboard.html'">🏠</button></div>
  </div>
  <div class="page">
    <span class="back-link" onclick="history.back()">← ফিরে যান</span>
    <div class="steps" id="steps">
      <div class="step on" data-s="1"><span class="dot">১</span>তথ্য</div>
      <div class="step" data-s="2"><span class="dot">২</span>ক্যাপচা</div>
      <div class="step" data-s="3"><span class="dot">৩</span>যাচাই</div>
      <div class="step" data-s="4"><span class="dot">৪</span>সনদ</div>
    </div>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>

    <!-- STEP 1: DRN + DOD -->
    <div class="wiz on" id="w1">
      <div class="form-card">
        <div class="field">
          <label>Death Registration No (১৭ সংখ্যা) *</label>
          <input id="drn" inputmode="numeric" maxlength="17" placeholder="যেমন: 19681517411127048">
        </div>
        <div class="field">
          <label>মৃত্যু তারিখ *</label>
          <input id="dod" type="text" placeholder="dd-mm-yyyy বা yyyy-mm-dd" inputmode="numeric">
        </div>
        <button class="btn" id="b1" onclick="step1()">ক্যাপচা আনুন →</button>
        <div class="hint">BDRIS পোর্টাল (UDRN) থেকে সরাসরি যাচাই করা হবে।</div>
      </div>
    </div>

    <!-- STEP 2: CAPTCHA -->
    <div class="wiz" id="w2">
      <div class="form-card" style="text-align:center;">
        <p style="color:var(--cream);font-size:14px;margin-bottom:10px;">ছবিতে যা লেখা আছে তা লিখুন</p>
        <img class="captcha-img" id="capImg" alt="captcha">
        <div class="field" style="text-align:left;">
          <label>ক্যাপচা উত্তর *</label>
          <input id="capAns" placeholder="উত্তর লিখুন" autocomplete="off">
        </div>
        <div class="row2">
          <button class="btn-secondary" id="bAuto" onclick="autoSolve()">✨ স্বয়ংক্রিয়</button>
          <button class="btn-secondary" onclick="step1(true)">🔄 নতুন ছবি</button>
        </div>
        <div style="height:10px;"></div>
        <button class="btn" id="b2" onclick="step2()">যাচাই করুন →</button>
      </div>
    </div>

    <!-- STEP 3: RECORD -->
    <div class="wiz" id="w3">
      <div class="form-card">
        <h3 style="color:var(--gold);margin-bottom:10px;">✅ মৃত্যু তথ্য পাওয়া গেছে</h3>
        <div id="recView" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
        <style>#recView .field{display:flex;flex-direction:column;}#recView .field label{font-size:12px;color:var(--muted);margin-bottom:4px;}#recView .field input{padding:8px;border:1px solid var(--gold);border-radius:8px;background:rgba(255,255,255,.05);color:inherit;}#recView .full{grid-column:1/-1;}</style>
        <div style="height:12px;"></div>
        <button class="btn" id="b3" onclick="step3()">সনদ তৈরি করুন →</button>
      </div>
    </div>

    <!-- STEP 4: CERTIFICATE -->
    <div class="wiz" id="w4">
      <div class="form-card">
        <h3 style="color:var(--gold);margin-bottom:10px;">🎉 সনদ প্রস্তুত!</h3>
        <iframe id="certFrame" title="death certificate preview"></iframe>
        <div style="height:12px;"></div>
        <button class="btn" id="b4" onclick="dlPdf()">📥 PDF ডাউনলোড</button>
      </div>
    </div>
  </div>
</div>
<div class="wa-fab" id="waFab" title="WhatsApp"><img src="/icons/abc-logo.png" alt="Abc Authentic"><span class="wa-badge">💬</span></div>
<script src="/js/app.js?v=12"></script>
<script>
const API='/death-engine';
let S={sessionId:null,drn:'',dod:'',record:null};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function codOther(sel){const other=document.getElementById(sel.id+'_other');const isOther=(sel.value==='Other'||sel.value==='অন্যান্য');other.style.display=isOther?'block':'none';if(isOther){S.record[sel.id.replace('rec_','')]=other.value;}else{S.record[sel.id.replace('rec_','')]=sel.value;other.value='';}}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),6000);}
function showOk(m){const e=document.getElementById('ok');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),4000);}
function go(n){
  document.querySelectorAll('.wiz').forEach(w=>w.classList.remove('on'));
  document.getElementById('w'+n).classList.add('on');
  document.querySelectorAll('.step').forEach(s=>{
    const k=+s.dataset.s;s.classList.toggle('on',k===n);s.classList.toggle('done',k<n);
    if(k<n)s.querySelector('.dot').textContent='✓';
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function busy(id,on,txt){
  const b=document.getElementById(id);if(!b)return;
  if(on){b.dataset.t=b.innerHTML;b.innerHTML='<span class="spin"></span>'+(txt||'অপেক্ষা করুন…');b.disabled=true;}
  else{b.innerHTML=b.dataset.t||b.innerHTML;b.disabled=false;}
}
function toDDMMYYYY(v){
  let s=String(v||'').trim().replace(/[.\/]/g,'-');
  // If already dd-mm-yyyy, keep as-is
  if(/^\d{1,2}-\d{1,2}-\d{4}$/.test(s)) return s;
  const d=s.replace(/-/g,'');
  if(/^\d{8}$/.test(d)){
    // yyyyMMdd: year 1900-2100, month 01-12, day 01-31
    const y=parseInt(d.slice(0,4)), m=parseInt(d.slice(4,6)), dd=parseInt(d.slice(6,8));
    if(y>=1900 && y<=2100 && m>=1 && m<=12 && dd>=1 && dd<=31) s=d.slice(6,8)+'-'+d.slice(4,6)+'-'+d.slice(0,4);
    else s=d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4,8);
  }
  return s;
}
async function step1(retry){
  const drn=document.getElementById('drn').value.trim();
  const dod=document.getElementById('dod').value;
  if(!/^\d{17}$/.test(drn)){showErr('Death Registration No ঠিক ১৭ সংখ্যার হতে হবে।');return;}
  if(!dod){showErr('মৃত্যু তারিখ দিন।');return;}
  S.drn=drn;S.dod=toDDMMYYYY(dod);
  busy('b1',true,'ক্যাপচা আনা হচ্ছে…');
  try{
    const r=await ABC.api(API+'/api/captcha');
    const j=await r.json();
    if(!j.success)throw new Error(j.error||'ক্যাপচা আসেনি');
    S.sessionId=j.sessionId;
    document.getElementById('capImg').src=j.image;
    document.getElementById('capAns').value='';
    go(2);
  }catch(e){showErr(e.message||'ক্যাপচা আনতে ব্যর্থ। আবার চেষ্টা করুন।');}
  busy('b1',false);
}
async function autoSolve(){
  if(!S.sessionId)return;
  busy('bAuto',true,'চেষ্টা চলছে…');
  try{
    const r=await ABC.api(API+'/api/solve-captcha',{method:'POST',body:{sessionId:S.sessionId}});
    const j=await r.json();
    if(j.success&&j.answer){document.getElementById('capAns').value=j.answer;showOk('স্বয়ংক্রিয় সমাধান বসানো হয়েছে ✓');}
    else throw new Error(j.error||'স্বয়ংক্রিয় সমাধান ব্যর্থ');
  }catch(e){showErr('নিজে লিখুন: '+(e.message||''));}
  busy('bAuto',false);
}
async function step2(){
  const ans=document.getElementById('capAns').value.trim();
  if(!ans){showErr('ক্যাপচা উত্তর লিখুন।');return;}
  busy('b2',true,'BDRIS যাচাই চলছে… (১৫-৪০ সেকেন্ড লাগতে পারে)');
  try{
    const r=await ABC.api(API+'/api/verify',{method:'POST',body:{sessionId:S.sessionId,drn:S.drn,dod:S.dod,captcha:ans}});
    const j=await r.json();
    if(!j.success)throw new Error(j.error||'যাচাই ব্যর্থ');
    S.record=j.data;
    S.record=j.data;
    const d=j.data;
    const fields=[
      ['brn','DRN',d.brn],['nameEn','নাম (EN)',d.nameEn],['nameBn','নাম (বাংলা)',d.nameBn],
      ['dod','মৃত্যু তারিখ',d.dod],['sex','লিঙ্গ',d.sex],
      ['placeOfDeathEn','মৃত্যুর স্থান (EN)',d.placeOfDeathEn],['placeOfDeathBn','মৃত্যুর স্থান (বাংলা)',d.placeOfDeathBn],
      ['causeOfDeathEn','মৃত্যুর কারণ (EN)',d.causeOfDeathEn,'dropdown'],['causeOfDeathBn','মৃত্যুর কারণ (বাংলা)',d.causeOfDeathBn,'dropdown'],
      ['motherNameEn','মাতা (EN)',d.motherNameEn],['motherNameBn','মাতা (বাংলা)',d.motherNameBn],
      ['fatherNameEn','পিতা (EN)',d.fatherNameEn],['fatherNameBn','পিতা (বাংলা)',d.fatherNameBn],
      ['registrationDate','নিবন্ধনের তারিখ',d.registrationDate],
      ['office1','অফিসের নাম',d.office1],['office2','অফিসের ঠিকানা',d.office2]
    ];
    const fullW=['brn','office1','office2'];
    const codOpts=['','Natural Causes','Disease','Accident','Old Age','Other'];
    const codOptsBn=['','স্বাভাবিক কারণ','রোগ','দুর্ঘটনা','বার্ধক্য','অন্যান্য'];
    document.getElementById('recView').innerHTML=fields.map(f=>{
      const cls='field'+(fullW.includes(f[0])?' full':'');
      const lbl='<label>'+esc(f[1])+'</label>';
      if(f[3]==='dropdown'){
        const opts=f[0].includes('Bn')?codOptsBn:codOpts;
        const otherVal=f[0].includes('Bn')?'অন্যান্য':'Other';
        const sel='<select id="rec_'+f[0]+'" onchange="codOther(this)">'+opts.map(o=>'<option value="'+esc(o)+'"'+(o===(f[2]||'')?' selected':'')+'>'+esc(o||'-- নির্বাচন করুন --')+'</option>').join('')+'</select><input type="text" id="rec_'+f[0]+'_other" placeholder="ম্যানুয়ালি লিখুন" style="display:none;margin-top:4px;" oninput="S.record[\''+f[0]+'\']=this.value">';
        return '<div class="'+cls+'">'+lbl+sel+'</div>';
      }
      return '<div class="'+cls+'">'+lbl+'<input type="text" id="rec_'+f[0]+'" value="'+esc(f[2]||'')+'"></div>';
    }).join('')+'<div class="s full" style="color:var(--muted);font-size:12px;">✏️ সব তথ্য এডিট করা যাবে</div>';
    fields.forEach(f=>{const el=document.getElementById('rec_'+f[0]); if(el) el.oninput=()=>{S.record[f[0]]=el.value;};});
    go(3);showOk('মৃত্যু তথ্য যাচাই সফল ✓');
  }catch(e){showErr(e.message||'যাচাই ব্যর্থ।');}
  busy('b2',false);
}
async function step3(){
  busy('b3',true,'সনদ তৈরি হচ্ছে…');
  try{
    const r=await ABC.api(API+'/api/preview',{method:'POST',body:S.record});
    const j=await r.json();
    if(!j.success)throw new Error('প্রিভিউ ব্যর্থ');
    document.getElementById('certFrame').srcdoc=j.html;
    go(4);
  }catch(e){showErr(e.message||'সনদ তৈরি ব্যর্থ।');}
  busy('b3',false);
}
async function dlPdf(){
  busy('b4',true,'PDF তৈরি হচ্ছে…');
  try{
    const r=await ABC.api(API+'/api/pdf',{method:'POST',body:S.record,timeout:60000});
    if(!r.ok)throw new Error('PDF তৈরি ব্যর্থ');
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Death_Certificate_'+S.drn+'.pdf';
    document.body.appendChild(a);a.click();a.remove();
    showOk('PDF ডাউনলোড শুরু হয়েছে ✓');
  }catch(e){showErr(e.message||'PDF ব্যর্থ।');}
  busy('b4',false);
}
(async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  const u=(await me.json()).user;
  document.getElementById('waFab').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent('আমি '+u.name+' (ফোন: '+u.phone+')। মৃত্যু সনদ সম্পর্কে জানতে চাই।'),'_blank');};
})();
</script>
</body>
</html>
