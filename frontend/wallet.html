<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>ওয়ালেট - All In One</title>
<link rel="stylesheet" href="/css/coffee.css?v=5">
<style>
.wallet-hero{
  background: linear-gradient(135deg,#3d2b1f,#2b1d14);
  border:1px solid rgba(212,175,55,0.4);
  border-radius:22px;padding:28px;text-align:center;
  position:relative;overflow:hidden;margin-bottom:14px;
}
.wallet-hero::before{
  content:'';position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,0.35),transparent);
  top:-70px;right:-70px;animation:float 6s ease-in-out infinite;
}
.wallet-hero .amt{color:var(--gold);font-size:44px;font-weight:700;text-shadow:0 0 30px rgba(212,175,55,0.4);}
.wallet-hero .lbl{color:var(--muted);font-size:13px;letter-spacing:3px;margin-top:4px;}
.method-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0;}
.method{
  border:1px solid rgba(212,175,55,0.25);border-radius:14px;padding:14px;
  text-align:center;cursor:pointer;transition:all .25s;background:rgba(0,0,0,0.3);
}
.method:hover{border-color:var(--gold);transform:translateY(-2px);}
.method.sel{border-color:var(--gold);background:rgba(212,175,55,0.12);box-shadow:0 0 20px rgba(212,175,55,0.2);}
.method .e{font-size:28px;}
.method .t{color:var(--cream);font-size:13px;margin-top:4px;}
.coupon-strip{
  display:flex;gap:8px;margin-top:10px;
}
.coupon-strip input{flex:1;}
/* Daily cashback card */
.cb-card{
  background:linear-gradient(135deg,#4a3220,#2b1d14);
  border:1px solid rgba(212,175,55,0.5);border-radius:18px;
  padding:20px;margin-top:14px;position:relative;overflow:hidden;
}
.cb-card::after{
  content:'🎁';position:absolute;right:14px;top:8px;font-size:52px;opacity:.25;
  animation:float 5s ease-in-out infinite;
}
.cb-card .cb-title{color:var(--gold);font-size:17px;font-weight:700;}
.cb-card .cb-amt{color:var(--gold);font-size:34px;font-weight:800;margin:8px 0;
  text-shadow:0 0 25px rgba(212,175,55,0.5);}
.cb-card .cb-sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
.cb-btn{
  background:linear-gradient(135deg,#d4af37,#b8962e);color:#2b1d14;
  border:none;border-radius:12px;padding:13px 30px;font-size:15px;font-weight:800;
  cursor:pointer;transition:transform .2s;box-shadow:0 4px 18px rgba(212,175,55,0.35);
}
.cb-btn:hover:not(:disabled){transform:scale(1.04);}
.cb-btn:disabled{opacity:.55;cursor:default;}
/* Celebration overlay */
#cbOverlay{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:rgba(20,12,7,0.85);backdrop-filter:blur(4px);
}
#cbOverlay.show{display:flex;}
#cbOverlay .big{font-size:64px;animation:pop .6s ease-out;}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.25);}100%{transform:scale(1);}}
#cbOverlay .congrats{color:var(--gold);font-size:30px;font-weight:800;margin:14px 0 6px;
  text-shadow:0 0 30px rgba(212,175,55,0.6);}
#cbOverlay .won{color:var(--cream);font-size:44px;font-weight:800;}
#cbOverlay .code{color:var(--muted);font-size:13px;margin-top:10px;letter-spacing:2px;}
.coin{position:absolute;top:-40px;font-size:26px;animation:coinFall linear forwards;pointer-events:none;}
@keyframes coinFall{to{transform:translateY(110vh) rotate(720deg);}}
</style>
</head>
<body class="app">
<div class="spiral"></div>
<div class="app-shell">
  <div class="app-header">
    <div class="brand">☕ ওয়ালেট</div>
    <div class="hdr-actions"><button class="icon-btn" onclick="location.href='/dashboard.html'">🏠</button></div>
  </div>
  <div class="page">
    <span class="back-link" onclick="location.href='/dashboard.html'">← ড্যাশবোর্ড</span>
    <div class="wallet-hero" style="margin-top:12px;">
      <div class="amt" id="bal">৳০</div>
      <div class="lbl">বর্তমান ব্যালেন্স</div>
    </div>

    <div class="cb-card" id="cbCard" style="display:none;">
      <div class="cb-title">🎁 ডেইলি ক্যাশব্যাক</div>
      <div class="cb-amt" id="cbAmt">৳০</div>
      <div class="cb-sub" id="cbSub"></div>
      <button class="cb-btn" id="cbBtn" onclick="redeemCashback()">রিডিম করুন 🎉</button>
    </div>

    <div class="form-card" style="max-width:640px;">
      <h2>💳 রিচার্জ রিকোয়েস্ট</h2>
      <div class="method-grid" id="methods">
        <div class="method sel" data-m="bkash_payment"><div class="e">📲</div><div class="t">বিকাশ পেমেন্ট</div></div>
        <div class="method" data-m="bkash_personal"><div class="e">📱</div><div class="t">বিকাশ পার্সোনাল</div></div>
        <div class="method" data-m="nagad"><div class="e">🟠</div><div class="t">নগদ</div></div>
        <div class="method" data-m="rocket"><div class="e">🚀</div><div class="t">রকেট</div></div>
      </div>
      <div class="field" id="recvNumWrap" style="display:none;">
        <label>টাকা পাঠান এই নম্বরে</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <div id="recvNum" style="font-size:20px;font-weight:700;color:var(--gold);letter-spacing:1px;"></div>
          <button class="mini-btn" onclick="copyRecvNum()">📋 কপি</button>
        </div>
      </div>
      <div class="field"><label>টাকার পরিমাণ (৳১০ - ৳১,০০,০০০)</label><input type="number" id="amount" placeholder="500" min="10" max="100000"></div>
      <div class="field"><label>যে নম্বর থেকে পাঠিয়েছেন</label><input type="text" id="sender" placeholder="01XXXXXXXXX"></div>
      <div class="field"><label>TrxID</label><input type="text" id="trxid" placeholder="TrxID লিখুন"></div>
      <div class="err" id="err"></div><div class="okmsg" id="ok"></div>
      <button class="btn" onclick="submitRecharge()">রিকোয়েস্ট পাঠান →</button>
    </div>

    <div class="form-card" style="max-width:640px;margin-top:14px;">
      <h2>🎟️ কুপন রিডিম</h2>
      <div class="coupon-strip">
        <input type="text" id="couponCode" placeholder="কুপন কোড" style="padding:13px 16px;background:rgba(0,0,0,0.4);border:1px solid rgba(212,175,55,0.25);border-radius:12px;color:var(--cream);outline:none;">
        <button class="mini-btn" style="padding:13px 22px;font-size:14px;" onclick="redeem()">রিডিম</button>
      </div>
      <div class="err" id="cerr"></div><div class="okmsg" id="cok"></div>
    </div>

    <div class="form-card" style="max-width:640px;margin-top:14px;">
      <h2>📜 লেনদেনের হিসাব</h2>
      <div id="txList"><div style="color:var(--muted)">লোড হচ্ছে…</div></div>
    </div>
  </div>
</div>
<div id="cbOverlay">
  <div class="big">🎉</div>
  <div class="congrats">অভিনন্দন!</div>
  <div class="won" id="cbWon">৳০</div>
  <div class="code" id="cbCode"></div>
  <button class="cb-btn" style="margin-top:22px;" onclick="document.getElementById('cbOverlay').classList.remove('show')">দারুণ! ✨</button>
</div>
<script src="/js/app.js?v=2"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let method='bkash_payment';
let rechargeNums={};
const TYPBN={recharge:'রিচার্জ',cashback:'ক্যাশব্যাক',promo:'প্রোমো',refund:'রিফান্ড',debit:'খরচ',bonus:'বোনাস'};
function updateRecvNum(){
  const num = rechargeNums[method] || '';
  const wrap = document.getElementById('recvNumWrap');
  if (num) {
    document.getElementById('recvNum').textContent = num;
    wrap.style.display = '';
  } else {
    wrap.style.display = 'none';
  }
}
function copyRecvNum(){
  const num = document.getElementById('recvNum').textContent;
  if (num && navigator.clipboard) navigator.clipboard.writeText(num);
}
async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  // Load admin's recharge receiving numbers
  try {
    const nr = await ABC.api('/recharge-numbers');
    if (nr.ok) { const nd = await nr.json(); rechargeNums = nd.numbers || {}; }
  } catch(e) {}
  document.querySelectorAll('#methods .method').forEach(m=>{
    m.onclick=()=>{document.querySelectorAll('#methods .method').forEach(x=>x.classList.remove('sel'));m.classList.add('sel');method=m.dataset.m;updateRecvNum();};
  });
  updateRecvNum();
  loadWallet();
}
async function loadWallet(){
  const r=await ABC.api('/wallet?limit=10');
  if(!r.ok)return;
  const d=await r.json();
  document.getElementById('bal').textContent='৳'+Number(d.balance).toLocaleString('bn-BD');
  document.getElementById('txList').innerHTML=d.transactions.map(t=>
    '<div class="list-row" style="cursor:default;"><div><div class="t">'+(TYPBN[t.type]||t.type)+
    ' <span class="s" style="color:var(--dim)">'+esc(t.trxid||'')+'</span></div>'+
    '<div class="s">'+new Date(t.created_at).toLocaleString('bn-BD')+'</div></div>'+
    '<span class="badge">'+(Number(t.amount)>=0?'+':'')+'৳'+Number(t.amount).toLocaleString('bn-BD')+'</span></div>'
  ).join('')||'<div style="color:var(--muted)">কোনো লেনদেন নেই</div>';
}
async function submitRecharge(){
  const err=document.getElementById('err'),ok=document.getElementById('ok');
  err.textContent='';ok.textContent='';
  const body={method,sender_no:document.getElementById('sender').value.trim(),
    trxid:document.getElementById('trxid').value.trim(),
    amount:document.getElementById('amount').value};
  const r=await ABC.api('/wallet/recharge',{method:'POST',body});
  const d=await r.json();
  if(!r.ok){
    err.textContent={INVALID_AMOUNT:'⚠️ পরিমাণ ৳১০-১০০০০০ হতে হবে',INVALID_SENDER:'⚠️ সঠিক নম্বর দিন',
      DUP_TRXID:'⚠️ এই TrxID আগেই ব্যবহার হয়েছে',TOO_MANY_PENDING:'⚠️ ৩টি pending রিকোয়েস্ট আছে'}[d.error]||('❌ '+d.error);
    return;
  }
  ok.textContent='✅ রিকোয়েস্ট পাঠানো হয়েছে! এডমিন approve করলে ব্যালেন্স যোগ হবে।';
  loadWallet();
}
async function redeem(){
  const cerr=document.getElementById('cerr'),cok=document.getElementById('cok');
  cerr.textContent='';cok.textContent='';
  const code=document.getElementById('couponCode').value.trim();
  if(!code){cerr.textContent='⚠️ কোড লিখুন';return;}
  const r=await ABC.api('/wallet/coupon',{method:'POST',body:{code}});
  const d=await r.json();
  if(!r.ok){cerr.textContent='❌ '+(d.error||'ব্যর্থ');return;}
  cok.textContent='🎉 ৳'+Number(d.credited).toLocaleString('bn-BD')+' যোগ হয়েছে!';
  document.getElementById('couponCode').value='';
  loadWallet();
}
init();
async function loadCashback(){
  const card=document.getElementById('cbCard'),amt=document.getElementById('cbAmt'),
        sub=document.getElementById('cbSub'),btn=document.getElementById('cbBtn');
  try{
    const r=await ABC.api('/cashback/today');
    if(!r.ok)return;
    const d=await r.json();
    if(!d.enabled||d.percent<=0)return; // feature off
    card.style.display='block';
    const bn=n=>(+n).toLocaleString('bn-BD');
    if(d.already_redeemed){
      amt.textContent='৳'+bn(d.cashback_amount);
      sub.textContent='আজকের ক্যাশব্যাক নেওয়া হয়েছে ✅ ('+(d.coupon_code||'')+')';
      btn.disabled=true;btn.textContent='নেওয়া হয়েছে ✅';
    }else if(d.recharge_total>0&&d.cashback_amount>0){
      amt.textContent='৳'+bn(d.cashback_amount);
      sub.textContent='আজকের রিচার্জ ৳'+bn(d.recharge_total)+' × '+d.percent+'% — একবারই নেওয়া যাবে, রাত ১২টায় শেষ!';
      btn.disabled=false;btn.textContent='রিডিম করুন 🎉';
    }else{
      amt.textContent='৳০';
      sub.textContent='আজ এখনো রিচার্জ হয়নি — রিচার্জ করুন, ক্যাশব্যাক পান! 💸';
      btn.disabled=true;btn.textContent='রিচার্জের পর পাবেন';
    }
  }catch(e){}
}
let cbBusy=false;
async function redeemCashback(){
  if(cbBusy)return;cbBusy=true;
  const btn=document.getElementById('cbBtn');
  btn.disabled=true;btn.textContent='প্রসেস হচ্ছে… ⏳';
  try{
    const r=await ABC.api('/cashback/redeem',{method:'POST'});
    const d=await r.json();
    if(!r.ok){
      btn.textContent={ALREADY_REDEEMED_TODAY:'আজ নেওয়া হয়েছে ✅',NOTHING_TO_REDEEM:'কিছু নেই'}[d.error]||'❌ ব্যর্থ';
      cbBusy=false;loadCashback();return;
    }
    // auto-fill coupon code input (user asked: code ready in coupon field)
    document.getElementById('couponCode').value=d.coupon_code;
    celebrate(d.amount,d.coupon_code);
    loadWallet();loadCashback();
  }catch(e){btn.textContent='❌ ব্যর্থ';}
  cbBusy=false;
}
function celebrate(amount,code){
  const ov=document.getElementById('cbOverlay');
  document.getElementById('cbCode').textContent='কুপন: '+code;
  ov.classList.add('show');
  // coin rain
  for(let i=0;i<40;i++){
    const c=document.createElement('div');c.className='coin';
    c.textContent=['🪙','💰','✨'][i%3];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(2+Math.random()*2.5)+'s';
    c.style.animationDelay=(Math.random()*0.8)+'s';
    ov.appendChild(c);
    setTimeout(()=>c.remove(),5500);
  }
  // count-up
  const el=document.getElementById('cbWon');const t0=performance.now(),dur=1500;
  (function tick(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent='৳'+Math.round(amount*e).toLocaleString('bn-BD');
    if(p<1)requestAnimationFrame(tick);
  })(t0);
}
setTimeout(loadCashback,400);
</script>
</body>
</html>
