<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e40af">
<title>ওয়ালেট - All In One</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Hind Siliguri',system-ui,sans-serif; background:#eef2f7; color:#0f172a; }
  .desktop { max-width:1100px; margin:0 auto; background:#fff; min-height:100vh; display:flex; }
  .sidebar { width:220px; background:linear-gradient(180deg,#1e3a8a,#1e40af); color:#fff; padding:20px 0; flex-shrink:0; }
  .side-logo { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:16px; }
  .side-logo h2 { font-size:18px; } .side-logo p { font-size:11px; opacity:0.7; }
  .side-link { display:flex; align-items:center; gap:12px; padding:12px 20px; font-size:14px; color:rgba(255,255,255,0.85); cursor:pointer; border-left:3px solid transparent; }
  .side-link.on { background:rgba(255,255,255,0.12); border-left-color:#fff; color:#fff; font-weight:600; }
  .side-link .ico { font-size:18px; }
  .main { flex:1; padding:24px; overflow:auto; }
  .hero-blue { background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; border-radius:16px; padding:22px; margin-bottom:20px; }
  .hero-blue .wb { font-size:13px; opacity:0.85; }
  .hero-blue .amt { font-size:32px; font-weight:700; margin-top:4px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:15px; margin-bottom:14px; }
  .method-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .method { background:#f8fafc; border:2px solid #e2e8f0; border-radius:12px; padding:14px; text-align:center; cursor:pointer; }
  .method.sel { border-color:#1e40af; background:#eff6ff; }
  .method img { width:40px; height:40px; object-fit:contain; }
  .method div { font-size:12px; margin-top:6px; font-weight:600; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:#334155; }
  .field input { width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; }
  .btn { background:linear-gradient(135deg,#1e40af,#3b82f6); color:#fff; border:none; padding:12px 24px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; font-size:15px; }
  .tx { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .tx:last-child { border:none; }
  .err { color:#dc2626; font-size:13px; margin-top:8px; }
  .okmsg { color:#16a34a; font-size:13px; margin-top:8px; }
  @media (max-width:768px) { .sidebar { display:none; } .method-grid { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo"><h2>🔷 All In One</h2><p>বিশ্বাস ও সেবার ঠিকানা</p></div>
    <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico">🏠</span> ড্যাশবোর্ড</div>
    <div class="side-link" onclick="location.href='/services.html'"><span class="ico">🛎️</span> সেবা</div>
    <div class="side-link" onclick="location.href='/orders.html'"><span class="ico">📦</span> আমার অর্ডার</div>
    <div class="side-link on"><span class="ico">💳</span> ওয়ালেট</div>
    <div class="side-link" onclick="location.href='/profile.html'"><span class="ico">👤</span> প্রোফাইল</div>
  </div>
  <div class="main">
    <div class="hero-blue"><div class="wb">ওয়ালেট ব্যালেন্স</div><div class="amt" id="bal">৳০</div></div>
    <div class="card" id="cbCard" style="display:none;">
      <h3>🎉 আজকের ক্যাশব্যাক</h3>
      <div style="font-size:24px;font-weight:700;color:#1e40af;" id="cbAmt">৳০</div>
      <div style="font-size:13px;color:#64748b;margin:6px 0;" id="cbSub"></div>
      <button class="btn" id="cbBtn" onclick="redeemCashback()">রিডিম করুন 🎉</button>
    </div>
    <div class="card">
      <h3>💰 টাকা যোগ করুন</h3>
      <div class="method-grid" id="methods">
        <div class="method sel" data-m="bkash_payment"><img src="/icons/bkash-logo.webp" alt="bKash"><div>bKash Payment</div></div>
        <div class="method" data-m="bkash_personal"><img src="/icons/bkash-logo.webp" alt="bKash"><div>bKash Personal</div></div>
        <div class="method" data-m="nagad"><img src="/icons/nagad-logo.png" alt="Nagad"><div>Nagad</div></div>
      </div>
      <div class="field" id="recvNumWrap" style="display:none;">
        <label>এই নম্বরে পাঠান</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <div id="recvNum" style="font-size:20px;font-weight:700;color:#1e40af;flex:1;"></div>
          <button class="btn" style="width:auto;padding:8px 16px;" onclick="copyRecvNum()">📋 কপি</button>
        </div>
      </div>
      <div class="field"><label>টাকার পরিমাণ (৳১০ - ৳১,০০,০০০)</label><input type="number" id="amount" placeholder="500" min="10" max="100000"></div>
      <div class="field"><label>যে নম্বর থেকে পাঠিয়েছেন</label><input type="text" id="sender" placeholder="01XXXXXXXXX"></div>
      <div class="field"><label>TrxID</label><input type="text" id="trxid" placeholder="TrxID লিখুন"></div>
      <div class="err" id="err"></div><div class="okmsg" id="ok"></div>
      <button class="btn" onclick="submitRecharge()">রিকোয়েস্ট পাঠান</button>
    </div>
    <div class="card">
      <h3>🎟️ কুপন</h3>
      <div style="display:flex;gap:8px;">
        <input type="text" id="couponCode" placeholder="কুপন কোড" style="flex:1;padding:12px;border:1px solid #e2e8f0;border-radius:10px;">
        <button class="btn" style="width:auto;" onclick="redeem()">রিডিম</button>
      </div>
      <div class="err" id="cerr"></div><div class="okmsg" id="cok"></div>
    </div>
    <div class="card">
      <h3>📜 লেনদেন</h3>
      <div id="txList"><div style="color:#64748b;">লোড হচ্ছে…</div></div>
    </div>
  </div>
</div>
<script src="/js/app.js?v=12"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let method='bkash_payment'; let rechargeNums={};
const TYPBN={recharge:'রিচার্জ',cashback:'ক্যাশব্যাক',promo:'প্রোমো',refund:'রিফান্ড',debit:'খরচ',bonus:'বোনাস'};
function updateRecvNum(){
  const num=rechargeNums[method]||'';
  document.getElementById('recvNumWrap').style.display=num?'':'none';
  if(num) document.getElementById('recvNum').textContent=num;
}
function copyRecvNum(){
  const n=document.getElementById('recvNum').textContent;
  if(n&&navigator.clipboard) navigator.clipboard.writeText(n);
}
async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  try{const nr=await ABC.api('/recharge-numbers');if(nr.ok)rechargeNums=(await nr.json()).numbers||{};}catch(e){}
  document.querySelectorAll('#methods .method').forEach(m=>{
    m.onclick=()=>{document.querySelectorAll('#methods .method').forEach(x=>x.classList.remove('sel'));m.classList.add('sel');method=m.dataset.m;updateRecvNum();};
  });
  updateRecvNum(); loadWallet(); setTimeout(loadCashback,400);
}
async function loadWallet(){
  const r=await ABC.api('/wallet?limit=10'); if(!r.ok)return;
  const d=await r.json();
  document.getElementById('bal').textContent='৳'+Number(d.balance).toLocaleString('bn-BD');
  document.getElementById('txList').innerHTML=d.transactions.map(t=>
    '<div class="tx"><div><b>'+(TYPBN[t.type]||t.type)+'</b> <small style="color:#94a3b8;">'+esc(t.trxid||'')+'</small><br><small style="color:#64748b;">'+new Date(t.created_at).toLocaleString('bn-BD')+'</small></div>'+
    '<b style="color:'+(Number(t.amount)>=0?'#16a34a':'#dc2626')+'">'+(Number(t.amount)>=0?'+':'')+'৳'+Number(t.amount).toLocaleString('bn-BD')+'</b></div>'
  ).join('')||'<div style="color:#64748b;">কোনো লেনদেন নেই</div>';
}
async function submitRecharge(){
  const err=document.getElementById('err'),ok=document.getElementById('ok');
  err.textContent='';ok.textContent='';
  const r=await ABC.api('/wallet/recharge',{method:'POST',body:{method,sender_no:document.getElementById('sender').value.trim(),trxid:document.getElementById('trxid').value.trim(),amount:document.getElementById('amount').value}});
  const d=await r.json();
  if(!r.ok){err.textContent='❌ '+(d.error||'ব্যর্থ');return;}
  ok.textContent='✅ রিকোয়েস্ট পাঠানো হয়েছে!'; loadWallet();
}
async function redeem(){
  const cerr=document.getElementById('cerr'),cok=document.getElementById('cok');
  cerr.textContent='';cok.textContent='';
  const code=document.getElementById('couponCode').value.trim();
  if(!code){cerr.textContent='⚠️ কোড লিখুন';return;}
  const r=await ABC.api('/wallet/coupon',{method:'POST',body:{code}});
  const d=await r.json();
  if(!r.ok){cerr.textContent='❌ '+(d.error||'ব্যর্থ');return;}
  cok.textContent='🎉 ৳'+Number(d.credited).toLocaleString('bn-BD')+' যোগ হয়েছে!';
  document.getElementById('couponCode').value=''; loadWallet();
}
async function loadCashback(){
  const card=document.getElementById('cbCard');
  try{
    const r=await ABC.api('/cashback/today'); if(!r.ok)return;
    const d=await r.json(); if(!d.enabled||d.percent<=0)return;
    card.style.display='block';
    const bn=n=>(+n).toLocaleString('bn-BD');
    document.getElementById('cbAmt').textContent='৳'+bn(d.cashback_amount||0);
    const btn=document.getElementById('cbBtn');
    if(d.already_redeemed){document.getElementById('cbSub').textContent='নেওয়া হয়েছে ✅';btn.disabled=true;btn.textContent='নেওয়া হয়েছে ✅';}
    else if(d.recharge_total>0){document.getElementById('cbSub').textContent='রিচার্জ ৳'+bn(d.recharge_total)+' × '+d.percent+'%';btn.disabled=false;}
    else{document.getElementById('cbSub').textContent='রিচার্জ করুন, ক্যাশব্যাক পান!';btn.disabled=true;}
  }catch(e){}
}
async function redeemCashback(){
  const btn=document.getElementById('cbBtn'); btn.disabled=true; btn.textContent='প্রসেস হচ্ছে…';
  try{
    const r=await ABC.api('/cashback/redeem',{method:'POST'});
    const d=await r.json();
    if(r.ok){document.getElementById('couponCode').value=d.coupon_code;loadWallet();loadCashback();}
    else btn.textContent='❌ ব্যর্থ';
  }catch(e){btn.textContent='❌ ব্যর্থ';}
}
init();
</script>
</body>
</html>
