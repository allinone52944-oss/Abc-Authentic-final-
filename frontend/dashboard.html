<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ড্যাশবোর্ড - All In One (Abc Authentic)</title>

<body class="app">
<div class="spiral"></div>
<div class="gold-orb" style="width:260px;height:260px;top:6%;right:4%;"></div>

<div class="app-shell">
  <div class="app-header">
    <div>
      <div class="brand">☕ ALL IN ONE</div>
      <div class="greet" id="greet">স্বাগতম</div>
    </div>
    <div class="hdr-actions">
      <div class="pill" id="balancePill">৳০</div>
      <button class="icon-btn" id="greetVoiceBtn" title="ভয়েস গ্রিটিং শুনুন" style="display:none;">🔊</button>
      <button class="icon-btn" onclick="location.href='/profile.html'">👤</button>
      <button class="icon-btn" id="logoutBtn">⏻</button>
    </div>
  </div>

  <div class="bn-strip" id="bnStrip" style="display:none;"></div>

  <div class="hub-grid" id="hub">
    <div class="hub-card" onclick="location.href='/wallet.html'">
      <span class="go">➤</span>
      <div class="emoji">💰</div>
      <h3>ওয়ালেট</h3>
      <div class="big" id="hubBalance">৳০</div>
      <div class="sub">রিচার্জ • কুপন • হিসাব</div>
    </div>
    <div class="hub-card" onclick="location.href='/orders.html'">
      <span class="go">➤</span>
      <div class="emoji">📦</div>
      <h3>অর্ডার</h3>
      <div class="big" id="hubOrders">০</div>
      <div class="sub" id="hubOrdersSub">সক্রিয় অর্ডার</div>
    </div>
    <div class="hub-card" onclick="location.href='/services.html'">
      <span class="go">➤</span>
      <div class="emoji">🛎️</div>
      <h3>সেবা</h3>
      <div class="big" id="hubServices">০</div>
      <div class="sub">অটোমেটেড • ম্যানুয়াল</div>
    </div>
    <div class="hub-card wide" onclick="location.href='/services.html'">
      <span class="go">➤</span>
      <div class="emoji">⚡</div>
      <h3>দ্রুত অর্ডার</h3>
      <div class="sub" id="quickServices">সেবা লোড হচ্ছে…</div>
    </div>
    <div class="hub-card" onclick="showNotices()">
      <span class="go">➤</span>
      <div class="emoji">🔔</div>
      <h3>নোটিশ</h3>
      <div class="big" id="hubNotices">০</div>
      <div class="sub">নতুন ঘোষণা</div>
    </div>
  </div>
</div>

<!-- WhatsApp FAB — THE BEST, uncommon animated -->
<div class="wa-fab" id="waFab" title="WhatsApp"><img src="/icons/abc-logo.png" alt="Abc Authentic"><span class="wa-badge">💬</span></div>

<script src="/js/app.js"></script>
<script src="/banners/render.js"></script>
<script>
async function loadBanners() {
  try {
    const r = await ABC.api('/banners?type=banner');
    const d = r.ok ? await r.json() : { banners: [] };
    const act = (d.banners || []).filter((b) => b.active);
    if (!act.length) return;
    document.getElementById('bnStrip').style.display = 'block';
    BannerRender.carousel(document.getElementById('bnStrip'), act, 6000);
  } catch (e) { /* banners optional */ }
}
const GREET_EMOJI = { islam: '🤲', hindu: '🙏', buddhist: '🪷', christian: '✝️', other: '🌸' };
function timeGreeting() {
  const h = new Date().getHours();
  if (h < 11) return 'সুপ্রভাত';
  if (h < 16) return 'শুভ দুপুর';
  if (h < 19) return 'শুভ সন্ধ্যা';
  return 'শুভ রাত্রি';
}
// Resolve greeting text+emoji from admin config (voice_greeting.greetings).
// Empty text for "other" falls back to time-based greeting.
function resolveGreeting(religion, cfg) {
  const r = ['islam', 'hindu', 'buddhist', 'christian', 'other'].includes(religion) ? religion : 'other';
  const g = (cfg && cfg.greetings) || {};
  let text = String(g[r] || '').trim();
  if (!text && r === 'other') text = timeGreeting();
  if (!text) text = 'শুভেচ্ছা';
  return { text, emoji: GREET_EMOJI[r] };
}
const bnNum = (n) => Number(n || 0).toLocaleString('bn-BD');

/* ============ Religion voice greeting (Web Speech API, bn-BD) ============
   Plays ONCE right after login (one-shot flag set by login.html).
   Voice rotation: male -> female -> child -> male... (localStorage index).
   Prefers real gendered Bengali voices; falls back to pitch simulation. */
const GreetVoice = {
  _cfg: null,
  _lastText: '',
  _lastVoice: 0,
  userEnabled() {
    try { return localStorage.getItem('abc_greet_voice') !== 'off'; } catch (e) { return true; }
  },
  pickVoice(voices, voiceIdx) {
    const bn = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith('bn'));
    if (voiceIdx === 0) return bn.find((v) => /male/i.test(v.name) && !/female/i.test(v.name)) || null;
    if (voiceIdx === 1) return bn.find((v) => /female/i.test(v.name)) || null;
    return null; // child: pitch simulation only
  },
  speak(text, voiceIdx, cfg) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'bn-BD';
      const voices = speechSynthesis.getVoices();
      const real = this.pickVoice(voices, voiceIdx);
      if (real) {
        u.voice = real; // real gendered Bengali voice: use as-is
      } else {
        const bn = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('bn'));
        if (bn) u.voice = bn;
        // Pitch simulation: male 0.8 / female 1.2 / child 1.5
        const sim = [
          { pitch: 0.8, rate: 1.0 },
          { pitch: 1.2, rate: 1.0 },
          { pitch: 1.5, rate: 1.1 },
        ][voiceIdx] || { pitch: 1, rate: 1 };
        if (cfg && cfg.rotation === false) { u.pitch = 1; u.rate = 1; }
        else { u.pitch = sim.pitch; u.rate = sim.rate; }
      }
      const btn = document.getElementById('greetVoiceBtn');
      u.onerror = (e) => {
        // Autoplay blocked: draw attention to the 🔊 fallback button
        if (btn && (e.error === 'not-allowed' || e.error === 'interrupted')) {
          btn.style.display = '';
          btn.style.animation = 'cardIn 0.6s';
          btn.style.boxShadow = '0 0 0 3px rgba(212,175,55,.7)';
          setTimeout(() => { btn.style.boxShadow = ''; }, 4000);
        }
      };
      speechSynthesis.speak(u);
    } catch (e) { /* speech not supported */ }
  },
  replay() {
    if (this._lastText) this.speak(this._lastText, this._lastVoice, this._cfg);
  },
  async maybePlay(user) {
    // One-shot: consume the login flag immediately (login only, never on refresh)
    let flag = null;
    try {
      flag = JSON.parse(sessionStorage.getItem('abc_greet_on_login') || 'null');
      sessionStorage.removeItem('abc_greet_on_login');
    } catch (e) { try { sessionStorage.removeItem('abc_greet_on_login'); } catch (e2) {} }
    if (!flag || !this.userEnabled()) return;
    const cfg = window._vgCfg || {};
    if (cfg.enabled === false) return;
    this._cfg = cfg;
    const g = resolveGreeting(user.religion, cfg);
    const text = g.text + ', ' + user.name + '! All In One-এ স্বাগতম';
    this._lastText = text;
    this._lastVoice = (typeof flag.voice === 'number') ? flag.voice : 0;
    // Show the 🔊 replay/fallback button
    const btn = document.getElementById('greetVoiceBtn');
    if (btn) { btn.style.display = ''; btn.onclick = () => this.replay(); }
    // Small delay so voices finish loading
    setTimeout(() => this.speak(text, this._lastVoice, cfg), 700);
  },
};

async function init() {
  const meR = await ABC.api('/auth/me');
  if (!meR.ok) { location.href = '/login.html'; return; }
  const { user } = await meR.json();
  window._user = user;

  // Voice-greeting config (admin-controlled, public endpoint)
  try {
    const ps = await fetch('/api/public/settings');
    if (ps.ok) { const pj = await ps.json(); window._vgCfg = pj.voice_greeting || {}; }
  } catch (e) { window._vgCfg = {}; }

  // Religion greeting (visual) — once per tab session, admin texts + emoji
  const gk = 'abc_greeted_' + user.id;
  const greetEl = document.getElementById('greet');
  if (!sessionStorage.getItem(gk)) {
    const g = resolveGreeting(user.religion, window._vgCfg);
    greetEl.innerHTML = escapeHtml(g.text) + ' ' + g.emoji + ' <small>' + escapeHtml(user.name) + '</small>';
    greetEl.style.animation = 'cardIn 0.8s';
    sessionStorage.setItem(gk, '1');
  } else {
    greetEl.innerHTML = 'স্বাগতম <small>' + escapeHtml(user.name) + '</small>';
  }

  // Religion VOICE greeting — only right after login (one-shot flag)
  GreetVoice.maybePlay(user);

  document.getElementById('balancePill').textContent = '৳' + bnNum(user.balance);
  document.getElementById('hubBalance').textContent = '৳' + bnNum(user.balance);

  // Orders summary
  const oR = await ABC.api('/orders?limit=1');
  if (oR.ok) {
    const d = await oR.json();
    document.getElementById('hubOrders').textContent = bnNum(d.total);
    const act = d.orders.filter(o => ['new','pending','processing'].includes(o.status)).length;
    document.getElementById('hubOrdersSub').textContent = 'সক্রিয়: ' + bnNum(act);
  }

  // Services
  const sR = await ABC.api('/services');
  if (sR.ok) {
    const d = await sR.json();
    document.getElementById('hubServices').textContent = bnNum(d.services.length);
    const names = d.services.slice(0, 3).map(s => s.name_bn || s.name).join(' • ');
    document.getElementById('quickServices').textContent = names || 'কোনো সেবা নেই';
  }

  // Notices
  const nR = await ABC.api('/notices');
  if (nR.ok) {
    const d = await nR.json();
    document.getElementById('hubNotices').textContent = bnNum(d.notices.length);
  }

  // Banners carousel (Phase 3)
  loadBanners();

  // WhatsApp FAB — auto user info
  document.getElementById('waFab').onclick = () => {
    const text = 'আসসালামু আলাইকুম! আমি ' + user.name +
      ' (ID: ' + user.id.slice(0, 8) + ', ফোন: ' + user.phone + ')। সাহায্য দরকার।';
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  };

  document.getElementById('logoutBtn').onclick = async () => {
    const rt = localStorage.getItem('abc_refresh_token');
    await ABC.api('/auth/logout', { method: 'POST', body: { refresh_token: rt } });
    ABC.clearTokens();
    location.href = '/login.html';
  };
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function showNotices() {
  const r = await ABC.api('/notices');
  const d = r.ok ? await r.json() : { notices: [] };
  const list = d.notices.map(n =>
    '<li><b>' + escapeHtml(n.title) + '</b><br>' + escapeHtml(n.message) + '</li>'
  ).join('') || '<li>কোনো নোটিশ নেই</li>';
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal"><h3>🔔 নোটিশ</h3><ul style="padding-left:18px;">' +
    list + '</ul><button class="btn" onclick="this.closest(\'.modal-bg\').remove()">বন্ধ করুন</button></div>';
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
}

init();
</script>
</body>
</html>
