<!DOCTYPE html>
<html lang="bn">
<head>
<script src="/js/socket.io.min.js"></script>
<script>
// Require login for BDRIS Apply (bot needs auth)
(function() {
  const token = sessionStorage.getItem('abc_access_token') || localStorage.getItem('abc_access_token');
  if (!token) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname);
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জন্ম নিবন্ধন সহায়ক — অনলাইন আবেদন</title>
<!-- L-12 fix (2026-10-15): fonts served locally (was: Google Fonts CDN) -->
<link rel="stylesheet" href="/fonts/hind-siliguri.css">
<style>
:root{
  /* ☕ কফি থিম (2026-10-13): ডিপ এসপ্রেসো + ক্যারামেল + ক্রিম — মোবাইল ও ডেস্কটপ */
  --bg:#160f08; --card:#221610; --card2:#2f2015; --paper:#1c130c;
  --gold:#f0c078; --brand:#c98d4b; --gold-deep:#8a5a28;
  --grad:linear-gradient(135deg,#f0c078,#c98d4b 55%,#8a5a28);
  --ink:#f7ead6; --muted:#c0a080; --line:rgba(201,141,75,.28); --line2:rgba(201,141,75,.14);
  --ok:#7bc98d; --warn:#f0c078; --err:#e08080; --info:#a8c8e0;
  --r:16px; --rlg:22px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Hind Siliguri',system-ui,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.65;
  background-image:
    radial-gradient(900px 420px at 85% -80px, rgba(201,141,75,.16), transparent 65%),
    radial-gradient(700px 380px at -10% 30%, rgba(201,141,75,.08), transparent 60%),
    radial-gradient(900px 500px at 110% 85%, rgba(138,90,40,.10), transparent 60%);
  background-attachment:fixed;
}
::selection{background:rgba(201,141,75,.35)}
.wrap{max-width:900px; margin:0 auto; padding:20px 16px 60px}
a{color:var(--gold)}

/* ── topbar ── */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none}
.blogo{
  width:52px; height:52px; border-radius:15px; display:grid; place-items:center;
  background:var(--grad); color:#241a02; font-size:27px; font-weight:700;
  box-shadow:0 6px 22px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.bname{font-size:20px; font-weight:700; letter-spacing:.2px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.btag{font-size:12px; color:var(--muted); margin-top:-3px}
.hacts{display:flex; gap:9px; flex-wrap:wrap}

/* ── buttons ── */
.btn{
  font-family:inherit; font-size:15px; font-weight:600; color:#241a02;
  background:var(--grad); border:0; border-radius:13px; padding:11px 20px; cursor:pointer;
  box-shadow:0 5px 18px rgba(212,175,55,.28), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .12s, filter .15s, opacity .15s; position:relative;
}
.btn:hover{filter:brightness(1.07); transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; filter:grayscale(.3)}
.btn.ghost{
  background:rgba(212,175,55,.08); color:var(--gold); border:1px solid var(--line);
  box-shadow:none;
}
.btn.ghost:hover{background:rgba(212,175,55,.15)}
.btn.small{font-size:13px; padding:8px 14px; border-radius:11px}
.btn.danger{background:rgba(251,113,133,.12); color:var(--err); border:1px solid rgba(251,113,133,.35); box-shadow:none}
.btn.danger:hover{background:rgba(251,113,133,.2)}
.btn.wide{width:100%; padding:14px 20px; font-size:16px}

/* ── card ── */
.card{
  background:linear-gradient(180deg, var(--card), var(--paper));
  border:1px solid var(--line2); border-radius:var(--rlg); padding:26px 24px;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(245,214,123,.06);
  position:relative; overflow:hidden;
}
.card::before{
  content:''; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg, transparent, var(--brand), transparent); opacity:.75;
}

/* ── banner ── */
.banner{display:flex; align-items:center; gap:10px; padding:12px 15px; border-radius:var(--r);
  font-size:14px; margin-bottom:16px; border:1px solid; flex-wrap:wrap}
.banner .bmsg{flex:1; min-width:180px}
.banner.ok{background:rgba(52,211,153,.1); border-color:rgba(52,211,153,.4); color:var(--ok)}
.banner.warn{background:rgba(251,191,36,.1); border-color:rgba(251,191,36,.4); color:var(--warn)}
.banner.err{background:rgba(251,113,133,.1); border-color:rgba(251,113,133,.4); color:var(--err)}
.banner.info{background:rgba(125,211,252,.1); border-color:rgba(125,211,252,.4); color:var(--info)}

/* ── stepper ── */
.stepper{display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px}
.stp{
  display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:11px;
  border:1px solid var(--line2); background:rgba(10,17,40,.6); color:var(--muted);
  font-size:13px; white-space:nowrap; flex:1; min-width:0;
}
.stp .n{width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  background:rgba(212,175,55,.1); color:var(--muted); font-size:12px; font-weight:700; flex:none}
.stp.active{border-color:var(--brand); color:var(--gold); background:rgba(212,175,55,.1)}
.stp.active .n{background:var(--grad); color:#241a02}
.stp.done{border-color:rgba(52,211,153,.4); color:var(--ok)}
.stp.done .n{background:rgba(52,211,153,.2); color:var(--ok)}

/* ── section headings ── */
.sec{margin:22px 0 12px; padding-top:4px}
.sec:first-child{margin-top:0}
.sub-h{display:flex; align-items:center; gap:9px; font-size:16px; font-weight:700; color:var(--gold); margin-bottom:11px}
.snum{width:26px; height:26px; border-radius:8px; background:var(--grad); color:#241a02;
  display:grid; place-items:center; font-size:13px; font-weight:700; flex:none}
.hint{font-size:12.5px; color:var(--muted); margin:-4px 0 10px}

/* ── fields ── */
.fld{margin-bottom:13px}
.fld label, .lbl{display:block; font-size:13.5px; color:var(--muted); margin-bottom:5px}
.fld label b, .lbl b{color:var(--gold); font-weight:600}
input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], input:not([type]), select, textarea{
  width:100%; font-family:inherit; font-size:15px; color:var(--ink);
  background:rgba(7,13,31,.85); border:1px solid var(--line); border-radius:11px;
  padding:10px 13px; outline:none; transition:border-color .15s, box-shadow .15s;
}
select{cursor:pointer}
select option{background:#221610; color:var(--ink)}
input::placeholder{color:rgba(154,163,199,.5)}
input:focus, select:focus, textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(212,175,55,.15)}
input.bad, select.bad{border-color:var(--err); box-shadow:0 0 0 3px rgba(251,113,133,.15); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

/* ── radio cards ── */
.rcard{
  display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--r);
  border:1px solid var(--line); background:rgba(10,17,40,.6); cursor:pointer;
  transition:border-color .15s, background .15s; margin-bottom:9px;
}
.rcard:hover{border-color:var(--brand)}
.rcard input{display:none}
.rcard .rdot{width:19px; height:19px; border-radius:50%; border:2px solid var(--muted); flex:none; position:relative; transition:border-color .15s}
.rcard.sel{border-color:var(--brand); background:rgba(212,175,55,.09)}
.rcard.sel .rdot{border-color:var(--brand)}
.rcard.sel .rdot::after{content:''; position:absolute; inset:3px; border-radius:50%; background:var(--grad)}
.rcard .rt{font-size:14.5px; font-weight:600}
.rcard .rs{font-size:12px; color:var(--muted)}
.rcard.rsm{padding:11px 12px; margin-bottom:0}
.relgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(112px,1fr)); gap:9px; margin-bottom:14px}
.relgrid .rcard .rt{font-size:13.5px}
.chk{display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border-radius:var(--r);
  border:1px solid var(--line2); background:rgba(10,17,40,.5); cursor:pointer; font-size:14px; margin-bottom:9px}
.chk input{width:18px; height:18px; accent-color:var(--brand); margin-top:2px; flex:none}

/* ── hero: আপলোড করা ডিজাইনের সাথে matching (glass + spiral + beans) ── */
.hero{position:relative; overflow:hidden; text-align:center; padding:30px 18px 24px;
  border-radius:var(--rlg); background:rgba(43,29,20,.78);
  border:1px solid rgba(212,175,55,.3);
  box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 50px rgba(212,175,55,.08);
  animation:cardIn .7s cubic-bezier(.2,.8,.2,1); margin-bottom:14px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
.hero::before{content:''; position:absolute; width:220%; aspect-ratio:1; left:-60%; top:-130%;
  background:conic-gradient(from 0deg,#3d2b1f,#2b1d14,#4a3220,#2b1d14,#3d2b1f);
  animation:spin 45s linear infinite; opacity:.55; pointer-events:none}
.hero::after{content:''; position:absolute; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,55,.22), transparent);
  top:-60px; right:-40px; animation:float 7s ease-in-out infinite; pointer-events:none}
.hero > *{position:relative; z-index:1}
@keyframes cardIn{from{opacity:0; transform:translateY(30px) scale(.97)} to{opacity:1; transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}
@keyframes beanFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-34px) rotate(160deg)}}
.hbean{position:absolute; font-size:28px; opacity:.16; animation:beanFloat 10s ease-in-out infinite;
  pointer-events:none; z-index:0; filter:sepia(1) saturate(2)}
.hero .hico{filter:drop-shadow(0 0 16px rgba(212,175,55,.45))}
.hero .htitle{text-shadow:0 0 26px rgba(212,175,55,.35)}
.hero .hpill{background:rgba(0,0,0,.3)}
.hpill{display:inline-block; font-size:12px; color:var(--gold); border:1px solid var(--line);
  border-radius:99px; padding:5px 14px; margin-bottom:14px; background:rgba(212,175,55,.07)}
.htitle{font-size:29px; font-weight:700; line-height:1.35}
.htitle .gold{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.hsub{color:var(--muted); font-size:15px; margin:11px auto 0; max-width:540px}
.hero .hico{font-size:52px; line-height:1.2; margin-bottom:6px}

/* ── mode cards ── */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:22px 0 8px}
.mode-card{
  text-align:left; border:1px solid var(--line); border-radius:var(--rlg); padding:20px 18px;
  background:linear-gradient(180deg, var(--card2), rgba(10,17,40,.7)); cursor:pointer;
  transition:transform .15s, border-color .15s, box-shadow .15s; font-family:inherit; color:var(--ink);
}
.mode-card:hover{transform:translateY(-3px); border-color:var(--brand); box-shadow:0 14px 34px rgba(0,0,0,.4)}
.mico{width:46px; height:46px; border-radius:13px; display:grid; place-items:center; font-size:23px;
  background:rgba(212,175,55,.12); border:1px solid var(--line); margin-bottom:12px}
.mt{font-size:17px; font-weight:700; color:var(--gold); margin-bottom:5px}
.ms{font-size:13px; color:var(--muted); line-height:1.6}
.mtag{display:inline-block; font-size:11px; color:#241a02; background:var(--grad); border-radius:99px;
  padding:2px 10px; font-weight:700; margin-left:7px; vertical-align:middle}

/* ── address wrap + fab ── */
.addrwrap{border:1px solid var(--line2); border-radius:var(--r); padding:14px 14px 4px; background:rgba(10,17,40,.45); margin-bottom:13px}
.addrwrap .ah{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.addrwrap .ah .t{font-size:14.5px; font-weight:700; color:var(--gold)}
.fab{
  position:sticky; bottom:14px; float:right; z-index:5;
  font-family:inherit; font-size:13px; font-weight:600; color:var(--gold);
  background:rgba(14,23,48,.95); border:1px solid var(--line); border-radius:99px;
  padding:9px 16px; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.5); backdrop-filter:blur(6px);
}
.fab:hover{background:rgba(212,175,55,.14)}

/* ── docs ── */
.docrow{display:grid; grid-template-columns:46px 1.4fr 1fr auto; gap:9px; align-items:center;
  border:1px solid var(--line2); border-radius:13px; padding:9px 11px; margin-bottom:9px; background:rgba(10,17,40,.5)}
.docrow .dthumb{width:46px; height:46px; object-fit:cover; border-radius:9px; border:1px solid var(--line2); cursor:pointer}
.docrow .dname{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.docrow .dtype{font-size:13px; padding:8px 10px; border-radius:9px}
.docrow .dx{background:rgba(251,113,133,.12); color:var(--err); border:1px solid rgba(251,113,133,.3);
  border-radius:9px; width:34px; height:34px; cursor:pointer; font-size:15px; font-family:inherit}
.docrow .dx:hover{background:rgba(251,113,133,.22)}

/* ── verify badge ── */
.vbadge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; border-radius:99px;
  padding:3px 11px; border:1px solid; margin:4px 0 2px}
.vbadge.ok{color:var(--ok); border-color:rgba(52,211,153,.4); background:rgba(52,211,153,.08)}
.vbadge.warn{color:var(--warn); border-color:rgba(251,191,36,.4); background:rgba(251,191,36,.08)}
.vbadge.wait{color:var(--muted); border-color:var(--line2); background:rgba(10,17,40,.5)}

/* ── live note ── */
.livenote{display:none; align-items:center; gap:10px; margin-top:16px; padding:12px 15px;
  border-radius:var(--r); font-size:14px; border:1px solid var(--line2); background:rgba(10,17,40,.6); color:var(--muted)}
.livenote.on{display:flex}
.livenote.ok{color:var(--ok); border-color:rgba(52,211,153,.4)}
.livenote.warn{color:var(--warn); border-color:rgba(251,191,36,.4)}
.livenote.err{color:var(--err); border-color:rgba(251,113,133,.4)}
.livenote.info{color:var(--info); border-color:rgba(125,211,252,.4)}

/* ── failbox ── */
.failbox{display:none; margin-top:14px; border:1px solid rgba(251,113,133,.4); border-radius:var(--r);
  background:rgba(251,113,133,.07); padding:13px 15px; font-size:13.5px; color:var(--err)}
.failbox.on{display:block}
.failbox ul{margin:6px 0 0 18px}

/* ── progress rows ── */
.prow{display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--r);
  border:1px solid var(--line2); background:rgba(10,17,40,.55); margin-bottom:9px; font-size:14.5px}
.prow .pdot{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:rgba(212,175,55,.1); color:var(--muted); font-size:12px}
.prow.active{border-color:var(--brand); color:var(--gold); background:rgba(212,175,55,.08)}
.prow.active .pdot{background:var(--grad); color:#241a02}
.prow.done{border-color:rgba(52,211,153,.35); color:var(--ok)}
.prow.done .pdot{background:rgba(52,211,153,.18); color:var(--ok)}
.prow.err{border-color:rgba(251,113,133,.45); color:var(--err)}
.prow.err .pdot{background:rgba(251,113,133,.18); color:var(--err)}
.prow .pt{margin-left:auto; font-size:12px; color:var(--muted)}

/* ── otp boxes ── */
.otpboxes{display:flex; gap:9px; justify-content:center; margin:16px 0; direction:ltr}
.otpbox{width:48px; height:56px; text-align:center; font-size:23px; font-weight:700; color:var(--gold);
  background:rgba(7,13,31,.9); border:1px solid var(--line); border-radius:12px; outline:none; font-family:inherit}
.otpbox:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(212,175,55,.18)}

/* ── ack hero ── */
.ackhero{text-align:center; padding:20px 0 6px}
.ackhero .lbl{font-size:13.5px; color:var(--muted); letter-spacing:.4px}
.acknum{
  font-size:clamp(22px,5.4vw,36px); font-weight:700; letter-spacing:1.5px; margin:10px 0 4px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  word-break:break-all;
}
.copyrow2{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px}
.doneimg{max-width:100%; border-radius:var(--r); border:1px solid var(--line); margin-top:16px}

/* ── drafts / address book cards ── */
.draft-card{border:1px solid var(--line2); border-radius:var(--r); padding:15px 16px; margin-bottom:11px;
  background:rgba(10,17,40,.55); display:flex; align-items:center; gap:13px; flex-wrap:wrap}
.draft-card .di{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px;
  background:rgba(212,175,55,.1); border:1px solid var(--line2); flex:none}
.draft-card .dt{font-weight:600; font-size:15px}
.draft-card .ds{font-size:12.5px; color:var(--muted)}
.draft-card .da{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}

/* ── status table (আবেদনের অবস্থা) ── */
.stbl{width:100%; border-collapse:collapse; font-size:13.5px}
.stbl th{text-align:left; padding:9px 11px; color:var(--gold); font-weight:600; border-bottom:1px solid var(--line2); white-space:nowrap}
.stbl td{padding:9px 11px; border-bottom:1px solid rgba(212,175,55,.1); color:var(--ink)}
.stbl tr:last-child td{border-bottom:none}

/* ── spin ── */
.spin{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(212,175,55,.25);
  border-top-color:var(--gold); animation:sp 0.8s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.skeleton{border-radius:9px; background:linear-gradient(90deg, rgba(212,175,55,.06), rgba(212,175,55,.14), rgba(212,175,55,.06));
  background-size:200% 100%; animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

.footer{text-align:center; color:var(--muted); font-size:12.5px; margin-top:26px; line-height:1.9}
.footer .fl{color:var(--gold)}
.hidden{display:none !important}
.mt8{margin-top:8px} .mt14{margin-top:14px} .mt20{margin-top:20px}
.center{text-align:center} .small{font-size:13px} .muted{color:var(--muted)}

/* ── আবেদন প্রিভিউ (নথির ধাঁচে — জমার আগে মিলিয়ে দেখার পর্দা) ── */
.pvsheet{border:1px solid var(--line); border-radius:var(--rlg);
  background:linear-gradient(180deg, rgba(20,31,66,.6), rgba(10,17,40,.82)); padding:18px 16px 8px; margin-bottom:8px}
.pvhead{text-align:center; padding-bottom:12px; border-bottom:1px solid var(--line2); margin-bottom:4px}
.pvhead .pvt{font-size:19px; font-weight:700; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.pvhead .pvs{font-size:12.5px; color:var(--muted)}
.pvsec{margin:15px 0 3px; font-size:14.5px; font-weight:700; color:var(--gold); display:flex; align-items:center; gap:8px}
.pvsec .pvedit{margin-left:auto; font-size:12px; font-weight:600; padding:5px 11px; border-radius:99px}
.pvrow{display:grid; grid-template-columns:165px 1fr; gap:10px; padding:7px 2px;
  border-bottom:1px dashed rgba(212,175,55,.14); font-size:14px}
.pvrow:last-child{border-bottom:none}
.pvl{color:var(--muted); font-size:13px}
.pvv{color:var(--ink); overflow-wrap:anywhere}

@media (max-width:760px){
  .wrap{padding:14px 10px 50px}
  .card{padding:19px 14px; border-radius:18px}
  .htitle{font-size:23px}
  .modes{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr 1fr; gap:10px}
  .hacts{width:100%}
  .hacts .btn{flex:1}
  .stp{flex:none; min-width:118px}
  .otpbox{width:41px; height:50px; font-size:20px}
  .docrow{grid-template-columns:46px 1fr auto; }
  .docrow .dtype{grid-column:2 / -1}

   (1) auth callback reads the CURRENT token on every (re)connect,
   (2) connect_error triggers one silent refresh + retry,

const LS_ACCESS_T = 'abc_access_token', LS_REFRESH_T = 'abc_refresh_token';

    let rt = ''; try { rt = localStorage.getItem(LS_REFRESH_T) || ''; } catch (e) {}
    if (!rt) return false;
    try {
      const r = await fetch('/api/auth/refresh', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: rt })

  // transient warning so a dead backend is never mistaken for a silent hang

  }

/* ═══════════ সেশন জাগিয়ে রাখা — ট্যাব খোলা মানে বট প্রস্তুত ═══════════
   সার্ভার ~২৫ মিনিট নিষ্ক্রিয়তায় ব্রাউজার বন্ধ করে দেয়; ট্যাব খোলা রেখে

const REL_MINOR = ['পিতা', 'মাতা', 'পিতামহ', 'পিতামহী', 'মাতামহ', 'মাতামহী', 'অভিভাবক', 'অন্যান্য'];

/* ═══════════ date of birth helpers (copy-paste friendly, 2026-10-11) ═══════════ */
function bnDigits(s) {
  return String(s || '').replace(/[০-৯]/g, (d) => String('০১২৩৪৫৬৭৮৯'.indexOf(d)));
}
function dobDisplay(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
}
function dobParse(raw) {
  const b = bnDigits(raw).trim();
  let d, mo, y;
  const f = b.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  const iso = b.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (f) { d = +f[1]; mo = +f[2]; y = +f[3]; }
  else if (iso) { d = +iso[3]; mo = +iso[2]; y = +iso[1]; }
  else {
    const digits = b.replace(/\D/g, '');
    if (digits.length === 8) { d = +digits.slice(0, 2); mo = +digits.slice(2, 4); y = +digits.slice(4); }
  }
  if (!d || !mo || !y || y < 1900 || y > 2100 || mo > 12 || d > 31) return '';
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
  if (dt.getTime() > Date.now()) return '';
  const two = (x) => String(x).padStart(2, '0');
  return y + '-' + two(mo) + '-' + two(d);
}
function readDobIso(id) {
  return dobParse($(id) ? $(id).value : '');
}
function dobInputNormalize(t) {
  const b = bnDigits(t.value);
  if (b !== t.value) t.value = b;
  const iso = readDobIso(t.id);
  if (iso) { const disp = dobDisplay(iso); if (disp && t.value !== disp) t.value = disp; }
}
// কপি-পেস্ট তারিখ (2026-10-13): যেকোনো লেখা paste করলে তার ভেতর থেকে তারিখ
// খুঁজে বের করে DD/MM/YYYY-তে বসিয়ে দেয় — যেমন "জন্ম: ১০/০৯/২০০৭" paste
// করলেও শুধু "10/09/2007" বসবে।
function dobExtract(raw) {
  const b = bnDigits(String(raw || ''));
  const m = b.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/) ||
            b.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return dobParse(m[0]);
  const digits = b.replace(/\D/g, '');
  if (digits.length >= 8) return dobParse(digits.slice(0, 8));
  return '';
}
function isDobFieldId(id) {
  return id === 's1_dob' || id === 'a_dob' || /^(father|mother|af|am)_dob$/.test(id || '');
}
document.addEventListener('paste', (e) => {
  const t = e.target; if (!t || !t.id || !isDobFieldId(t.id)) return;
  const txt = ((e.clipboardData || window.clipboardData) || {}).getData('text') || '';
  if (!txt) return;
  const iso = dobExtract(txt);
  if (iso) {
    e.preventDefault();
    t.value = dobDisplay(iso);
    t.dispatchEvent(new Event('input', { bubbles: true }));
    note('✔ তারিখ বসানো হয়েছে: ' + dobDisplay(iso), 'ok');
  }
});
function dobFieldHtml(id, lbl, isoVal, req) {
  return '<div class="fld"><label>' + esc(lbl) + (req ? ' <b>*</b>' : '') + '</label>' +
    '<input type="text" inputmode="numeric" id="' + id + '" value="' + esc(dobDisplay(isoVal)) + '" placeholder="DD/MM/YYYY — যেমন: 10/09/2007"></div>';
}

function resumeGo() {
  const n = Math.max(0, parseInt(S.d.uiStep, 10) || 0);
  ensureReady(() => {
    if (S.mode === 'auto') { startAuto(true); return; }
    // লকস্টেপ: খসড়া চালু = শুধু আগের স্ক্রিনে ফেরা — বট নিজে কোনো ধাপ পাঠায় না।
    // দরকারি ধাপগুলো ইউজারের পরের “পরবর্তী” ক্লিকেই ব্যাকএন্ডের ensureAligned সাজিয়ে নেবে।
    if (n <= 1) { S.cur = 1; goStep(1); return; }
    if (n >= 6) { S.cur = 6; S.otpStage = 'review'; goStep(6); return; } // যোগাযোগ/OTP ধাপ — কাগজপত্র তো সাইটে বসেই আছে; আবার আপলোড চাই না
    const k = Math.min(n - 1, 4); // op4 (ডকুমেন্ট) বাদ — ইউজার আবার দেবেন (base64 খসড়ায় ছিল না)
    S.cur = k === 4 ? 5 : n;
    goStep(S.cur);
  });
}

/* ═══════════ mode starters & step router ═══════════ */
function freshData(mode) {
  return {
    mode: mode, uiStep: 0,
    s0: { addressType: 'BIRTHPLACE', embassy: false },
    s1: {}, s2: { father: {}, mother: {} }, s2b: {},
    relation: '', docs: [], email: '', phone: ''
  };
}
function startManual() {
  S.mode = 'manual';
  if (!S.d || !S.d.mode || S.d.mode !== 'manual') { S.d = freshData('manual'); resetSent(); }
  goStep(1);
}
function goStep(n) {
  S.cur = n;
  renderStepper(n - 1); hideFail(); noteOff(); busy(false);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (n === 1) renderStep1();
  else if (n === 2) renderStep2();
  else if (n === 3) renderStep3();
  else if (n === 4) renderStep4();
  else if (n === 5) renderStep5();
  else renderStep6();
}
function draftPayload(uiStep) {
  return {
    draftId: S.draftId || undefined,
    mode: S.mode, uiStep: uiStep != null ? uiStep : (S.d.uiStep || 0),
    s0: S.d.s0 || {}, s1: S.d.s1 || {}, s2: S.d.s2 || {}, s2b: S.d.s2b || {},
    relation: S.d.relation || '', docs: docsMetaOf(S.d.docs),
    email: S.d.email || '', phone: S.d.phone || ''
  };
}
/* খসড়ায় ছবিসহ (2026-10-13): ডকুমেন্টের ছবিও খসড়ায় জমা থাকবে —
   খসড়া চালু করলে ছবি আবার দিতে হবে না */
function docsMetaOf(docs) {
  return (docs || []).map(x => ({ name: x.name, mimeType: x.mimeType, docType: x.docType, base64: x.base64 || null }));
}
function saveDraft(uiStep, cb) {
  socket.emit('SAVE_DRAFT', draftPayload(uiStep), (r) => {
    if (r && r.ok) { S.draftId = r.draftId; updDraftsCnt(); }
    if (cb) cb(r);
  });
}
/* ধাপ-রেকর্ড (2026-10-11): কোন ধাপ সাইটে সত্যিই গেছে + শেষ পাঠানো তথ্য।
   ব্যবহারকারী পিছনে গিয়ে তথ্য বদলে আবার “পরবর্তী” চাপলে কেবল সেই এক ধাপই আবার
   যায় (resendFrom) — ব্যাকএন্ড নিজে সাইটকে সঠিক ধাপে ফিরিয়ে নেয়, বট কখনো
   নিজে নিজে পুরো চেইন চালায় না (১০০% লকস্টেপ)। */
function docsMetaSig(payload) {
  const docs = (payload && payload.docs) || [];
  return JSON.stringify({ rel: (payload && payload.relation) || '', d: docs.map(x => [x && x.name, x && x.docType]) });
}
function stepChanged(op, payload) {
  const prev = S._sentP && S._sentP[op];
  if (prev == null) return true; // কখনো পাঠানোই হয়নি — পাঠানো দরকার
  return prev !== (op === 'SUBMIT_S3_DOCS' ? docsMetaSig(payload) : sigOf(payload));
}
function sigOf(payload) { return JSON.stringify(payload || {}, (k, v) => (k === 'ctx' || k === '_opId' ? undefined : v)); }
function dropSent(op) {
  if (S._sentP) delete S._sentP[op];
  S._sentN = Object.keys(S._sentP || {}).reduce((m, k) => Math.max(m, OPS.findIndex(o => o.op === k) + 1), 0);
  S._inFlight = null;
}
function resetSent() { S._sentP = {}; S._sentN = 0; S._inFlight = null; }
/* ফিরে-এডিট (2026-10-11): ইউজার পিছনে গিয়ে তথ্য বদলে “পরবর্তী” চাপলে কেবল
   সেই একটি ধাপই আবার সাইটে যায় (ইউজারের সেই এক ক্লিকের কাজ)। এই ধাপের পরে
   যত ধাপ আগে পাঠানো ছিল তাদের রেকর্ড এখনই বাতিল — সাইট পিছিয়ে গিয়ে আবার
   রেন্ডার হয় বলে ওগুলো আর ধরা যায় না; ইউজার স্বাভাবিকভাবে হেঁটে গেলে প্রতিটি
   ধাপ তার নিজের ক্লিকে আবার যাবে (বট কখনো নিজে এগোয় না)। */
function resendFrom(op) {
  const oi = OPS.findIndex(o => o.op === op);
  if (oi < 0) return;
  OPS.slice(oi + 1).forEach(o => dropSent(o.op));
  if (op === 'SUBMIT_S3_DOCS') S.d.docsDone = false;
  const n = OPS[oi].step || (S.cur + 1);
  S.d.uiStep = n;
  if (S.draftId) saveDraft(n, () => {});
  goStep(n);
  note('✏️ নতুন তথ্যটি সাইটে বসানো হচ্ছে…', 'info');
  const go = () => {
    if (S._opBusy || S._waitingAck) { setTimeout(go, 350); return; }
    emitStep(op, payloadFor(op));
  };

  await geoLoad('country', GEO_LEVELS, data);
  for (const L of GEO_LEVELS) {
    const want = data[L.k]; if (!want) return;
    const node = $(L.ui); if (!node) return;
    if (node.tagName === 'SELECT') { if (!setSelByText(L.ui, want)) return; }
    if (!L.childSite) return;
    await geoMirror(L.k, GEO_LEVELS);
    const nxt = GEO_LEVELS[GEO_LEVELS.indexOf(L) + 1];
    if (nxt) await geoLoad(nxt.k, GEO_LEVELS, data);
  }
}
/* স্থায়ী/বর্তমান ঠিকানা — এক চাপে (বা খসড়া থেকে) ক্যাসকেড ভরাট + সাইটে মিরর */
function addrRec(prefix) {
  S.d.s2b = S.d.s2b || {};
  const key = prefix === 'sp' ? 'perm' : 'pres';
  if (!S.d.s2b[key]) S.d.s2b[key] = {};
  return S.d.s2b[key];
}
async function addrWarm(prefix, rec) {
  rec = rec || {};
  const Ls = addrGeoLevels(prefix);
  const data = addrRec(prefix);
  await geoLoad(Ls[0].k, Ls, data, rec[Ls[0].k]);
  for (const L of Ls) {
    const want = String(rec[L.k] || data[L.k] || '').trim();
    if (!want) { break; }
    const node = $(L.ui); if (!node) break;
    if (node.tagName === 'SELECT') {
      if (node.options.length <= 1) await geoLoad(L.k, Ls, data, want);
      if (!setSelByText(L.ui, want)) break;
    }
    data[L.k] = want;
    if (!L.childSite) break;
    await geoMirror(L.k, Ls);
    const nxt = Ls[Ls.indexOf(L) + 1];
    if (nxt) await geoLoad(nxt.k, Ls, data, rec[nxt.k]);
  }
}

    if (!$('rp_same').checked && $('rp_division') && $('rp_division').options.length <= 1) addrWarm('rp', z.pres || {}).catch(() => {});
  };
  $('sp_same').onchange = toggle;
  $('rp_same').onchange = toggle;
  if (!permCopy) addrWire('sp', z.perm || {});
  if (!presCopy) addrWire('rp', z.pres || {});
  if ($('spFromBirth')) $('spFromBirth').onclick = () => fillPrefixFromBirth('sp');
  if ($('spBook')) $('spBook').onclick = () => {
    collectStep4();
    renderAddrBook((rec) => { S.d.s2b.perm = Object.assign({}, rec); renderStep4(); note('✔ ঠিকানা বসানো হয়েছে', 'ok'); }, () => renderStep4());
  };
  if ($('rpFromPerm')) $('rpFromPerm').onclick = () => {

    note('✔ স্থায়ী ঠিকানা থেকে বসানো হয়েছে — প্রয়োজনে বদলে নিন', 'ok');
  };
  if ($('rpBook')) $('rpBook').onclick = () => {
    collectStep4();
    renderAddrBook((rec) => { S.d.s2b.pres = Object.assign({}, rec); renderStep4(); note('✔ ঠিকানা বসানো হয়েছে', 'ok'); }, () => renderStep4());
  };
  setBtns([
    { html: 'পরবর্তী →', fn: () => submitStep4() },
    { html: '💾 খসড়ায় রাখুন', cls: 'ghost', fn: () => { collectStep4(); saveDraft(4, () => note('✔ খসড়ায় রাখা হয়েছে', 'ok')); } },
    { html: '← পূর্ববর্তী', cls: 'ghost', fn: () => goStep(3) }
  ]);
}
function submitStep4() {
  collectStep4();
  if ((S.d.uiStep || 0) >= 5) {
    // ফিরে এসে ঠিকানা বদলালে কেবল এই এক ধাপই আবার সাইটে বসাই (লকস্টেপ)
    if (stepChanged('SUBMIT_S2B', payloadFor('SUBMIT_S2B'))) { resendFrom('SUBMIT_S2B'); return; }
    goStep(5); return;
  }
  const z = S.d.s2b, bad = [];
  const need = (o, who) => {
    [['division', 'বিভাগ'], ['district', 'জেলা'], ['cityCorpUpazila', 'সিটি কর্পোরেশন / উপজেলা'],
     ['paurasavaUnion', 'পৌরসভা / ইউনিয়ন'], ['postBn', 'ডাকঘর (বাংলায়)'], ['postEn', 'ডাকঘর (English)'],
     ['vilBn', 'গ্রাম / পাড়া / মহল্লা'], ['vilEn', 'গ্রাম / Area (English)']].forEach(([k, lbl]) => {
      if (!o[k]) { bad.push(who + ' — ' + lbl); const e = $((who === 'স্থায়ী' ? 'sp_' : 'rp_') + k); if (e) e.classList.add('bad'); }

/* ═══════════ step 5: ডকুমেন্ট (ধরন ৪০ ও ৪১) ═══════════ */
function fileToDoc(f) {
  return new Promise((res) => {
    const rd = new FileReader();
    rd.onload = () => res({ name: f.name, mimeType: f.type || 'image/jpeg', base64: b64Of(rd.result), docType: '' });
    rd.onerror = () => res(null);
    rd.readAsDataURL(f);
  });
}
function docTypeStatus() {
  const docs = S.d.docs || [];
  return { n: docs.length, has40: docs.some(d => d.docType === '40'), has41: docs.some(d => d.docType === '41') };
}
function renderDocRows() {
  const box = $('docRows'); if (!box) return;
  const docs = S.d.docs || [];
  if (!docs.length) {
    box.innerHTML = '<div class="draft-card"><div class="di">🖼️</div><div><div class="dt">এখনো কোনো কাগজ যোগ করা হয়নি</div>' +
      '<div class="ds">নিচের “ছবি যোগ করুন” চেপে ফোন/কম্পিউটার থেকে ছবি বেছে নিন (JPG/PNG, প্রতিটি ২MB-এর কম)।</div></div></div>';
  } else {
    box.innerHTML = docs.map((d, i) => '<div class="docrow">' +
      (d.base64 ? '<img class="dthumb" data-full="' + i + '" src="data:' + esc(d.mimeType || 'image/jpeg') + ';base64,' + d.base64 + '" alt="">' : '<span class="dthumb" style="display:flex;align-items:center;justify-content:center;font-size:20px">🖼️</span>') +
      '<span class="dname">' + esc(d.name) + '</span>' +
      '<select class="dtype" data-i="' + i + '">' + DOC_TYPES.map(t =>
        '<option value="' + t.v + '"' + (d.docType === t.v ? ' selected' : '') + '>ধরন ' + t.v + ' — ' + esc(t.t) + '</option>').join('') +
      '</select><button class="btn danger small" data-rm="' + i + '">✕</button></div>').join('');
    box.querySelectorAll('.dthumb[data-full]').forEach(im => im.onclick = () => {
      const d = S.d.docs[+im.dataset.full]; if (!d || !d.base64) return;
      const w = window.open('', '_blank'); if (!w) return;
      w.document.write('<title>' + esc(d.name || 'কাগজ') + '</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="data:' + esc(d.mimeType || 'image/jpeg') + ';base64,' + d.base64 + `" style="max-width:100%;max-height:100vh"></body>`);
      w.document.close();
    });
    box.querySelectorAll('.dtype').forEach(s => s.onchange = () => { S.d.docs[+s.dataset.i].docType = s.value; renderDocRows(); });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.d.docs.splice(+b.dataset.rm, 1); renderDocRows(); });
  }
  const t = $('docTypes');
  if (t) {
    const st = docTypeStatus();
    t.innerHTML = 'ধরন ৪০ (চিকিৎসক/শিক্ষা সনদ): ' + (st.has40 ? '<span class="vbadge ok">✔ আছে</span>' : '<span class="vbadge warn">✖ বাকি</span>') +
      ' &nbsp; ধরন ৪১ (পিতা-মাতার NID / ঠিকানার প্রমাণ): ' + (st.has41 ? '<span class="vbadge ok">✔ আছে</span>' : '<span class="vbadge warn">✖ বাকি</span>');
  }
}
function renderStep5() {
  setView('flow');
  if (!Array.isArray(S.d.docs)) S.d.docs = [];
  const relList = relationsForAge();
  if (!relList.includes(S.d.relation)) S.d.relation = relList[0];
  const rels = relList.map(r => '<div class="rcard rsm' + (S.d.relation === r ? ' sel' : '') + '" data-rel="' + esc(r) + '">' +
    '<span class="rdot"></span><div><div class="rt">' + esc(r) + '</div></div></div>').join('');
  showBody(
    '<div class="sec"><div class="sub-h"><span class="snum">৫</span> আবেদনকারীর পরিচয় ও ডকুমেন্ট</div>' +
    '<p class="hint">আবেদনকারী নিবন্ধনাধীন ব্যক্তির কে, তা বেছে নিন। তারপর দুই ধরনের কাগজের ছবি দিন — দুটোই জরুরি।</p></div>' +
    '<div class="relgrid">' + rels + '</div>' +
    '<div class="sec"><div class="sub-h"><span class="snum">📎</span> কাগজপত্র</div>' +
    '<div id="docTypes" class="hint"></div></div>' +
    '<div id="docRows"></div>' +
    '<div class="mt8"><button class="btn ghost" id="addDoc">➕ ছবি যোগ করুন</button>' +
    '<input type="file" id="docFile" accept="image/*" multiple style="display:none"></div>'
  );
  renderDocRows();
  els('.rcard.rsm').forEach(c => c.onclick = () => {
    S.d.relation = c.dataset.rel;
    els('.rcard.rsm').forEach(x => x.classList.toggle('sel', x.dataset.rel === S.d.relation));
  });
  $('addDoc').onclick = () => $('docFile').click();
  $('docFile').onchange = async () => {
    const files = Array.from($('docFile').files || []);
    $('docFile').value = '';
    if (!files.length) return;
    busy(true, '⏳ ছবি যোগ হচ্ছে…');
    for (const f of files) {
      if ((S.d.docs || []).length >= 6) { note('সর্বোচ্চ ৬টি কাগজ দেওয়া যাবে', 'warn'); break; }
      const isImg = /^image\//.test(f.type) || /\.(jpe?g|png)$/i.test(f.name);
      if (!isImg) { note('শুধু JPG/PNG ছবি চলবে — ' + f.name, 'warn'); continue; }
      if (f.size > 2 * 1024 * 1024) { note('“' + f.name + '” ২MB-এর বেশি — ছোট করে আবার দিন', 'warn'); continue; }
      const d = await fileToDoc(f);
      if (!d) { note('“' + f.name + '” পড়া যায়নি — আবার চেষ্টা করুন', 'warn'); continue; }
      const st = docTypeStatus();
      d.docType = !st.has40 ? '40' : (!st.has41 ? '41' : '40');
      S.d.docs.push(d);
    }
    renderDocRows();
    busy(false); noteOff();
  };
  setBtns([
    { html: 'পরবর্তী →', fn: () => submitStep5() },
    { html: '💾 খসড়ায় রাখুন', cls: 'ghost', fn: () => saveDraft(5, () => note('✔ খসড়ায় রাখা হয়েছে — ছবিসহই জমা থাকল', 'ok')) },
    { html: '← পূর্ববর্তী', cls: 'ghost', fn: () => goStep(4) }
  ]);
}
function submitStep5() {
  if (!Array.isArray(S.d.docs)) S.d.docs = [];
  if ((S.d.uiStep || 0) >= 6) {
    // কাগজ বদলালে কেবল এই এক ধাপই আবার ছবিসহ সাইটে যায় (লকস্টেপ)
    if (stepChanged('SUBMIT_S3_DOCS', payloadFor('SUBMIT_S3_DOCS'))) { resendFrom('SUBMIT_S3_DOCS'); return; }
    goStep(6); return;
  }
  const st = docTypeStatus(), bad = [];
  if (!st.n) bad.push('কমপক্ষে ১টি কাগজের ছবি যোগ করুন');
  if (st.n && !(st.has40 && st.has41)) bad.push('দুই ধরনের কাগজ দরকার — ধরন ৪০ ও ধরন ৪১ দুটোই চিহ্নিত করুন');
  if (bad.length) { showFail(bad); note('⚠️ কাগজপত্র ঠিক করুন', 'warn'); return; }
  hideFail();
  advanceAndSend(6, 'SUBMIT_S3_DOCS', { relation: S.d.relation || defaultRelation(), docs: S.d.docs });
}

/* ═══════════ step 6: পুরো আবেদন প্রিভিউ + যোগাযোগ + OTP — মেইন সার্ভারের মতো এক পর্দা ═══════════ */
function renderStep6() {
  setView('flow'); S.otpStage = 'review';
  showBody(
    '<div class="sec"><div class="sub-h"><span class="snum">৬</span> আবেদন প্রিভিউ — জমার আগেই সব দেখে নিন</div>' +
    '<p class="hint">এটাই আপনার পূর্ণ আবেদন — কাগজপত্রসহ সব তথ্য এখান থেকেই মূল সাইটে যাবে। কোনো অংশে ভুল দেখলে সেই অংশের পাশের “✏️ ঠিক করুন” চাপলেই সরাসরি সেই ধাপে গিয়ে ঠিক করতে পারবেন। সব ঠিক থাকলে নিচের নম্বর মিলিয়ে “📲 কোড পাঠান” চাপুন — মোবাইলে আসা কোডটিই শেষ ধাপ।</p></div>' +
    pvSheetHtml(true) +
    '<div class="sec"><div class="sub-h"><span class="snum">📞</span> যোগাযোগ — এই নম্বরেই কোড আসবে</div>' +
    '<p class="hint">নম্বরটি হাতে রাখুন — কোড এসে গেলে নিচের ঘরে বসাতে পারবেন। চাইলে এখান থেকেই খসড়ায় রেখে পরে ফিরে আসতে পারবেন।</p></div>' +
    '<div class="row2">' +
      '<div class="fld"><label>মোবাইল নম্বর <b>*</b></label><input type="text" id="c_phone" value="' + esc(S.d.phone || '') + '" placeholder="01XXXXXXXXX"></div>' +
      '<div class="fld"><label>ইমেইল</label><input type="text" id="c_email" value="' + esc(S.d.email || '') + '" placeholder="you@example.com"></div>' +
    '</div>'
  );
  bindPvEdits();
  setBtns([
    { html: '📲 কোড পাঠান', fn: () => sendOtp() },
    { html: '💾 খসড়ায় রাখুন', cls: 'ghost', fn: () => { collectStep6(); saveDraft(6, () => note('✔ খসড়ায় রাখা হয়েছে — “খসড়া” থেকে যেকোনো সময় কোড দিয়ে শেষ করতে পারবেন', 'ok')); } },
    { html: '← পূর্ববর্তী', cls: 'ghost', fn: () => goStep(5) }
  ]);
}
function collectStep6() {
  S.d.phone = ($('c_phone') ? $('c_phone').value : '').replace(/[^\d]/g, '');
  S.d.email = ($('c_email') ? $('c_email').value : '').trim();
  return { email: S.d.email, phone: S.d.phone };
}

/* ═══════════ OTP — প্রিভিউ পর্দা থেকেই পাঠানো হয় ═══════════ */
function sendOtp() {
  collectStep6();
  const bad = [];
  ['c_phone', 'c_email'].forEach(id => { const e = $(id); if (e) e.classList.remove('bad'); });
  if (!/^01\d{9}$/.test(S.d.phone)) { bad.push('মোবাইল নম্বর (১১ ডিজিট, 01 দিয়ে শুরু)'); const e = $('c_phone'); if (e) e.classList.add('bad'); }
  if (S.d.email && !/^\S+@\S+\.\S+$/.test(S.d.email)) { bad.push('ইমেইল ঠিক নেই'); const e = $('c_email'); if (e) e.classList.add('bad'); }
  if (bad.length) { showFail(bad); note('⚠️ যোগাযোগের তথ্য ঠিক করুন', 'warn'); return; }
  hideFail();
  if (S.draftId) saveDraft(6, () => {});
  renderOtpCode();
  busy(true, '📲 কোড পাঠানো হচ্ছে…'); // ডাবল-চাপ আটকায় (কোড-স্ক্রিনের বাটনগুলো তৈরি হওয়ার পরে)
  // গার্ড আটকালে (আগের ধাপ তখনো সাইটে যাচ্ছে) সাথে সাথে বাটন ছেড়ে দিই —
  // নইলে নোটে “আবার চাপুন” লেখা থাকলেও বাটন নিষ্ক্রিয় থেকে চিরতরে আটকে যায়
  if (emitStep('SUBMIT_S4_PREP', { email: S.d.email, phone: S.d.phone }) === false) busy(false);
}
function renderOtpCode() {
  setView('flow'); S.otpStage = 'code'; renderStepper(5); hideFail();
  const ph = S.d.phone || '';
  const tail = ph.length >= 4 ? ph.slice(-4) : ph;
  showBody(
    '<div class="sec"><div class="sub-h"><span class="snum">🔐</span> কোড বসান</div>' +
    '<p class="hint">' + esc(tail) + '-এ শেষ হওয়া নম্বরে কোড পাঠানো হয়েছে। না এলে “আবার কোড পাঠান” চাপুন। <b>কোড কারও সাথে শেয়ার করবেন না।</b></p></div>' +
    '<div class="otpboxes">' + [0,1,2,3,4,5].map(i => '<input class="otpbox" id="ob' + i + '" inputmode="numeric" maxlength="1" autocomplete="one-time-code">').join('') + '</div>'
  );
  const boxes = els('.otpbox');
  const val = () => boxes.map(b => b.value.replace(/\D/g, '')).join('');
  boxes.forEach((b, i) => {
    b.oninput = () => {
      b.value = b.value.replace(/\D/g, '').slice(-1);
      if (b.value && boxes[i + 1]) boxes[i + 1].focus();
    };
    b.onkeydown = (e) => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) { boxes[i - 1].focus(); boxes[i - 1].value = ''; } };
    b.onpaste = (e) => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      for (let k = 0; k < boxes.length; k++) boxes[k].value = txt[k] || '';
      (boxes[Math.min(txt.length, boxes.length - 1)] || boxes[0]).focus();
    };
  });
  if (boxes[0]) boxes[0].focus();
  setBtns([
    { html: '✅ আবেদন জমা দিন', fn: () => {
        const otp = val();
        if (otp.length < 6) { note('⚠️ মোবাইলে আসা ৬ ডিজিটের কোডটি সম্পূর্ণ লিখুন', 'warn'); return; }
        S.otpStage = 'submitting';
        busy(true, '⏳ আবেদন জমা হচ্ছে… একটু অপেক্ষা করুন');
        // গার্ড আটকালে সোজা আগের স্ক্রিনে ফিরি — বাটন চিরতরে নিষ্ক্রিয় হয় না
        if (emitStep('SUBMIT_S4_OTP', { otp }) === false) { S.otpStage = 'code'; busy(false); }
      } },
    { html: '📲 আবার কোড পাঠান', cls: 'ghost', fn: () => {
        // কখনো আটকে না থাকেন — ওয়েটশিটা ওয়ালা ধাপ আবারই চালানো যায়
        busy(true, '⏳ আবার কোড পাঠানো হচ্ছে…');
        if (emitStep('SUBMIT_S4_PREP', { email: S.d.email || '', phone: S.d.phone || '' }) === false) busy(false);
      } },
    { html: '💾 খসড়ায় রাখুন', cls: 'ghost', fn: () => saveDraft(6, () => { note('✔ খসড়ায় রাখা হয়েছে — যেকোনো সময় OTP দিয়ে শেষ করতে পারবেন', 'ok'); setTimeout(renderDrafts, 700); }) },
    { html: '← পূর্ববর্তী', cls: 'ghost', fn: () => goStep(6) }

/* ═══════════ ধাপ-চেইন ইঞ্জিন (অটো মোড ও খসড়া চালুর জন্য) ═══════════ */
const OPS = [
  { label: 'আবেদনের ভিত্তি', op: 'SUBMIT_S0', step: 2 },
  { label: 'ব্যক্তির পরিচিতি', op: 'SUBMIT_S1', step: 3 },
  { label: 'পিতামাতার তথ্য', op: 'SUBMIT_S2', step: 4 },
  { label: 'ঠিকানা', op: 'SUBMIT_S2B', step: 5 },
  { label: 'ডকুমেন্ট', op: 'SUBMIT_S3_DOCS', step: 6 }
];
function payloadFor(op) {
  if (op === 'SUBMIT_S0') return S.d.s0;
  if (op === 'SUBMIT_S1') return Object.assign({ docsAvailable: true }, S.d.s1);
  if (op === 'SUBMIT_S2') return Object.assign({}, S.d.s2, { applicantDob: S.d.s1.dob });
  if (op === 'SUBMIT_S2B') return Object.assign({}, S.d.s2b);
  if (op === 'SUBMIT_S3_DOCS') return { relation: S.d.relation || defaultRelation(), docs: S.d.docs || [] };
  if (op === 'SUBMIT_S4_PREP') return { email: S.d.email || '', phone: S.d.phone || '' };
  return {};
}
function runChain(ops, onDone, title) {
  S.chain = { ops: ops.slice(), k: 0, onDone: onDone || null, title: title || 'আবেদন প্রস্তুত হচ্ছে' };
  renderProgress(S.chain.title);
  chainSend();
}
function renderProgress(title) {
  setView('progress'); renderStepper(-1); hideFail();
  const c = S.chain; if (!c) return;
  showBody(
    '<div class="sec"><div class="sub-h"><span class="snum">⚙️</span> ' + esc(title) + '</div>' +
    '<p class="hint">প্রতিটি ধাপ শেষ হলে নিচে ✔ আসবে — আপনি শুধু অপেক্ষা করুন। যেকোনো সময় থামিয়ে খসড়ায় রাখতে পারবেন।</p></div>' +
    '<div>' + c.ops.map((o, i) => '<div class="prow" id="pr' + i + '"><span class="pdot">' + (i < c.k ? '✓' : (i + 1)) + '</span>' +
      '<span>' + esc(o.label) + '</span><span class="pt"></span></div>').join('') + '</div>'
  );
  updProws();
  setBtns([{ html: '⏸️ খসড়ায় রেখে বেরোন', cls: 'ghost', fn: () => abortChain() }]);
}
function updProws() {
  const c = S.chain; if (!c) return;
  c.ops.forEach((o, i) => {
    const p = $('pr' + i); if (!p) return;
    if (i < c.k) { p.className = 'prow done'; p.querySelector('.pdot').textContent = '✓'; p.querySelector('.pt').textContent = 'সম্পন্ন'; }
    else if (i === c.k) { p.className = 'prow active'; p.querySelector('.pdot').textContent = String(i + 1); p.querySelector('.pt').textContent = 'চলছে…'; }
    else { p.className = 'prow'; p.querySelector('.pdot').textContent = String(i + 1); p.querySelector('.pt').textContent = 'অপেক্ষায়'; }
  });
}
function chainSend() {
  const c = S.chain; if (!c) return;
  const o = c.ops[c.k]; if (!o) return;
  updProws();
  busy(true, '⏳ ' + o.label + ' — একটু অপেক্ষা করুন…');
  emitStep(o.op, payloadFor(o.op));
}
function chainAck(d) {
  const c = S.chain; if (!c) return;
  opFinish();
  const o = c.ops[c.k] || {};
  const failed = Array.isArray(d.failed) ? d.failed : [];
  if (d.relationBn) S.d.relation = d.relationBn;
  if (d.blocked || failed.length) {
    const p = $('pr' + c.k); if (p) p.className = 'prow err';
    if (o.op) dropSent(o.op); // ব্যর্থ ধাপ সাইটে যাওয়া গণ্য নয় — রিট্রাই আবার পাঠাবে
    showFail(failed.map(f => (f.field ? f.field + ' — ' : '') + (f.reason || 'সমস্যা হয়েছে')));
    note('⚠️ ' + san(d.message || 'কিছু তথ্য মিলছে না — ঠিক করে আবার চেষ্টা করুন'), 'warn');
    setBtns([
      { html: '🔁 আবার চেষ্টা করুন', fn: () => { hideFail(); note('⏳ আবার চেষ্টা করা হচ্ছে…', 'info'); chainSend(); } },
      { html: '⏸️ খসড়ায় রেখে বেরোন', cls: 'ghost', fn: () => abortChain() }
    ]);
    return;
  }
  hideFail();
  S.d.uiStep = parseInt(d.step, 10) || S.d.uiStep || (o.step || S.d.uiStep);
  if (S.draftId) saveDraft(S.d.uiStep, () => {});
  const p = $('pr' + c.k); if (p) { p.className = 'prow done'; const t = p.querySelector('.pt'); if (t) t.textContent = 'সম্পন্ন'; const dt = p.querySelector('.pdot'); if (dt) dt.textContent = '✓'; }
  c.k++;
  if (c.k < c.ops.length) { note('✔ ' + o.label + ' সম্পন্ন', 'ok'); chainSend(); }
  else {
    S.chain = null;
    S._staleAcks = 0;
    note('✔ সব ধাপ শেষ! এখন ওটিপি দিলেই আবেদন জমা হবে।', 'ok');
    const f = c.onDone; if (f) f();
  }
}
function abortChain() {
  S.chain = null;
  opAbort();
  S._staleAcks = 0;
  saveDraft(S.d.uiStep || 0, () => { note('✔ খসড়ায় রাখা হয়েছে — “খসড়া” থেকে পরে চালু করুন', 'ok'); setTimeout(renderHome, 500); });
}
/* অটো-চেইন শেষ হওয়ার পরের ধাপ: ওটিপি-প্রস্তুতির ack (progress view-তে chain আর থাকে না) */
function otpPrepAck(d) {
  busy(false);
  opFinish();
  const failed = Array.isArray(d.failed) ? d.failed : [];
  if (d.relationBn) S.d.relation = d.relationBn;
  if (d.resumable) {
    opAbort();
    note('🔄 নতুন সেশন — তথ্যগুলো আবার বসানো হচ্ছে…', 'info');
    S.chain = { ops: OPS.slice(), k: 0, onDone: () => autoPrep(), title: 'তথ্য আবার বসানো হচ্ছে' };
    renderProgress(S.chain.title); chainSend();
    return;
  }
  if (d.blocked || failed.length) {
    if (failed.length) showFail(failed.map(x => (x.field ? x.field + ' — ' : '') + (x.reason || 'সমস্যা হয়েছে')));
    note('⚠️ কোড পাঠানো যায়নি — “আবার চেষ্টা করুন” চাপুন', 'warn');
    setBtns([
      { html: '🔁 আবার চেষ্টা করুন', fn: () => { hideFail(); note('⏳ আবার চেষ্টা করা হচ্ছে…', 'info'); autoPrep(); } },
      { html: '⏸️ খসড়ায় রেখে বেরোন', cls: 'ghost', fn: () => abortChain() }
    ]);
    return;
  }
  hideFail();
  note('📲 কোড পাঠানো হয়েছে — মোবাইলে এসেছে কি না দেখুন', 'ok');
  renderOtpCode();
}

/* ═══════════ session প্রস্তুতি (নাগরিক কখনো আটকাবে না) ═══════════ */
function ensureReady(cb) {
  note('[DEBUG] ensureReady, S.ready=' + S.ready + ' S.starting=' + S.starting, 'warn');
  if (S.ready) { cb(); return; }
  (S._readyQ = S._readyQ || []).push(cb);
  if (!S.starting) {
    S.starting = true;
    note('⏳ সংযোগ প্রস্তুত হচ্ছে… (একটু অপেক্ষা করুন)', 'warn');
    note('[DEBUG] emitting START_BDRIS_SESSION', 'warn');
    socket.emit('START_BDRIS_SESSION');
  }
}
function sessionLost() {
  S.ready = false; S.starting = false;
  busy(false);
  opAbort();
  showBanner('warn', '⚠️ সংযোগটি একটু দুর্বল হয়ে গেছে — আপনার তথ্য নিরাপদে আছে। “আবার চেষ্টা করুন” চাপলেই বাকিটা এগিয়ে যাবে।', () => retrySession(), 'আবার চেষ্টা করুন');
  note('⏸️ সংযোগ প্রস্তুত করা দরকার', 'warn');
}
function retrySession() {
  hideBanner();
  ensureReady(() => {
    if (S.chain) {
      S.chain.k = 0;
      note('⏳ শুরু থেকে আবার সাজানো হচ্ছে — তথ্য হারায়নি', 'info');
      renderProgress(S.chain.title);
      chainSend();
    } else {
      note('✅ সংযোগ প্রস্তুত — আবার চেষ্টা করুন', 'ok');
    }
  });
}

/* ═══════════ STEP_CHANGE_ACK রাউটিং ═══════════ */
function manualStepAck(d) {
  const op = S._waitingAck;
  // সেশন-নতুন হওয়ার মেরামতে বাতিল-হওয়া পুরনো ধাপের ack এলে চুপচাপ গিলে ফেলি
  const staleAck = (S._staleAcks || 0) > 0 && (Date.now() - (S._staleAcksAt || 0)) < 180000;
  if ((S._staleAcks || 0) > 0) S._staleAcks--;
  opFinish();
  // ack এসেই গেছে মানে এই ধাপের কাজ শেষ — বাটন আবার চালু (S4_OTP সাবমিট বাদেঃ
  // সেটার সাফল্য DONE-ইভেন্টে গিয়ে ধরা পড়ে, ততক্ষণ ডাবল-চাপ আটকে রাখি)
  if (op !== 'SUBMIT_S4_OTP') busy(false);
  const failed = Array.isArray(d.failed) ? d.failed : [];
  if (d.relationBn) S.d.relation = d.relationBn;
  if (d.resumable) {
    if (staleAck) { opAbort(); return; } // পুরনো ধাপ — নতুন সেশনে আর দরকার নেই
    // লকস্টেপ: নতুন সেশন মানেই বট নিজে পুরো চেইন চালাবে না — ইউজারের সেই ক্লিকের ধাপটিই
    // (এক চাপে) আবার পাঠানোর সুযোগ দিই; ব্যাকএন্ডের ensureAligned আগের ধাপগুলো নিজে সাজায়
    opAbort();
    if (op === 'SUBMIT_S4_OTP') { note('🔄 সংযোগ নতুন — আবার কোড পাঠিয়ে জমা দিতে হবে', 'warn'); if (S.otpStage !== 'code') renderOtpCode(); return; }
    if (op === 'SUBMIT_S4_PREP') {
      // নতুন সেশনে সাইট ধাপ ১-এ ফিরে গেছে — কাগজপত্র ছাড়া ওটিপি-ধাপে ফেরা যায় না
      // (ধাপ ৫-এর “পরবর্তী”তেই ব্যাকএন্ড বাকি ধাপগুলো সাইটে নিজে সাজিয়ে দেয়), তাই সেখানেই ফিরিয়ে নিই
      dropSent('SUBMIT_S3_DOCS'); // পুরনো রেকর্ড বাতিল — একই ছবি আবার দিলেও যেন সাইটে যায়
      note('🔄 সংযোগ নতুন — কাগজপত্রের ধাপ থেকে আবার এগোনো দরকার', 'warn');
      showBanner('warn', '⚠️ নতুন সংযোগ হয়েছে — আপনার তথ্য সব হাতেই আছে। কাগজপত্রের ধাপ থেকে আবার এগোলেই বাকিটা নিজে থেকে বসে যাবে।', () => {
        hideBanner(); goStep(5);
        note('📎 ২টি কাগজ আবার যোগ করে “পরবর্তী →” চাপুন — বাকি ধাপগুলো সাইটে নিজে থেকেই বসবে', 'info');
      }, '📎 কাগজপত্রে ফিরুন');
      return;
    }
    const rp = op ? payloadFor(op) : null;
    if (rp) {
      note('🔄 সংযোগ নতুন — তথ্য আপনার হাতেই আছে', 'info');
      showBanner('warn', '⚠️ সংযোগ নতুন করে সাজানো দরকার — এক চাপে আগের ধাপটি আবার বসবে।', () => {
        hideBanner(); note('⏳ আপনার ধাপটি আবার বসানো হচ্ছে…', 'info'); emitStep(op, rp);
      }, 'আবার চেষ্টা করুন');
    }
    return;
  }
  if (d.verifyStatus && typeof d.verifyStatus === 'object') {
    if ('father' in d.verifyStatus) S.verify.father = d.verifyStatus.father;
    if ('mother' in d.verifyStatus) S.verify.mother = d.verifyStatus.mother;
  }
  if (d.blocked || failed.length) {
    if (staleAck) { if (op) dropSent(op); return; } // পুরনো ধাপের ব্যর্থতা — মেরামত চলছে, নীরব থাকি
    if (failed.length) showFail(failed.map(x => (x.field ? x.field + ' — ' : '') + (x.reason || 'সমস্যা হয়েছে')));
    note('⚠️ ' + san(d.message || 'কিছু মিলছে না — ঠিক করে আবার চেষ্টা করুন'), 'warn');
    if (op) dropSent(op); // ব্যর্থ ধাপ সাইটে যাওয়া গণ্য নয় — রিট্রাই আবার পাঠাবে
    opAbort();
    busy(false); // আটকে গেলে বাটন আবার চালু — নইলে রিট্রাই/খসড়া কিছুই চাপা যায় না
    // সাইট যোগাযোগ ধাপে নেই (মাঝপথে/চেনা যায়নি) — রিট্রাই করলে আবার একই ফল আসবে;
    // কাগজপত্রের ধাপ থেকে এগোলেই ensureAligned পুরো পথ সাজিয়ে যোগাযোগে পৌঁছে দেয়
    if (op === 'SUBMIT_S4_PREP' && failed.some(x => /পেজ পাওয়া যায়নি/.test(x.reason || ''))) {
      dropSent('SUBMIT_S3_DOCS'); // পুরনো রেকর্ড বাতিল — একই ছবি আবার দিলেও যেন সাইটে যায়
      showBanner('warn', '⚠️ সাইট এখন যোগাযোগের ধাপে নেই — কাগজপত্রের ধাপ থেকে আবার এগোলেই বাকিটা নিজে থেকে বসে যাবে।', () => {
        hideBanner(); goStep(5);
        note('📎 ২টি কাগজ আবার যোগ করে “পরবর্তী →” চাপুন — বাকি ধাপগুলো সাইটে নিজে থেকেই বসবে', 'info');
      }, '📎 কাগজপত্রে ফিরুন');
      return;
    }
    // পরের ধাপ ইউজার নিজে চাপলে ব্যাকএন্ডের ensureAligned সাইটকে মেরামত করে নেবে —
    // এখানে কেবল একটি ভদ্র রিট্রাই-ব্যানার দিই (বট নিজে কিছু পাঠায় না)
    const rp = (op && op !== 'SUBMIT_S4_OTP') ? payloadFor(op) : null;
    if (rp) {
      showBanner('warn', '⚠️ একটি ধাপে সমস্যা হয়েছে — ঠিক করা দরকার।', () => {
        hideBanner(); note('⏳ আবার পাঠানো হচ্ছে…', 'info'); emitStep(op, rp);
      }, op === 'SUBMIT_S4_PREP' ? 'আবার কোড পাঠান' : 'আবার চেষ্টা করুন');
    }
    return;
  }
  hideBanner();
  hideFail();
  // সফল ack → এই ধাপ সাইটে বসে গেছে: uiStep এগোই। ফলে পেছনে গিয়ে তথ্য না বদলে
  // “পরবর্তী” চাপলে সাইটে আবার পাঠানো হয় না — শুধু UI এগোয় (ডুপ্লিকেট নয়)।
  // (stale ack — নতুন সেশনের পুরনো উত্তর — গণনায় ধরা হয় না)
  if (op && op !== 'SUBMIT_S4_OTP' && !staleAck) {
    const oi = OPS.findIndex(o => o.op === op);
    if (oi >= 0) S.d.uiStep = Math.max(S.d.uiStep || 0, OPS[oi].step || 0);
  }
  if (op === 'SUBMIT_S4_PREP') {
    note('📲 কোড পাঠানো হয়েছে — মোবাইলে এসেছে কি না দেখুন', 'ok');
    if (S.otpStage !== 'code') { if (S.pvMode && S.mode === 'auto') showPvOtp(); else renderOtpCode(); }
    else busy(false);
    return;
  }
  if (op === 'SUBMIT_S4_OTP') return;
  // ম্যানুয়াল মোড: UI আগেই এগিয়ে গেছে (অপ্টিমিস্টিক) — এখানে বাড়তি কিছু নেই
}

/* ═══════════ socket events ═══════════ */
socket.on('STEP_CHANGE_ACK', (d) => {
  d = (d && typeof d === 'object') ? d : {};
  if (S.view === 'progress' && S.chain) { chainAck(d); return; }
  if (S.view === 'progress' && S._waitingAck === 'SUBMIT_S4_PREP') { otpPrepAck(d); return; }
  if (S.view === 'flow') { manualStepAck(d); return; }
  // অন্য ভিউ (done/home/status): ack এসে পৌঁছালে op-অবস্থা অবশ্যই ছেড়ে দিই —
  // নইলে _opBusy/_waitingAck আটকে থেকে পরের ক্লিকগুলো চিরতরে “এক মুহূর্ত পরে” বলে ফিরে যায়
  opFinish();
});
socket.on('BOT_STATUS', (d) => {
  d = (d && typeof d === 'object') ? d : {};
  const st = d.status;
  // চলন্ত অপের জীবিত-খবর — guardOpBusy-র সময়সীমা রিফ্রেশ করি
  if (S._opBusy && (st === 'PROGRESS' || st === 'LOADING' || st === 'OTP_WAITING' || st === 'READY')) S._opStartedAt = Date.now();
  if (st === 'READY') {
    S.ready = true; S.starting = false;
    hideBanner();
    if (d.fresh && S.view === 'flow' && S.d && (S.d.uiStep || 0) > 0) {
      // cold start: প্রথম ধাপের অপ এখনো পাঠানোই হয়নি (queue-তে বসে সেশনের অপেক্ষা) —
      // তখন bounce করলে ব্যবহারকারীর ক্লিক বৃথা যায়; queue আগে চলতে দিই
      const pendingUnsent = (S._opQ || []).length > 0 && !S._sentAny;
      if (!pendingUnsent) {
        // সাইটের সেশন সত্যিই নতুন (আগের ধাপগুলো সাইটে হারিয়ে গেছে) — UI ধাপ ১ থেকে সাজাই
        S.d.uiStep = 0;
        resetSent(); // সাইট খালি — ধাপ-রেকর্ডও খালি
        opAbort();
        note('🔄 সংযোগ নতুন — ধাপ ১ থেকে আবার সাজানো হবে (তথ্য আপনার হাতেই আছে)', 'info');
        goStep(1);
      }
    } else {
      note('✅ সংযোগ প্রস্তুত!', 'ok');
    }
    const q = S._readyQ || []; S._readyQ = [];
    q.forEach(f => { try { f(); } catch (e) { console.error(e); } });
    return;
  }
  if (st === 'LOADING') { note('⏳ সংযোগ প্রস্তুত হচ্ছে…', 'info'); return; }
  if (st === 'PROGRESS' || st === 'OTP_WAITING') {
    const lv = ['ok', 'warn', 'err', 'info'].includes(d.level) ? d.level : 'info';
    note(san(d.message || 'প্রক্রিয়া চলছে…'), lv);
    return;
  }
  if (st === 'ORIGINAL_PDF') {
    const ono = String(d.ackId || '').replace(/\D/g, '');
    const u = d.ok && d.original ? d.original : null;
    if (ono && u) ORIG_READY[ono] = u;
    const el = $('akOrigPend');
    if (u) {
      if (el) {
        el.disabled = false; el.className = 'btn'; el.style.opacity = '';
        el.textContent = '⬇️ আসল PDF (কার্যালয়ের কপি)';
        el.onclick = () => downloadOriginal(u, ono);
      }
      // অটো-ডাউনলোড শুধু কেউ চাইলে: অঙ্ক-মিল অথবা খালি (সর্বশেষ রেকর্ড) চাওয়া হলে
      const wantDl = S._origAutoDl != null
        && (String(S._origAutoDl).replace(/\D/g, '') === ono || String(S._origAutoDl).replace(/\D/g, '') === '');
      if (ono && wantDl) {
        if (!ORIG_AUTODLED[ono]) { ORIG_AUTODLED[ono] = 1; downloadOriginal(u, ono); }
      } else {
        note('✅ আসল PDF (কার্যালয়ের কপি) প্রস্তুত', 'ok');
      }
    } else if (el) {
      el.disabled = false; el.style.opacity = '';
      el.textContent = '⬇️ আসল PDF আবার আনুন';
      el.onclick = () => { note('⏳ আসল কপি আনা হচ্ছে…', 'info'); if (ono) socket.emit('FETCH_ORIGINAL', { ack: ono }); };
    }
    return;
  }
  if (st === 'STATUS_OTP') {
    busy(false);
    note(san(d.message || '📲 কোড পাঠানো হয়েছে — মোবাইলে আসা কোডটি বসান।'), 'ok');
    renderStatusOtp();
    return;
  }
  if (st === 'STATUS_RESULT') { busy(false); renderStatusResult(d); return; }
  if (st === 'STATUS_ERROR') {
    busy(false);
    const smsg = san(d.message || 'সাময়িক সমস্যা — আবার চেষ্টা করুন');
    if (S.view === 'status' && (S.status || {}).stage === 'otp') {
      renderStatusOtp();
      showFail([smsg.replace(/^❌\s*/, '')]);
    } else if (S.view === 'status') {
      showBanner('err', smsg, () => { hideBanner(); renderStatusLogin(); }, 'আবার চেষ্টা করুন');
    } else {
      note(smsg, 'err');
    }
    return;
  }
  if (st === 'COMPLETED') {
    busy(false);
    opAbort();
    S.otpStage = 'done';
    showDone(d);
    return;
  }
  if (st === 'ERROR') {
    busy(false);
    const diedOp = S._waitingAck;
    const msg = String(d.message || 'সাময়িক সমস্যা হয়েছে');
    if (/চালু হয়নি|সংযোগ নেই/.test(msg)) { sessionLost(); return; }
    if (diedOp) dropSent(diedOp); // ব্যর্থ ধাপ সাইটে যাওয়া গণ্য নয় — রিট্রাই আবার পাঠাবে
    opAbort();
    if (S.otpStage === 'submitting' && /OTP|কোড/i.test(msg)) {
      S.otpStage = 'code';
      if (S.pvMode && S.mode === 'auto') showPvOtp(); else renderOtpCode();
      note(san(msg), 'err');
      return;
    }
    if (S.view === 'progress' && S.chain) {
      const p = $('pr' + S.chain.k); if (p) p.className = 'prow err';
      showFail([san(msg)]);
      setBtns([
        { html: '🔁 আবার চেষ্টা করুন', fn: () => { hideFail(); note('⏳ আবার চেষ্টা করা হচ্ছে…', 'info'); chainSend(); } },
        { html: '⏸️ খসড়ায় রেখে বেরোন', cls: 'ghost', fn: () => abortChain() }
      ]);
      return;
    }
    if (S.view === 'progress' && diedOp === 'SUBMIT_S4_PREP') {
      showFail([san(msg)]);
      setBtns([
        { html: '🔁 আবার চেষ্টা করুন', fn: () => { hideFail(); note('⏳ আবার চেষ্টা করা হচ্ছে…', 'info'); autoPrep(); } },
        { html: '⏸️ খসড়ায় রেখে বেরোন', cls: 'ghost', fn: () => abortChain() }
      ]);
      return;
    }
    note(san(msg), 'err');
    // ম্যানুয়াল মোড: ধাপটি সার্ভারে শেষ হয়নি — এক চাপে আবার পাঠানোর সুযোগ
    if (S.view === 'flow' && diedOp && diedOp !== 'SUBMIT_S4_OTP' && diedOp !== 'SUBMIT_S4_PREP') {
      showBanner('err', '⚠️ একটি ধাপ শেষ হয়নি — ঠিক করা দরকার।', () => {
        hideBanner(); note('⏳ আবার পাঠানো হচ্ছে…', 'info'); emitStep(diedOp, payloadFor(diedOp));
      }, 'আবার চেষ্টা করুন');
    }
    return;
  }
  if (st === 'SESSION_TIMEOUT' || st === 'IDLE') {
    S.ready = false; S.starting = false;
    if (S.view === 'done') return;
    sessionLost();
    return;
  }
});

/* ═══════════ init ═══════════ */
renderHome();
updDraftsCnt();
$('draftsBtn').onclick = () => renderDrafts();
$('addrBtn').onclick = () => renderAddrBook(null, () => renderHome());
$('brandHome').onclick = () => renderHome();
</script>
<script>
/* ═══════════ ABC Authentic: wallet charging + charge receipts (C-1 fix, 2026-10-15) ═══════════
   Main-page shim. (আগের shim ভুল করে ডকুমেন্ট-ভিউয়ার popup-এর ভেতরে ছিল — কখনো চলত না।)
   - SUBMIT_S4_OTP-এর আগে /charge/submit → টাকা কাটে, chargeToken payload-এ বসায়
   - FETCH_ORIGINAL-এর আগে /charge/pdf → টাকা কাটে, chargeToken বসায়
   Engine HMAC দিয়ে টোকেন server-side-এ যাচাই করে — সরাসরি socket.emit করলেও
   চার্জ ছাড়া সাবমিট/PDF হবে না। */
(function () {
  'use strict';
  var TOKEN_KEY = 'abc_access_token';
  function getToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ''; }
    catch (e) { return ''; }
  }
  async function charge(kind) {
    try {
      var r = await fetch('/api/bdris-apply/charge/' + kind, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
        body: '{}'
      });
      var d = await r.json().catch(function () { return {}; });
      if (r.status === 402 || d.error === 'INSUFFICIENT_BALANCE') {
        alert(d.message || 'ব্যালেন্স অপর্যাপ্ত — রিচার্জ করুন');
        return null;
      }
      if (!r.ok || d.ok === false || !d.chargeToken) {
        alert('চার্জ ব্যর্থ হয়েছে — আবার চেষ্টা করুন');
        return null;
      }
      return d.chargeToken;
    } catch (e) {
      alert('নেটওয়ার্ক সমস্যা — আবার চেষ্টা করুন');
      return null;
    }
  }
  function wrapEmitStep() {
    if (typeof emitStep !== 'function') { setTimeout(wrapEmitStep, 500); return; }
    var orig = emitStep;
    window.emitStep = async function (op, payload, onAckExtra) {
      if (op === 'SUBMIT_S4_OTP') {
        var tok = await charge('submit');
        if (!tok) return false;
        payload = Object.assign({}, payload, { _chargeToken: tok });
      }
      return orig.call(this, op, payload, onAckExtra);
    };
  }
  function wrapSocketEmit() {
    if (typeof socket === 'undefined' || !socket.emit) { setTimeout(wrapSocketEmit, 500); return; }
    var origEmit = socket.emit.bind(socket);
    socket.emit = function (ev) {
      var args = Array.prototype.slice.call(arguments, 1);
      if (ev === 'FETCH_ORIGINAL') {
        charge('pdf').then(function (tok) {
          if (!tok) return;
          if (args[0] && typeof args[0] === 'object') args[0]._chargeToken = tok;
          origEmit.apply(null, [ev].concat(args));
        });
        return true; // চার্জ শেষে আবার emit হবে
      }
      return origEmit.apply(null, [ev].concat(args));
    };
  }
  async function showPrices() {
    try {
      var r = await fetch('/api/bdris-apply/prices', { headers: { 'Authorization': 'Bearer ' + getToken() } });
      var d = await r.json().catch(function () { return {}; });
      if (d.ok) {
        var parts = [];
        if (d.submitPrice > 0) parts.push('আবেদন: ৳' + d.submitPrice);
        if (d.pdfPrice > 0) parts.push('PDF: ৳' + d.pdfPrice);
        if (parts.length && !document.getElementById('abcChargeBar')) {
          var bar = document.createElement('div');
          bar.id = 'abcChargeBar';
          bar.style.cssText = 'background:#2b1d14;color:#d4af37;padding:8px 12px;font-size:13px;text-align:center;';
          bar.textContent = '💰 চার্জ: ' + parts.join(' | ');
          document.body.prepend(bar);
        }
      }
    } catch (e) { /* silent */ }
  }
  wrapEmitStep();
  wrapSocketEmit();
  showPrices();
})();
</script>
