<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=2">
<meta name="theme-color" content="#1e40af">
<title>নতুন অর্ডার প্রদান - All In One</title>
<style>
  .back-nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary-700);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 20px;
    padding: 6px 14px;
    border-radius: var(--r-md);
    background: var(--primary-50);
    transition: all 0.15s ease;
  }
  .back-nav:hover { background: var(--primary-100); }

  .order-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: #f8fafc;
    border: 1px solid var(--border-light);
    border-radius: var(--r-md);
    margin-bottom: 20px;
  }

  .file-drop {
    border: 2px dashed var(--border-light);
    border-radius: var(--r-md);
    padding: 14px 16px;
    background: #fafcff;
    transition: border-color 0.2s;
  }
  .file-drop:hover { border-color: var(--primary-400); }
</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo">
      <div class="logo-icon">🔷</div>
      <div>
        <h2>All In One</h2>
        <p>বিশ্বাস ও সেবার ঠিকানা</p>
      </div>
    </div>
    <nav>
      <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> ড্যাশবোর্ড</div>
      <div class="side-link" onclick="location.href='/services.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span> সকল সেবা</div>
      <div class="side-link on"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span> নতুন অর্ডার</div>
      <div class="side-link" onclick="location.href='/orders.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span> আমার অর্ডার</div>
      <div class="side-link" onclick="location.href='/wallet.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></span> ওয়ালেট ও রিচার্জ</div>
      <div class="side-link" onclick="location.href='/profile.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> পার্সোনাল প্রোফাইল</div>
    </nav>
  </div>

  <div class="main">
    <span class="back-nav" onclick="history.back()">← পূর্বের পৃষ্ঠায় ফিরুন</span>

    <div class="topbar">
      <div>
        <h2>🛒 নতুন সেবার আবেদন / অর্ডার</h2>
        <p>প্রয়োজনীয় তথ্য প্রদান করে দ্রুত অর্ডার সম্পন্ন করুন</p>
      </div>
    </div>

    <div class="card" style="max-width:760px;">
      <div class="order-meta">
        <div>
          <h2 id="svcName" style="font-size:20px;font-weight:800;color:#0f172a;margin-bottom:4px;">সেবার নাম</h2>
          <div style="font-size:12px;color:#64748b;">অর্ডার কনফার্ম করার সাথে সাথে ওয়ালেট থেকে ফি কর্তন হবে</div>
        </div>
        <div>
          <span class="st st-new" id="svcPrice" style="font-size:18px;font-weight:800;padding:6px 16px;">৳০</span>
        </div>
      </div>

      <div id="fields"></div>

      <!-- Sample / Instruction Preview -->
      <div id="sampleWrap" style="display:none;margin-bottom:16px;">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155;">ফরম নমুনা / তথ্য বিন্যাস (প্রয়োজনে এডিট করুন)</label>
        <textarea id="sampleInput" rows="6" style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-family:monospace;font-size:13px;line-height:1.6;"></textarea>
      </div>

      <div id="docs"></div>

      <div class="field" style="margin-top:16px;">
        <label>অতিরিক্ত নোট বা নির্দেশনা (ঐচ্ছিক)</label>
        <textarea id="notes" rows="3" placeholder="কোনো বিশেষ নির্দেশ থাকলে লিখুন…"></textarea>
      </div>

      <div class="err" id="err"></div>

      <button class="btn" id="submitBtn" style="width:100%;padding:14px;font-size:15px;margin-top:10px;">অর্ডার নিশ্চিত করুন →</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=13"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const sid=new URLSearchParams(location.search).get('service');
let svc=null;

async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  if(!sid){location.href='/services.html';return;}
  window._orderIdemKey = ABC.Idempotency.getOrCreate('order_submit_' + sid);
  const r=await ABC.api('/services/'+sid);
  if(!r.ok){alert('সেবা পাওয়া যায়নি');location.href='/services.html';return;}
  const d=await r.json();
  svc=d.service;
  document.getElementById('svcName').textContent=svc.name_bn||svc.name;
  document.getElementById('svcPrice').textContent='৳'+Number(svc.price).toLocaleString('bn-BD');
  const fields=svc.fields_required||[];
  const fh=fields.map(f=>
    '<div class="field"><label>'+esc(f.label||f.name)+(f.required?' *':'')+'</label>'+
    (f.type==='textarea'?
      '<textarea data-field="'+esc(f.name)+'" placeholder="'+esc(f.placeholder||'')+'" rows="3"></textarea>':
      '<input type="'+(f.type||'text')+'" data-field="'+esc(f.name)+'" placeholder="'+esc(f.placeholder||'')+'">')+
    '</div>'
  ).join('');
  document.getElementById('fields').innerHTML=fh;

  // Auto-fill form template
  if(svc.sample_format){
    const sw=document.getElementById('sampleWrap');
    const si=document.getElementById('sampleInput');
    if(sw&&si){
      sw.style.display='block';
      si.value=svc.sample_format;
    }
  }

  const docs=svc.documents_required||[];
  const dh=docs.map((doc,i)=>
    '<div class="field"><label>📄 '+esc(doc)+' (ডকুমেন্ট আপলোড)</label>'+
    '<div class="file-drop"><input type="file" data-doc="'+i+'" data-doctype="'+esc(doc)+'" accept="image/*,.pdf"></div>'+
    '</div>'
  ).join('');
  document.getElementById('docs').innerHTML=dh;

  // Restore draft
  const draft=ABC.Drafts.get('order_'+sid);
  if(draft){
    document.querySelectorAll('[data-field]').forEach(el=>{
      if(draft[el.dataset.field])el.value=draft[el.dataset.field];
    });
    if(draft.notes)document.getElementById('notes').value=draft.notes;
  }
  // Auto-save draft on input
  document.querySelector('.card').addEventListener('input',()=>{
    const d={notes:document.getElementById('notes').value};
    document.querySelectorAll('[data-field]').forEach(el=>{d[el.dataset.field]=el.value;});
    ABC.Drafts.save('order_'+sid,d);
  });
  document.getElementById('submitBtn').onclick=submit;
}

async function submit(){
  const err=document.getElementById('err');
  err.textContent='';
  const data={};
  document.querySelectorAll('[data-field]').forEach(el=>{data[el.dataset.field]=el.value.trim();});
  const fields=svc.fields_required||[];
  for(const f of fields){
    const v=data[f.name]||'';
    if(f.required && !v){
      err.textContent='⚠️ '+(f.label||f.name)+' দিন';
      return;
    }
    if(/brn/i.test(f.name) && v && !/^\d{17}$/.test(v)){
      err.textContent='⚠️ BRN ১৭ সংখ্যার হতে হবে';
      return;
    }
  }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='প্রসেস হচ্ছে…';
  const sampleText=document.getElementById('sampleInput')?document.getElementById('sampleInput').value.trim():'';
  if(sampleText) data._manual_form=sampleText;
  const r=await ABC.api('/orders',{method:'POST',body:{
    service_id:sid,data,notes:document.getElementById('notes').value.trim(),
    idempotency_key: window._orderIdemKey,
    documents:(svc.documents_required||[]).map(d=>({type:d,ref:''}))
  }});
  const d=await r.json();
  btn.disabled=false;btn.textContent='অর্ডার নিশ্চিত করুন →';
  if(!r.ok){
    err.textContent=d.error==='INSUFFICIENT_BALANCE'?'⚠️ ওয়ালেটে পর্যাপ্ত ব্যালেন্স নেই! আগে টাকা রিচার্জ করুন।':
      d.error==='MISSING_DOCUMENTS'?'⚠️ প্রয়োজনীয় ডকুমেন্ট দিন: '+(d.missing||[]).join(', '):
      d.error==='SERVICE_CLOSED'?'⚠️ এই সেবাটি সাময়িকভাবে বন্ধ আছে':'❌ '+d.error;
    return;
  }
  const orderId = d.order.id;
  const fileInputs = document.querySelectorAll('[data-doc]');
  let uploadFailed = false;
  for (const inp of fileInputs) {
    if (inp.files.length) {
      const fd = new FormData();
      fd.append('file', inp.files[0]);
      fd.append('doc_type', inp.dataset.doctype);
      const token = sessionStorage.getItem('abc_access_token') || '';
      try {
        const ur = await fetch('/api/orders/'+orderId+'/documents', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer '+token },
          body: fd
        });
        if (!ur.ok) uploadFailed = true;
      } catch(e) { uploadFailed = true; }
    }
  }
  if (uploadFailed) {
    err.textContent = '⚠️ কিছু ডকুমেন্ট আপলোড হয়নি। অর্ডার তৈরি হয়েছে, পরে আপলোড করুন।';
    return;
  }
  ABC.Drafts.clear('order_'+sid);
  location.href='/order-status.html?id='+orderId;
}

init();
</script>
</body>
</html>
