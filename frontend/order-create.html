<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>অর্ডার করুন - All In One</title>
<link rel="stylesheet" href="/css/coffee.css?v=8">
<!-- cache-bust 2026-10-13: force fresh document load -->
</head>
<body class="app">
<div class="spiral"></div>
<div class="app-shell">
  <div class="app-header">
    <div class="brand">☕ নতুন অর্ডার</div>
    <div class="hdr-actions"><button class="icon-btn" onclick="location.href='/dashboard.html'">🏠</button></div>
  </div>
  <div class="page">
    <span class="back-link" onclick="history.back()">← ফিরে যান</span>
    <div class="form-card" style="margin-top:12px;">
      <h2 id="svcName">অর্ডার</h2>
      <div class="pill" id="svcPrice" style="display:inline-block;margin-bottom:14px;">৳০</div>
      <div id="dynFields"></div>
      <div class="field">
        <label>নোট (ঐচ্ছিক)</label>
        <textarea id="notes" rows="2" placeholder="যেমন: দ্রুত লাগবে"></textarea>
      </div>
      <div class="field" id="docWrap" style="display:none;">
        <label>ডকুমেন্ট আপলোড</label>
        <div id="docList" style="color:var(--muted);font-size:13px;"></div>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="submitBtn">অর্ডার নিশ্চিত করুন →</button>
    </div>
  </div>
</div>
<script src="/js/app.js?v=12"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const sid=new URLSearchParams(location.search).get('service');
let svc=null;
async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  if(!sid){
    // No service ID: show service picker
    const r=await ABC.api('/services');
    if(!r.ok){document.getElementById('err').textContent='সেবা লোড হয়নি';return;}
    const d=await r.json();
    const svcs=d.services||[];
    if(!svcs.length){document.getElementById('err').textContent='কোনো সেবা নেই';return;}
    document.getElementById('svcName').textContent='সেবা বেছে নিন';
    document.getElementById('svcPrice').style.display='none';
    const engMap={'bdris-certificate':'/bdris-certificate.html','bdris-apply':'/bdris-apply.html','death-verify':'/death-verify.html','nid-replica':'/nid-replica.html'};
    document.getElementById('dynFields').innerHTML=svcs.map(s=>{
      const isAuto=s.type==='automated'&&s.engine_id&&engMap[s.engine_id];
      const url=isAuto?engMap[s.engine_id]:'/order-create.html?service='+s.id;
      const badge=s.type==='automated'?' ⚡':'';
      return '<button class="btn svc-pick" data-url="'+esc(url)+'" style="margin:4px 0;width:100%;text-align:left;">'+esc(s.name_bn||s.name)+badge+' — ৳'+Number(s.price).toLocaleString('bn-BD')+'</button>';
    }).join('');
    document.querySelectorAll('.svc-pick').forEach(b=>{b.onclick=()=>{location.href=b.dataset.url;};});
    document.getElementById('submitBtn').style.display='none';
    return;
  }
  const r=await ABC.api('/services/'+sid);
  if(!r.ok){document.getElementById('err').textContent='সেবা পাওয়া যায়নি';return;}
  svc=(await r.json()).service;
  // M-15: one idempotency key per form load — double-clicks/retries dedupe to one order
  if(!window._orderIdemKey) window._orderIdemKey = (crypto.randomUUID ? crypto.randomUUID() : 'k'+Date.now()+Math.random().toString(16).slice(2));
  document.getElementById('svcName').textContent=svc.name_bn||svc.name;
  document.getElementById('svcPrice').textContent='৳'+Number(svc.price).toLocaleString('bn-BD');
  // Dynamic fields from service definition
  const fields=svc.fields_required||[];
  document.getElementById('dynFields').innerHTML=fields.map((f,i)=>{
    const nm=String(f.name||'').toLowerCase(), lb=String(f.label||'').toLowerCase(), ph=String(f.placeholder||'');
    const isLong=/address|ঠিকানা|description|বিবরণ|note|নোট|details/.test(nm+' '+lb) || ph.length>30;
    const input=isLong
      ? '<textarea data-field="'+esc(f.name)+'" rows="3" placeholder="'+esc(ph)+'" style="width:100%;"></textarea>'
      : '<input type="text" data-field="'+esc(f.name)+'" placeholder="'+esc(ph)+'">';
    return '<div class="field"><label>'+esc(f.label||f.name)+(f.required?' *':'')+'</label>'+input+'</div>';
  }).join('');
  // Documents
  const docs=svc.documents_required||[];
  if(docs.length){
    document.getElementById('docWrap').style.display='block';
    document.getElementById('docList').innerHTML=docs.map((d,i)=>'<div class="field"><label>📎 '+esc(d)+' *</label><input type="file" data-doc="'+i+'" data-doctype="'+esc(d)+'" accept=".pdf,.jpg,.jpeg,.png"></div>').join('');
  }
  // Restore draft (survives refresh)
  const draft=ABC.Drafts.load('order_'+sid);
  if(draft){
    document.querySelectorAll('[data-field]').forEach(el=>{
      if(draft[el.dataset.field])el.value=draft[el.dataset.field];
    });
    if(draft.notes)document.getElementById('notes').value=draft.notes;
  }
  // Auto-save draft on input
  document.querySelector('.form-card').addEventListener('input',()=>{
    const d={notes:document.getElementById('notes').value};
    document.querySelectorAll('[data-field]').forEach(el=>{d[el.dataset.field]=el.value;});
    ABC.Drafts.save('order_'+sid,d);
  });
  document.getElementById('submitBtn').onclick=submit;
}
async function submit(){
  const err=document.getElementById('err');
  err.textContent='';
  const data={};
  document.querySelectorAll('[data-field]').forEach(el=>{data[el.dataset.field]=el.value.trim();});  // Validation
  const fields=svc.fields_required||[];
  for(const f of fields){
    const v=data[f.name]||'';
    if(f.required && !v){
      err.textContent='⚠️ '+(f.label||f.name)+' দিন';
      return;
    }
    // BRN must be 17 digits
    if(/brn/i.test(f.name) && v && !/^\d{17}$/.test(v)){
      err.textContent='⚠️ BRN ১৭ সংখ্যার হতে হবে';
      return;
    }
  }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='প্রসেস হচ্ছে…';
  // First create order, then upload documents
  const r=await ABC.api('/orders',{method:'POST',body:{
    service_id:sid,data,notes:document.getElementById('notes').value.trim(),
    idempotency_key: window._orderIdemKey,
    documents:(svc.documents_required||[]).map(d=>({type:d,ref:''}))
  }});
  const d=await r.json();
  btn.disabled=false;btn.textContent='অর্ডার নিশ্চিত করুন →';
  if(!r.ok){
    err.textContent=d.error==='INSUFFICIENT_BALANCE'?'⚠️ ব্যালেন্স কম! আগে রিচার্জ করুন।':
      d.error==='MISSING_DOCUMENTS'?'⚠️ ডকুমেন্ট দিন: '+(d.missing||[]).join(', '):
      d.error==='SERVICE_CLOSED'?'⚠️ সেবা এখন বন্ধ আছে':'❌ '+d.error;
    return;
  }
  // Upload documents if any
  const orderId = d.order.id;
  const fileInputs = document.querySelectorAll('[data-doc]');
  for (const inp of fileInputs) {
    if (inp.files.length) {
      const fd = new FormData();
      fd.append('file', inp.files[0]);
      fd.append('doc_type', inp.dataset.doctype);
      const token = sessionStorage.getItem('abc_access_token') || '';
      await fetch('/api/orders/'+orderId+'/documents', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer '+token },
        body: fd
      });
    }
  }
  ABC.Drafts.clear('order_'+sid);
  location.href='/order-status.html?id='+orderId;
}
init();
</script>
</body>
</html>
