<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অফলাইন - All In One</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e40af">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=3">
<style>
  body {
    background: #091326;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .off-wrap {
    background: #ffffff;
    border-radius: var(--r-xl);
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  }
  .off-icon {
    font-size: 64px;
    margin-bottom: 16px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.08); opacity: 1; }
  }
</style>
</head>
<body>
<div class="off-wrap">
  <div class="off-icon">📡</div>
  <h2 style="font-size:24px;font-weight:800;color:#0f172a;margin-bottom:8px;">ইন্টারনেট সংযোগ নেই</h2>
  <p style="font-size:14px;color:#64748b;line-height:1.6;margin-bottom:24px;">আপনার ডিভাইসটি অফলাইনে রয়েছে। অনুগ্রহ করে Wi-Fi বা মোবাইল ডেটা সংযোগ চেক করে আবার চেষ্টা করুন।</p>
  <button class="btn" style="width:100%;padding:14px;" onclick="location.reload()">🔄 পুনরায় সংযোগ পরীক্ষা করুন</button>
</div>
</body>
</html>
