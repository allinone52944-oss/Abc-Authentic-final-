<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অফলাইন - Abc Authentic</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<link rel="stylesheet" href="/css/coffee.css?v=2">
<style>
.off-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
.off-cup{font-size:72px;animation:steam 2.4s ease-in-out infinite;}
@keyframes steam{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.off-title{color:#d4af37;font-size:28px;margin:16px 0 8px;}
.off-msg{color:#c9a961;font-size:16px;margin-bottom:24px;}
.off-btn{background:linear-gradient(135deg,#d4af37,#b8941f);color:#2b1d14;border:none;border-radius:12px;padding:14px 36px;font-size:17px;font-weight:bold;cursor:pointer;}
.off-btn:active{transform:scale(.96);}
</style>
</head>
<body>
<div class="spiral"></div>
<div class="off-wrap">
  <div class="off-cup">☕</div>
  <div class="off-title">ইন্টারনেট সংযোগ নেই</div>
  <div class="off-msg">অনুগ্রহ করে সংযোগ চেক করে আবার চেষ্টা করুন</div>
  <button class="off-btn" onclick="location.reload()">🔄 আবার চেষ্টা করুন</button>
</div>
</body>
</html>
