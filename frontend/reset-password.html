<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e40af">
<title>নতুন পাসওয়ার্ড - All In One (Abc Authentic)</title>
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=3">
<style>
  body {
    background: #091326;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: var(--r-xl);
    padding: 36px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
  }
  .auth-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2563eb, #38bdf8);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    margin-bottom: 16px;
  }
  .auth-logo img { width: 32px; height: 32px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="/icons/abc-uncommon.svg" alt="ABC">
  </div>
  <h2 style="font-size:22px;font-weight:800;color:#0f172a;margin-bottom:4px;">All In One (Abc Authentic)</h2>
  <div style="font-size:12px;color:#64748b;margin-bottom:24px;">বিশ্বাস ও সেবার ঠিকানা</div>

  <div id="step-form">
    <h3 style="color:#1e40af;margin-bottom:18px;">🔐 নতুন পাসওয়ার্ড সেট করুন</h3>
    <div class="field" style="text-align:left;">
      <label>নতুন পাসওয়ার্ড *</label>
      <input type="password" id="np_pw1" placeholder="কমপক্ষে ৬ অক্ষর" autocomplete="new-password">
    </div>
    <div class="field" style="text-align:left;">
      <label>পুনরায় লিখুন *</label>
      <input type="password" id="np_pw2" placeholder="পাসওয়ার্ড নিশ্চিত করুন" autocomplete="new-password">
    </div>
    <div class="err" id="np_err"></div>
    <button class="btn" id="np_btn" style="width:100%;padding:13px;margin-top:10px;" onclick="doReset()">পাসওয়ার্ড সেট করুন ✓</button>
  </div>

  <div id="step-done" class="hidden">
    <div style="font-size:52px;margin-bottom:12px;">✅</div>
    <h3 style="color:#059669;margin-bottom:8px;">পাসওয়ার্ড আপডেট হয়েছে</h3>
    <p style="color:#64748b;font-size:14px;">এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।</p>
    <a href="/login.html" class="btn" style="display:inline-flex;margin-top:18px;text-decoration:none;">লগইনে যান →</a>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token');
async function doReset() {
  const p1 = document.getElementById('np_pw1').value;
  const p2 = document.getElementById('np_pw2').value;
  const err = document.getElementById('np_err');
  const btn = document.getElementById('np_btn');
  err.textContent = '';
  if (!p1 || p1.length < 6) { err.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে'; return; }
  if (p1 !== p2) { err.textContent = 'দুটি পাসওয়ার্ড মিলছে না'; return; }
  if (!token) { err.textContent = 'রিসেট লিংকটি ভুল বা মেয়াদ শেষ হয়েছে'; return; }
  btn.disabled = true; btn.textContent = 'আপডেট হচ্ছে…';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: p1 })
    });
    const d = await r.json();
    if (!r.ok) {
      err.textContent = d.error || 'রিসেট ব্যর্থ হয়েছে';
      btn.disabled = false; btn.textContent = 'পাসওয়ার্ড সেট করুন ✓';
      return;
    }
    document.getElementById('step-form').classList.add('hidden');
    document.getElementById('step-done').classList.remove('hidden');
  } catch (e) {
    err.textContent = 'নেটওয়ার্ক সমস্যা হয়েছে';
    btn.disabled = false; btn.textContent = 'পাসওয়ার্ড সেট করুন ✓';
  }
}
</script>
</body>
</html>
