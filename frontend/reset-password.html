<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>নতুন পাসওয়ার্ড - All In One (Abc Authentic)</title>
<link rel="stylesheet" href="/css/coffee.css?v=4">
</head>
<body class="auth">
<div class="spiral"></div>
<div class="gold-orb" style="width:300px;height:300px;top:10%;left:5%;"></div>
<div class="gold-orb" style="width:200px;height:200px;bottom:15%;right:8%;animation-delay:-4s;"></div>

<div class="card" style="text-align:center;">
  <div class="logo">
    <h1>☕ ALL IN ONE</h1>
    <p>ABC AUTHENTIC</p>
    <div style="margin-top:12px;color:#c9a961;font-size:14px;letter-spacing:1px;">বিশ্বাস ও সেবার ঠিকানা</div>
  </div>

  <div id="step-form">
    <div style="font-size:52px;margin-bottom:8px;">🔐</div>
    <h3 style="color:var(--gold);margin:8px 0;">নতুন পাসওয়ার্ড সেট করুন</h3>
    <div class="field" style="text-align:left;">
      <label>নতুন পাসওয়ার্ড *</label>
      <input type="password" id="np_pw1" placeholder="কমপক্ষে ৬ অক্ষর">
    </div>
    <div class="field" style="text-align:left;">
      <label>আবার লিখুন *</label>
      <input type="password" id="np_pw2" placeholder="••••••••">
    </div>
    <div class="err" id="np_err"></div>
    <button class="btn" id="np_btn" onclick="doReset()">পাসওয়ার্ড সেট করুন ✓</button>
  </div>

  <div id="step-done" class="hidden">
    <div style="font-size:52px;margin-bottom:8px;">✅</div>
    <h3 style="color:var(--gold);">পাসওয়ার্ড বদলে গেছে!</h3>
    <p style="color:var(--muted);font-size:14px;">নতুন পাসওয়ার্ড দিয়ে লগইন করুন।<br>নিরাপত্তার জন্য সব ডিভাইস থেকে লগআউট করা হয়েছে।</p>
    <button class="btn" onclick="location.href='/login.html'" style="margin-top:14px;">লগইন করুন →</button>
  </div>

  <div id="step-bad" class="hidden">
    <div style="font-size:52px;margin-bottom:8px;">⚠️</div>
    <h3 style="color:#ff6b6b;">লিংকটি সঠিক নয়</h3>
    <p style="color:var(--muted);font-size:14px;">লিংকটি মেয়াদোত্তীর্ণ বা ইতিমধ্যে ব্যবহার করা হয়েছে।</p>
    <button class="btn" onclick="location.href='/forgot-password.html'" style="margin-top:14px;">নতুন লিংক নিন →</button>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
if (!/^[a-f0-9]{64}$/.test(TOKEN)) {
  document.getElementById('step-form').classList.add('hidden');
  document.getElementById('step-bad').classList.remove('hidden');
}
async function doReset() {
  const p1 = document.getElementById('np_pw1').value;
  const p2 = document.getElementById('np_pw2').value;
  const err = document.getElementById('np_err');
  const btn = document.getElementById('np_btn');
  err.textContent = '';
  if (!p1 || p1.length < 6) { err.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে'; return; }
  if (p1 !== p2) { err.textContent = 'দুটি পাসওয়ার্ড মিলছে না'; return; }
  btn.disabled = true; btn.textContent = 'সেট হচ্ছে…';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, new_password: p1 }),
    });
    const d = await r.json();
    if (!r.ok) {
      if (d.error === 'INVALID_OR_EXPIRED' || d.error === 'INVALID_TOKEN') {
        document.getElementById('step-form').classList.add('hidden');
        document.getElementById('step-bad').classList.remove('hidden');
      } else {
        err.textContent = d.error === 'WEAK_PASSWORD' ? 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে' : 'ব্যর্থ: ' + d.error;
      }
      return;
    }
    document.getElementById('step-form').classList.add('hidden');
    document.getElementById('step-done').classList.remove('hidden');
  } catch (e) { err.textContent = 'সংযোগ ব্যর্থ — আবার চেষ্টা করুন'; }
  finally { btn.disabled = false; btn.textContent = 'পাসওয়ার্ড সেট করুন ✓'; }
}
document.getElementById('np_pw2').addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
</script>
</body>
</html>
