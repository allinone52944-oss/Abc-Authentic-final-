<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: Coffee gradient circle -->
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6d1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle: Unity (All In One) -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#coffeeGrad)" stroke-width="3"/>
  <!-- Letter A formed by coffee beans -->
  <path d="M 30 70 L 50 25 L 70 70" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar: Checkmark for Authentic/Trust -->
  <path d="M 38 58 L 46 66 L 62 48" fill="none" stroke="#f5e6c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Coffee bean dots: The 'One' in All In One -->
  <circle cx="50" cy="82" r="3" fill="#d4af37"/>
</svg>
