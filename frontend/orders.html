<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=3">
<meta name="theme-color" content="#1e40af">
<title>আমার অর্ডার - All In One</title>
<style>
  .table-container {
    background: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: var(--r-lg);
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }
  .btn-view {
    background: var(--primary-50);
    color: var(--primary-700);
    border: 1px solid var(--primary-200);
    padding: 6px 14px;
    border-radius: var(--r-sm);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-view:hover {
    background: var(--primary-100);
    border-color: var(--primary-300);
  }
  .btn-more {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: #ffffff;
    border: 1px solid var(--border-light);
    color: var(--text-main);
    padding: 12px;
    border-radius: var(--r-md);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-more:hover {
    background: var(--bg-subtle);
  }

  @media (max-width: 768px) {
    .table-container {
      background: transparent;
      border: none;
      box-shadow: none;
      overflow: visible;
    }
    .table-container table, .table-container thead, .table-container tbody, .table-container tr, .table-container td {
      display: block;
      width: 100%;
    }
    .table-container thead {
      display: none;
    }
    .table-container tr {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--r-lg);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }
    .table-container td {
      padding: 4px 0 !important;
      border: none !important;
      text-align: left !important;
    }
    .mobile-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .mobile-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 12px;
      padding-top: 8px;
      border-top: 1px dashed #e2e8f0;
    }
    .mobile-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .mobile-card-actions button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
    }
  }

</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo">
      <div class="logo-icon">🔷</div>
      <div>
        <h2>All In One</h2>
        <p>বিশ্বাস ও সেবার ঠিকানা</p>
      </div>
    </div>
    <nav>
      <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> ড্যাশবোর্ড</div>
      <div class="side-link" onclick="location.href='/services.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span> সকল সেবা</div>
      <div class="side-link on"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span> আমার অর্ডার</div>
      <div class="side-link" onclick="location.href='/history.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></span> ইতিহাস</div>
      <div class="side-link" onclick="location.href='/wallet.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></span> ওয়ালেট ও রিচার্জ</div>
      <div class="side-link" onclick="location.href='/profile.html'"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span> পার্সোনাল প্রোফাইল</div>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h2>📦 আমার অর্ডারসমূহ</h2>
        <p>আপনার প্রদত্ত সকল অর্ডারের রিয়েল-টাইম অগ্রগতি ও স্ট্যাটাস</p>
      </div>
    </div>

    <!-- Status Filter Buttons -->
    <div class="filters" id="filters">
      <button class="fbtn on" data-st="">সব অর্ডার</button>
      <button class="fbtn" data-st="new">নতুন</button>
      <button class="fbtn" data-st="pending">অপেক্ষমান</button>
      <button class="fbtn" data-st="processing">প্রসেসিং</button>
      <button class="fbtn" data-st="completed">সম্পন্ন</button>
      <button class="fbtn" data-st="delivered">ডেলিভার্ড</button>
      <button class="fbtn" data-st="cancelled">বাতিল/রিফান্ড</button>
    </div>

    <!-- Orders Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>সেবার নাম</th>
            <th>মূল্য</th>
            <th>বর্তমান অবস্থা</th>
            <th>অর্ডারের তারিখ</th>
            <th style="text-align:right;">অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="list">
          <tr>
            <td colspan="5" style="text-align:center;padding:30px 0;color:#94a3b8;">লোড হচ্ছে…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button class="btn-more" id="moreBtn" style="display:none;">আরো লোড করুন ↓</button>
  </div>
</div>

<button class="wa-fab" id="waFab" aria-label="WhatsApp-এ সাহায্য চান" title="WhatsApp-এ সরাসরি সাহায্য চান"><img src="/icons/whatsapp.svg" alt="WhatsApp"></button>

<!-- Mobile Tabbar -->
<div class="m-tabbar">
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/dashboard.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>হোম</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/services.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>সেবা</div>
  <div class="m-tab on" aria-current="page"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div>অর্ডার</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/wallet.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div>ওয়ালেট</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/profile.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>প্রোফাইল</div>
</div>

<script src="/js/app.js?v=18"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const STBN={new:'নতুন',pending:'অপেক্ষমান',received:'গৃহীত',processing:'প্রসেসিং',registered:'নিবন্ধিত',completed:'সম্পন্ন',delivered:'ডেলিভার্ড',failed:'ব্যর্থ',cancelled:'বাতিল',refunded:'রিফান্ডেড'};
let page=1,status='';

async function init(){
  const me=await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  const ou=(await me.json()).user||{};
  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/8801835414122?text='+encodeURIComponent('আসসালামু আলাইকুম! আমি '+ou.name+' (ফোন: '+ou.phone+')। সাহায্য দরকার।'),'_blank');
  };
  document.querySelectorAll('#filters .fbtn').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#filters .fbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      status=b.dataset.st;
      page=1;
      document.getElementById('list').innerHTML='';
      load();
    };
  });
  document.getElementById('moreBtn').onclick=()=>{page++;load();};
  load();
}

async function load(){
  try {
    const r=await ABC.api('/orders?limit=10&page='+page+(status?'&status='+status:''));
    if(!r.ok){
      if(page===1){
        document.getElementById('list').innerHTML='<tr><td colspan="5" style="text-align:center;padding:30px 0;color:#ef4444;">অর্ডার তালিকা লোড করা সম্ভব হয়নি। পেজ রিফ্রেশ করুন।</td></tr>';
      }
      return;
    }
    const d=await r.json();
    const orders = (d && d.orders) ? d.orders : [];
    if(!orders.length && page===1){
      document.getElementById('list').innerHTML='<tr><td colspan="5" style="text-align:center;color:#64748b;padding:40px;">কোনো অর্ডার পাওয়া যায়নি</td></tr>';
      document.getElementById('moreBtn').style.display='none';
      return;
    }
    const html=orders.map(o=>
      '<tr>'+
        '<td><b style="color:#0f172a;font-size:14px;">'+esc(o.service_name_bn||o.service_name)+'</b><div style="font-size:11px;color:#94a3b8;margin-top:2px;">ID: #'+esc((o.id||'').slice(0,8))+'</div></td>'+
        '<td><b style="color:#1e40af;font-size:15px;">৳'+Number(o.price||0).toLocaleString('bn-BD')+'</b></td>'+
        '<td><span class="st st-'+esc(o.status)+'">'+esc(STBN[o.status]||o.status)+'</span></td>'+
        '<td>'+(o.created_at ? new Date(o.created_at).toLocaleDateString('bn-BD') : '-')+'</td>'+
        '<td style="text-align:right;"><button class="btn-view" onclick="location.href=\'/order-detail.html?id=' + encodeURIComponent(o.id) + '\'">বিস্তারিত দেখুন →</button></td>'+
      '</tr>'
    ).join('');

    if (page === 1) {
      document.getElementById('list').innerHTML = html;
    } else {
      document.getElementById('list').insertAdjacentHTML('beforeend', html);
    }
    document.getElementById('moreBtn').style.display=(page*10>=(d.total||0))?'none':'block';
  } catch(e) {
    if(page===1){
      document.getElementById('list').innerHTML='<tr><td colspan="5" style="text-align:center;padding:30px 0;color:#ef4444;">নেটওয়ার্ক সমস্যা হয়েছে। পুনরায় চেষ্টা করুন।</td></tr>';
    }
  }
}

init();
</script>
</body>
</html>
