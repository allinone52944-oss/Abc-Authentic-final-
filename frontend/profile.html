<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abc Authentic">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>প্রোফাইল - All In One</title>
<link rel="stylesheet" href="/css/coffee.css?v=5">
</head>
<body class="app">
<div class="spiral"></div>
<div class="app-shell">
  <div class="app-header">
    <div class="brand">☕ প্রোফাইল</div>
    <div class="hdr-actions"><button class="icon-btn" onclick="location.href='/dashboard.html'">🏠</button></div>
  </div>
  <div class="page">
    <span class="back-link" onclick="location.href='/dashboard.html'">← ড্যাশবোর্ড</span>
    <div class="form-card" style="margin-top:12px;">
      <h2>👤 আমার তথ্য</h2>
      <div class="field"><label>নাম</label><input type="text" id="name"></div>
      <div class="field"><label>মোবাইল</label><input type="text" id="phone" disabled style="opacity:0.6;"></div>
      <div class="field"><label>WhatsApp</label><input type="text" id="whatsapp"></div>
      <div class="field"><label>ইমেইল</label><input type="email" id="email"></div>
      <div class="field"><label>ধর্ম</label>
        <select id="religion">
          <option value="islam">ইসলাম</option>
          <option value="hindu">হিন্দু</option>
          <option value="buddhist">বৌদ্ধ</option>
          <option value="christian">খ্রিস্টান</option>
          <option value="other">অন্যান্য</option>
        </select>
      </div>
      <div class="err" id="err"></div><div class="okmsg" id="ok"></div>
      <button class="btn" onclick="save()">সংরক্ষণ করুন</button>
    </div>
    <div class="form-card" style="margin-top:14px;">
      <h2>🔊 ভয়েস সেটিংস</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <div style="color:var(--cream);font-weight:700;font-size:15px;">ভয়েস গ্রিটিং</div>
          <div style="color:var(--muted);font-size:12px;margin-top:2px;">লগইনে ধর্মভিত্তিক বাংলা শুভেচ্ছা শুনুন</div>
        </div>
        <button class="mini-btn" id="vgToggle" onclick="toggleVoiceGreet()">…</button>
      </div>
    </div>
    <div class="form-card" style="margin-top:14px;">
      <h2>🔑 পাসওয়ার্ড পরিবর্তন</h2>
      <div class="field"><label>বর্তমান পাসওয়ার্ড</label><input type="password" id="cur"></div>
      <div class="field"><label>নতুন পাসওয়ার্ড</label><input type="password" id="nw"></div>
      <div class="err" id="perr"></div><div class="okmsg" id="pok"></div>
      <button class="btn-secondary" onclick="changePw()">পাসওয়ার্ড বদলান</button>
      <div class="note">পাসওয়ার্ড ভুলে গেলে এখান থেকেই রিসেট করুন<br>(Forgot password প্রোফাইলের ভেতরেই)</div>
    </div>
  </div>
</div>
<script src="/js/app.js?v=4"></script>
<script>
function voiceGreetOn(){
  try { return localStorage.getItem('abc_greet_voice') !== 'off'; } catch(e){ return true; }
}
function paintVoiceGreetBtn(){
  const b=document.getElementById('vgToggle');
  const on=voiceGreetOn();
  b.className='mini-btn'+(on?' ok':'');
  b.textContent=on?'✅ চালু':'❌ বন্ধ';
}
function toggleVoiceGreet(){
  try { localStorage.setItem('abc_greet_voice', voiceGreetOn() ? 'off' : 'on'); } catch(e){}
  paintVoiceGreetBtn();
}
async function init(){
  const r=await ABC.api('/auth/me');
  if(!r.ok){location.href='/login.html';return;}
  const {user}=await r.json();
  document.getElementById('name').value=user.name||'';
  document.getElementById('phone').value=user.phone||'';
  document.getElementById('whatsapp').value=user.whatsapp||'';
  document.getElementById('email').value=user.email||'';
  document.getElementById('religion').value=user.religion||'other';
  paintVoiceGreetBtn();
}
async function save(){
  const err=document.getElementById('err'),ok=document.getElementById('ok');
  err.textContent='';ok.textContent='';
  const r=await ABC.api('/auth/me',{method:'PUT',body:{
    name:document.getElementById('name').value.trim(),
    whatsapp:document.getElementById('whatsapp').value.trim(),
    email:document.getElementById('email').value.trim(),
    religion:document.getElementById('religion').value,
  }});
  const d=await r.json();
  if(!r.ok){err.textContent='❌ '+(d.error||'ব্যর্থ');return;}
  ok.textContent='✅ সংরক্ষণ হয়েছে!';
}
async function changePw(){
  const perr=document.getElementById('perr'),pok=document.getElementById('pok');
  perr.textContent='';pok.textContent='';
  const r=await ABC.api('/auth/change-password',{method:'POST',body:{
    current_password:document.getElementById('cur').value,
    new_password:document.getElementById('nw').value,
  }});
  const d=await r.json();
  if(!r.ok){perr.textContent='❌ '+(d.error==='WRONG_CURRENT_PASSWORD'?'বর্তমান পাসওয়ার্ড ভুল':d.error);return;}
  pok.textContent='✅ পাসওয়ার্ড বদলে গেছে! সব ডিভাইসে লগআউট হয়েছে।';
  document.getElementById('cur').value='';document.getElementById('nw').value='';
}
init();
</script>
</body>
</html>
