<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=3">
<meta name="theme-color" content="#1e40af">
<!-- Audit #51 — the legacy manual-submit path is unified into the
     order flow: this URL forwards to order-create (a picked service
     rides along as ?service=). The file stays so old bookmarks and
     direct links keep working — never delete it. New submissions are
     orders; pre-unification manual records stay viewable on
     orders.html. The 5s meta refresh is the no-JS fallback; the
     script below redirects immediately when JS runs. -->
<meta http-equiv="refresh" content="5; url=/order-create.html">
<title>ম্যানুয়াল আবেদন - All In One</title>
</head>
<body>
<div style="max-width:560px;margin:80px auto 0;padding:0 16px;">
  <div style="background:#ffffff;border:1px solid var(--border-light);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:var(--shadow-sm);">
    <div style="font-size:36px;margin-bottom:8px;">📝</div>
    <h2 style="font-size:18px;font-weight:800;color:#0f172a;margin-bottom:8px;">ম্যানুয়াল আবেদন এখন অর্ডার হিসেবে জমা দিতে হয়</h2>
    <p style="font-size:14px;color:#64748b;line-height:1.7;margin-bottom:16px;">আপনাকে অর্ডার পাতায় নিয়ে যাওয়া হচ্ছে — সেখানে সেবা বেছে, ফি দেখে, তারপর জমা দিন।</p>
    <a id="goLink" href="/order-create.html" class="btn btn-primary" style="display:inline-block;padding:12px 24px;font-weight:700;text-decoration:none;">অর্ডার পাতায় যান →</a>
    <p style="font-size:13px;color:#64748b;margin-top:16px;">আগে ম্যানুয়াল পথে জমা দেওয়া আবেদনগুলো <a href="/orders.html" style="color:#1d4ed8;font-weight:700;">আমার অর্ডার</a> পাতায় দেখা যাবে।</p>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var svc = q.get('service') || q.get('service_id') || '';
  var target = '/order-create.html' + (svc ? '?service=' + encodeURIComponent(svc) : '');
  var link = document.getElementById('goLink');
  if (link) link.href = target;
  // replace() so Back never returns to this redirect page.
  location.replace(target);
})();
</script>
</body>
</html>
