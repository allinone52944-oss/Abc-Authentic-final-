<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:#1a120b;border:2px solid #d4af37;border-radius:14px;padding:30px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;position:relative;overflow:hidden}
.letters span{display:inline-block;font-size:30px;color:#d4af37;margin:0 6px;animation:bounce 1.8s infinite}
.letters span:nth-child(2){animation-delay:.2s}.letters span:nth-child(3){animation-delay:.4s}.letters span:nth-child(4){animation-delay:.6s}.letters span:nth-child(5){animation-delay:.8s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bn h2{color:#f5ead6;font-size:24px;margin:12px 0 6px}.bn p{color:#c9bfa8;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="letters"><span>অ</span><span>আ</span><span>ই</span><span>ঈ</span><span>উ</span></div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
