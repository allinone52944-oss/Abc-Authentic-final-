<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:linear-gradient(180deg,#2b1d14,#1a120b);border:2px solid #d4af37;border-radius:14px;padding:34px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;min-height:120px}
.bean{position:absolute;top:-30px;font-size:22px;animation:fall 4s linear infinite;opacity:.7}
@keyframes fall{to{transform:translateY(220px) rotate(360deg)}}
.bn h2{color:#f5ead6;font-size:26px;margin:0 0 6px;position:relative;z-index:2;text-shadow:0 2px 8px #000}
.bn p{color:#d4af37;font-size:14px;margin:0;position:relative;z-index:2}
</style></head><body style="margin:0;background:transparent">
<div class="bn">
<span class="bean" style="left:8%;animation-delay:0s">🫘</span><span class="bean" style="left:25%;animation-delay:1.2s">🫘</span><span class="bean" style="left:55%;animation-delay:.6s">🫘</span><span class="bean" style="left:75%;animation-delay:2s">🫘</span><span class="bean" style="left:90%;animation-delay:1.6s">🫘</span>
<h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
