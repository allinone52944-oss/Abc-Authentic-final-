<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{display:flex;align-items:center;gap:18px;background:linear-gradient(90deg,#3d2b1f,#2b1d14);border:2px solid #d4af37;border-radius:14px;padding:22px;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.tag{background:#d4af37;color:#2b1d14;font-weight:bold;font-size:22px;border-radius:12px;padding:14px 18px;animation:pulse 1.6s infinite;white-space:nowrap}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(212,175,55,.5)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(212,175,55,0)}}
.bn h2{color:#f5ead6;font-size:22px;margin:0 0 4px}
.bn p{color:#c9bfa8;font-size:13px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="tag">🎁</div><div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div></div>
</body></html>
