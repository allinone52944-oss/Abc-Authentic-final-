<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;background:radial-gradient(ellipse at 50% 100%,#4a2410,#160d08 70%);border:2px solid #d4af37;border-radius:14px;padding:34px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;overflow:hidden}
.diya{font-size:38px;display:inline-block;margin:0 10px;animation:fl 1.4s ease-in-out infinite}
.diya:nth-child(2){animation-delay:.35s}.diya:nth-child(3){animation-delay:.7s}
@keyframes fl{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px #ff9d2e)}50%{transform:scale(1.12);filter:drop-shadow(0 0 16px #ff9d2e)}}
.bn h2{color:#ffd9a0;font-size:26px;margin:12px 0 6px}
.bn p{color:#c9a06a;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div><span class="diya">🪔</span><span class="diya">🪔</span><span class="diya">🪔</span></div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
