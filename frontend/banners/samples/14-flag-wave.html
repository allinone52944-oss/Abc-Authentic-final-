<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:linear-gradient(180deg,#006a4e 50%,#f42a41 50%);border-radius:14px;padding:6px;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;border:2px solid #d4af37}
.inner{background:rgba(20,12,6,.88);border-radius:10px;padding:26px 20px;text-align:center;position:relative;overflow:hidden}
.flag{font-size:44px;display:inline-block;animation:waving 2.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes waving{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.inner h2{color:#ffe9a8;font-size:24px;margin:8px 0 4px}.inner p{color:#c9bfa8;font-size:13px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="inner"><div class="flag">🇧🇩</div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div></div>
</body></html>
