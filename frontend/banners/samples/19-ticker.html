<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{display:flex;align-items:stretch;background:#1a120b;border-radius:10px;overflow:hidden;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;border:2px solid #d4af37}
.live{background:#c0392b;color:#fff;font-weight:bold;padding:14px 18px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:10px;height:10px;background:#fff;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.scroll{flex:1;overflow:hidden;display:flex;align-items:center}
.scroll div{white-space:nowrap;color:#ffe9a8;font-size:16px;animation:mq 14s linear infinite;padding-left:100%}
@keyframes mq{to{transform:translateX(-100%)}}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="live"><span class="dot"></span>LIVE</div><div class="scroll"><div>{{text_bn}} &nbsp;•&nbsp; {{text_en}} &nbsp;•&nbsp; {{text_bn}}</div></div></div>
</body></html>
