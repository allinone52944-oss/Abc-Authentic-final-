<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#1e40af,#3b82f6);border-radius:14px;padding:28px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;box-shadow:0 4px 15px rgba(30,64,175,0.3)}
.bn::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{transform:translate(0,0)}50%{transform:translate(5%,5%)}}
.bn h2{color:#fff;font-size:28px;margin:0 0 8px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,0.2);position:relative}
.bn p{color:#dbeafe;font-size:15px;margin:0;position:relative}
.bn .en{color:#93c5fd;font-size:11px;letter-spacing:3px;margin-top:10px;position:relative}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><h2>{{text_bn}}</h2><p>{{text_en}}</p><div class="en">ALL IN ONE • ABC AUTHENTIC</div></div>
</body></html>
