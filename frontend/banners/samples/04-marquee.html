<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{overflow:hidden;background:#1a120b;border-top:3px solid #d4af37;border-bottom:3px solid #d4af37;padding:14px 0;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;border-radius:8px}
.track{display:inline-block;white-space:nowrap;animation:mq 30s linear infinite;color:#d4af37;font-size:19px;font-weight:bold}
@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.track span{margin:0 30px}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="track"><span>📢 {{text_bn}}</span><span>📢 {{text_bn}}</span><span>📢 {{text_bn}}</span></div></div>
</body></html>
