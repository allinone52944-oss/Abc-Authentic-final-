<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{display:flex;align-items:center;justify-content:center;gap:20px;background:linear-gradient(90deg,#2b1d14,#3d2b1f,#2b1d14);border:2px solid #d4af37;border-radius:14px;padding:28px 20px;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.hs{font-size:52px;animation:shake 1.8s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.bn h2{color:#f5ead6;font-size:24px;margin:0 0 4px}.bn p{color:#d4af37;font-size:13px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="hs">🤝</div><div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div></div>
</body></html>
