<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:linear-gradient(120deg,#2b1d14,#5a3d1e,#2b1d14,#3d2b1f);background-size:300% 300%;border-radius:14px;padding:32px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;animation:gs 7s ease infinite;border:2px solid #d4af37}
@keyframes gs{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bn h2{color:#fff;font-size:27px;margin:0 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.bn p{color:#ffe9a8;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><h2>🔥 {{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
