<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:#1a120b;border:2px solid #d4af37;border-radius:14px;padding:32px 24px;font-family:monospace;max-width:720px;margin:0 auto}
.tw{color:#d4af37;font-size:21px;overflow:hidden;white-space:nowrap;border-right:3px solid #d4af37;animation:typing 4s steps(40) infinite,blink .7s step-end infinite;width:fit-content;max-width:100%}
@keyframes typing{0%{width:0}55%,85%{width:100%}100%{width:0}}
@keyframes blink{50%{border-color:transparent}}
.bn .sub{color:#8a7a5f;font-size:13px;margin-top:10px;font-family:'Noto Sans Bengali',sans-serif}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="tw">{{text_bn}}</div><div class="sub">{{text_en}}</div></div>
</body></html>
