<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#4a3220,#1a120b 70%);border:2px solid #d4af37;border-radius:14px;padding:34px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.cup{font-size:52px;position:relative;display:inline-block}
.steam{position:absolute;left:50%;top:-34px;width:8px;height:34px;background:linear-gradient(to top,rgba(212,175,55,0),rgba(212,175,55,.7));border-radius:50%;filter:blur(3px);animation:steam 2.4s ease-in-out infinite}
.steam.s2{margin-left:-16px;animation-delay:.5s}.steam.s3{margin-left:16px;animation-delay:1s}
@keyframes steam{0%{transform:translateY(8px) scaleY(.6);opacity:0}50%{opacity:1}100%{transform:translateY(-10px) scaleY(1.3);opacity:0}}
.bn h2{color:#f5ead6;font-size:26px;margin:10px 0 6px}
.bn p{color:#d4af37;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="cup">☕<span class="steam"></span><span class="steam s2"></span><span class="steam s3"></span></div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
