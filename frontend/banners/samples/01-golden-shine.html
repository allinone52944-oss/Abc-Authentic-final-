<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:linear-gradient(135deg,#2b1d14,#1a120b);border:2px solid #d4af37;border-radius:14px;padding:28px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.bn h2{color:#d4af37;font-size:30px;margin:0 0 8px;position:relative;display:inline-block}
.bn h2::after{content:'';position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s infinite}
@keyframes shine{to{left:130%}}
.bn p{color:#c9bfa8;font-size:15px;margin:0}
.bn .en{color:#8a7a5f;font-size:12px;letter-spacing:3px;margin-top:8px}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><h2>{{text_bn}}</h2><p>{{text_en}}</p><div class="en">ALL IN ONE • ABC AUTHENTIC</div></div>
</body></html>
