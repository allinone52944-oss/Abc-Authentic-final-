<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:linear-gradient(135deg,#1c130c,#2b1d14);border:2px solid #d4af37;border-radius:14px;padding:30px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.hg{font-size:50px;display:inline-block;animation:flipT 4s ease-in-out infinite}
@keyframes flipT{0%,45%{transform:rotate(0)}55%,95%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.bn h2{color:#ffe9a8;font-size:24px;margin:10px 0 6px}
.bn p{color:#c9bfa8;font-size:14px;margin:0}
.bar{height:6px;background:#3d2b1f;border-radius:3px;margin:14px auto 0;max-width:280px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#d4af37;border-radius:3px;animation:load 2.4s ease-in-out infinite}
@keyframes load{0%{margin-left:-40%}100%{margin-left:100%}}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="hg">⏳</div><h2>{{text_bn}}</h2><p>{{text_en}}</p><div class="bar"><i></i></div></div>
</body></html>
