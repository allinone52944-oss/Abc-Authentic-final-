<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:#1a120b;border:2px solid #d4af37;border-radius:14px;padding:32px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.gift{font-size:56px;display:inline-block;animation:jump 1.6s ease infinite}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(0) rotate(8deg)}}
.bn h2{color:#ffe9a8;font-size:25px;margin:10px 0 6px}
.bn p{color:#c9bfa8;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="gift">🎁</div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
