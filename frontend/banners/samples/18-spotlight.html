<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:#100a05;border-radius:14px;padding:32px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto;border:2px solid #3d2b1f}
.light{position:absolute;top:-40%;width:120px;height:190%;background:linear-gradient(180deg,rgba(255,233,168,.28),transparent);transform:rotate(18deg);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,100%{left:-20%}50%{left:100%}}
.bn h2{color:#ffe9a8;font-size:26px;margin:0 0 6px;position:relative;z-index:2}
.bn p{color:#c9bfa8;font-size:14px;margin:0;position:relative;z-index:2}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="light"></div><h2>🔦 {{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
