<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:#0a0a14;border:2px solid #d4af37;border-radius:14px;padding:36px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.fw{position:absolute;font-size:26px;animation:boom 2.6s ease-out infinite;opacity:0}
@keyframes boom{0%{transform:scale(.3);opacity:0}25%{opacity:1}60%{transform:scale(1.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.bn h2{color:#fff;font-size:27px;margin:0 0 6px;position:relative;z-index:2;text-shadow:0 0 14px #d4af37}
.bn p{color:#ffe9a8;font-size:14px;margin:0;position:relative;z-index:2}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><span class="fw" style="top:8%;left:12%;animation-delay:0s">🎆</span><span class="fw" style="top:15%;right:14%;animation-delay:.9s">🎇</span><span class="fw" style="top:55%;left:6%;animation-delay:1.7s">🎇</span><span class="fw" style="top:60%;right:8%;animation-delay:.5s">🎆</span><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
