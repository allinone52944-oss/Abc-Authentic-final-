<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{position:relative;overflow:hidden;background:linear-gradient(135deg,#3d2b1f,#1a120b);border:2px solid #d4af37;border-radius:14px;padding:36px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.cf{position:absolute;top:-16px;width:10px;height:14px;animation:cfall 3.6s linear infinite}
@keyframes cfall{to{transform:translateY(240px) rotate(720deg)}}
.bn h2{color:#ffe9a8;font-size:27px;margin:0 0 6px;position:relative;z-index:2}
.bn p{color:#c9bfa8;font-size:14px;margin:0;position:relative;z-index:2}
</style></head><body style="margin:0;background:transparent">
<div class="bn">
<span class="cf" style="left:5%;background:#d4af37;animation-delay:0s"></span><span class="cf" style="left:18%;background:#ff6b6b;animation-delay:.8s"></span><span class="cf" style="left:33%;background:#4ecdc4;animation-delay:1.6s"></span><span class="cf" style="left:52%;background:#ffe66d;animation-delay:.4s"></span><span class="cf" style="left:68%;background:#d4af37;animation-delay:2.2s"></span><span class="cf" style="left:82%;background:#a8e6cf;animation-delay:1.1s"></span><span class="cf" style="left:94%;background:#ff6b6b;animation-delay:2.8s"></span>
<h2>🎊 {{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
