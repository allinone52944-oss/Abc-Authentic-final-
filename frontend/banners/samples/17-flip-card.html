<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{perspective:900px;max-width:720px;margin:0 auto;font-family:'Noto Sans Bengali',sans-serif}
.card{position:relative;transform-style:preserve-3d;animation:flip 6s ease-in-out infinite}
@keyframes flip{0%,42%{transform:rotateY(0)}50%,92%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.face{backface-visibility:hidden;border-radius:14px;padding:30px 20px;text-align:center;border:2px solid #d4af37}
.front{background:linear-gradient(135deg,#2b1d14,#4a3220)}
.back{background:linear-gradient(135deg,#4a3220,#2b1d14);position:absolute;inset:0;transform:rotateY(180deg)}
.face h2{color:#ffe9a8;font-size:24px;margin:0 0 6px}.face p{color:#c9bfa8;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="card">
<div class="face front"><h2>🎁 {{text_bn}}</h2><p>{{text_en}}</p></div>
<div class="face back"><h2>✨ {{text_en}}</h2><p>{{text_bn}}</p></div>
</div></div>
</body></html>
