<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><style>
.bn{background:radial-gradient(circle at 50% 120%,#3d2b1f,#160d08 75%);border:2px solid #d4af37;border-radius:14px;padding:34px 20px;text-align:center;font-family:'Noto Sans Bengali',sans-serif;max-width:720px;margin:0 auto}
.bloom{font-size:54px;display:inline-block;animation:bloom 3.2s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:scale(.85) rotate(-6deg)}50%{transform:scale(1.1) rotate(6deg)}}
.bn h2{color:#ffe9a8;font-size:26px;margin:10px 0 6px}
.bn p{color:#c9bfa8;font-size:14px;margin:0}
</style></head><body style="margin:0;background:transparent">
<div class="bn"><div class="bloom">🌸</div><h2>{{text_bn}}</h2><p>{{text_en}}</p></div>
</body></html>
