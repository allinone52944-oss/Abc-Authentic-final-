<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=1">
<meta name="theme-color" content="#1e40af">
<title>সেবা - All In One</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Hind Siliguri',system-ui,sans-serif; background:#eef2f7; color:#0f172a; }
  .desktop { max-width:1100px; margin:0 auto; background:#fff; min-height:100vh; display:flex; }
  .sidebar { width:220px; background:linear-gradient(180deg,#1e3a8a,#1e40af); color:#fff; padding:20px 0; flex-shrink:0; }
  .side-logo { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.15); margin-bottom:16px; }
  .side-logo h2 { font-size:18px; } .side-logo p { font-size:11px; opacity:0.7; }
  .side-link { display:flex; align-items:center; gap:12px; padding:12px 20px; font-size:14px; color:rgba(255,255,255,0.85); cursor:pointer; border-left:3px solid transparent; }
  .side-link.on { background:rgba(255,255,255,0.12); border-left-color:#fff; color:#fff; font-weight:600; }
  .side-link .ico { font-size:18px; }
  .main { flex:1; padding:24px; overflow:auto; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .topbar h2 { font-size:20px; } .topbar p { font-size:13px; color:#64748b; }
  .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .cat-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:20px 14px; text-align:center; cursor:pointer; }
  .cat-card:hover { border-color:#3b82f6; }
  .cat-icon { font-size:36px; margin-bottom:8px; }
  .cat-name { font-weight:700; font-size:15px; }
  .cat-count { color:#64748b; font-size:12px; margin-top:4px; }
  .svc-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .svc-card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; cursor:pointer; display:flex; gap:12px; align-items:center; }
  .svc-card:hover { border-color:#3b82f6; }
  .svc-ico { width:48px; height:48px; border-radius:12px; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .svc-info { flex:1; } .svc-info h4 { font-size:14px; } .svc-info p { font-size:12px; color:#64748b; }
  .svc-pr { font-size:16px; font-weight:700; color:#1e40af; }
  .ptype { font-size:10px; padding:2px 8px; border-radius:12px; display:inline-block; margin-top:4px; }
  .ptype.auto { background:#dbeafe; color:#1d4ed8; }
  .ptype.manual { background:#fef3c7; color:#92400e; }
  .ptype.closed { background:#fee2e2; color:#b91c1c; margin-left:4px; }
  .back-link { color:#2563eb; cursor:pointer; font-size:14px; }
  @media (max-width:768px) {
    .sidebar { display:none; }
    .cat-grid { grid-template-columns:repeat(2,1fr); }
    .svc-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo"><h2>🔷 All In One</h2><p>বিশ্বাস ও সেবার ঠিকানা</p></div>
    <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico">🏠</span> ড্যাশবোর্ড</div>
    <div class="side-link on"><span class="ico">🛎️</span> সেবা</div>
    <div class="side-link" onclick="location.href='/orders.html'"><span class="ico">📦</span> আমার অর্ডার</div>
    <div class="side-link" onclick="location.href='/wallet.html'"><span class="ico">💳</span> ওয়ালেট</div>
    <div class="side-link" onclick="location.href='/profile.html'"><span class="ico">👤</span> প্রোফাইল</div>
  </div>
  <div class="main">
    <div class="topbar"><div><h2>🛎️ সেবা সমূহ</h2><p>পছন্দের সেবা বেছে নিন</p></div></div>
    <div id="catView"></div>
    <div id="svcView" style="display:none;"></div>
  </div>
</div>
<div class="wa-fab" id="waFab"><img src="/icons/abc-logo.png" alt="Abc"><span style="position:absolute;bottom:0;right:0;">💬</span></div>
<!-- mobile tabbar -->
<div class="m-tabbar">
  <div class="m-tab" onclick="location.href='/dashboard.html'"><div class="ico">🏠</div>হোম</div>
  <div class="m-tab on"><div class="ico">🛎️</div>সেবা</div>
  <div class="m-tab" onclick="location.href='/orders.html'"><div class="ico">📦</div>অর্ডার</div>
  <div class="m-tab" onclick="location.href='/wallet.html'"><div class="ico">💳</div>ওয়ালেট</div>
  <div class="m-tab" onclick="location.href='/profile.html'"><div class="ico">👤</div>প্রোফাইল</div>
</div>
<script src="/js/app.js?v=12"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bnNum(n){return Number(n||0).toLocaleString('bn-BD');}
function card(s){
  const closed = s.open ? '' : '<span class="ptype closed">বন্ধ</span>';
  return '<div class="svc-card" onclick="location.href=\'/service-detail.html?id='+s.id+'\'">'+
    '<div class="svc-ico">'+esc(s.icon||'🛎️')+'</div>'+
    '<div class="svc-info"><h4>'+esc(s.name_bn||s.name)+'</h4>'+
    '<span class="ptype '+(s.type==='manual'?'manual':'auto')+'">'+(s.type==='manual'?'manual':'automated')+'</span>'+closed+'</div>'+
    '<div class="svc-pr">৳'+bnNum(s.price)+(s.open?'':'<div style="font-size:10px;color:#b91c1c;">এখন বন্ধ</div>')+'</div></div>';
}
let GROUPS = [];
function showCats(){
  document.getElementById('catView').style.display = '';
  document.getElementById('svcView').style.display = 'none';
  let h = '<div class="cat-grid">';
  GROUPS.forEach((g, i) => {
    h += '<div class="cat-card" onclick="showCat('+i+')">'+
      '<div class="cat-icon">'+esc(g.icon)+'</div>'+
      '<div class="cat-name">'+esc(g.name)+'</div>'+
      '<div class="cat-count">'+bnNum(g.services.length)+'টি সেবা</div></div>';
  });
  document.getElementById('catView').innerHTML = h + '</div>';
}
function showCat(i){
  const g = GROUPS[i]; if(!g) return;
  document.getElementById('catView').style.display = 'none';
  const v = document.getElementById('svcView'); v.style.display = '';
  v.innerHTML = '<span class="back-link" onclick="showCats()">← সব ক্যাটাগরি</span>' +
    '<h3 style="margin:14px 0;">'+esc(g.icon)+' '+esc(g.name)+'</h3><div class="svc-grid">' +
    (g.services.map(card).join('') || '<div>কোনো সেবা নেই</div>') + '</div>';
}
async function init(){
  const me = await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  const u=(await me.json()).user;
  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent('আমি '+u.name+'। সেবা সম্পর্কে জানতে চাই।'),'_blank');
  };
  const r=await ABC.api('/services');
  if(!r.ok) return;
  const {services}=await r.json();
  const map = {}; GROUPS = [];
  const uncat = { id:null, name:'অন্যান্য', icon:'📦', services:[], ord:999999 };
  services.forEach(s => {
    if (s.category_id) {
      if (!map[s.category_id]) {
        map[s.category_id] = { id:s.category_id, name:s.category_name_bn||s.category_name||'ক্যাটাগরি',
          icon:s.category_icon||'📁', services:[], ord:(s.category_serial==null?999999:s.category_serial) };
        GROUPS.push(map[s.category_id]);
      }
      map[s.category_id].services.push(s);
    } else uncat.services.push(s);
  });
  if (uncat.services.length) GROUPS.push(uncat);
  GROUPS.sort((a,b)=>a.ord-b.ord);
  if (!GROUPS.length) {
    document.getElementById('catView').innerHTML = '<div class="svc-grid">'+services.map(card).join('')+'</div>';
  } else showCats();
}
init();
</script>
</body>
</html>
