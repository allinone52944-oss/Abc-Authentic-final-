<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bnNum(n){return Number(n||0).toLocaleString('bn-BD');}

function autoIcon(name){
  const n=String(name||'');
  if(/জন্ম|birth/i.test(n))return '👶';
  if(/মৃত্যু|death/i.test(n))return '🕊️';
  if(/এনআইডি|NID|ভোটার/i.test(n))return '🪪';
  if(/পাসপোর্ট|passport/i.test(n))return '🛂';
  if(/টিকিট|ticket/i.test(n))return '🎫';
  if(/আবেদন|apply|application/i.test(n))return '📝';
  if(/সনদ|certificate/i.test(n))return '📜';
  if(/অর্ডার|order/i.test(n))return '📦';
  if(/রিচার্জ|recharge|বিকাশ|নগদ/i.test(n))return '💳';
  return '🛎️';
}

// The land engines are ONE customer service (ভূমি সেবা)
// with three modes on a single page (audit #6 moved the
// khatian search to land-khatian.html) — showing separate catalog
// cards for them was a duplicate (owner, 2026-10-23, and again
// for mouza, 2026-11-03: mouza stayed a separate card while
// also appearing as the fourth mode tile inside land.html).
// They collapse into a single group card that opens land.html
// directly; the individual rows stay in Admin → Services for
// pricing, and their detail pages keep working.
// _landSearch keeps every sub-service name searchable, so
// searching "মৌজা" still finds the group card.
const LAND_ENGINES = ['land-search', 'land-scan', 'land-verify', 'land-mouza-value'];
function groupLand(list){
  const lands = list.filter(s => LAND_ENGINES.includes(s.engine_id));
  if (lands.length < 2) return list;
  const rest = list.filter(s => !LAND_ENGINES.includes(s.engine_id));
  const first = lands.find(s => s.engine_id === 'land-search') || lands[0];
  const group = Object.assign({}, first, {
    name: 'Land Services', name_bn: 'ভূমি সেবা (খতিয়ান)', icon: '🌾',
    price: Math.min.apply(null, lands.map(s => Number(s.price) || 0)),
    open: lands.some(s => s.open), _landGroup: true,
    _landSearch: 'নামে সন্ধান জমি যাচাই মৌজা মূল্য মৌজা মূল্য রিপোর্ট',
  });
  rest.splice(Math.min(list.indexOf(first), rest.length), 0, group);
  return rest;
}

// Audit #49 — small charge-rule label under the price (when the fee
// is cut: upfront vs success-only). Shown only for priced services
// with a known rule — never guessed.
function chargeRuleHtml(s){
  const r = s.charge_rule;
  if(!r || !(Number(s.price) > 0)) return '';
  return '<div style="font-size:11px;color:#64748b;font-weight:600;margin-top:2px;">💳 ' + esc(r.label) + ' · ' + esc(r.detail) + '</div>';
}

const SERVICE_SUMMARIES = new Map([
  ['nid-replica', 'তথ্য ও ছবি দিয়ে ফর্ম পূরণ করুন'],
  ['nid-server-copy', 'পোর্টাল লগইন প্রয়োজন'],
  ['qr-photo-verify', 'QR কোড ও ছবি দিয়ে যাচাই করুন'],
  ['bdris-apply', 'জন্ম নিবন্ধনের আবেদন ফর্ম পূরণ করুন'],
  ['birth-final', 'জন্ম নিবন্ধন নম্বর ও জন্মতারিখ দিন'],
  ['death-final', 'মৃত্যু নিবন্ধন নম্বর ও মৃত্যুর তারিখ দিন'],
  ['land-search', 'খতিয়ান নম্বর দিয়ে খুঁজুন'],
  ['land-scan', 'মালিকের নামে সম্পত্তি খুঁজুন'],
  ['land-verify', 'জমির তথ্য দিয়ে রেকর্ড যাচাই করুন'],
  ['land-mouza-value', 'মৌজা ও জমির শ্রেণি অনুযায়ী মূল্য দেখুন'],
  ['land-khatian', 'খতিয়ান নম্বর, নাম বা দাগ দিয়ে খুঁজুন'],
  ['land-mouza-map', 'মৌজা বেছে ম্যাপ দেখুন'],
  ['passport', 'এমআরপি পাসপোর্টের তথ্য পূরণের ফর্ম'],
  ['epassport', 'ই-পাসপোর্টের তথ্য পূরণের ফর্ম'],
]);

function serviceDestination(s){
  const id = encodeURIComponent(s.id);
  if (s.open && s.engine_id === 'land-khatian') return '/land-khatian.html?service=' + id;
  // Start with the two services whose direct form and outcome are verified.
  if (s.open && window.ServiceOrderPanel?.supports(s)) return '/order-create.html?service=' + id + '&flow=directory';
  return '/service-detail.html?id=' + id;
}

function card(s){
  if (s._landGroup) {
    return '<div class="svc-card" onclick="location.href=\'/land.html\'">' +
      '<div class="svc-ico">🌾</div>' +
      '<div class="svc-info"><h4>ভূমি সেবা (খতিয়ান)</h4>' +
      '<p class="svc-summary">নামে সন্ধান · জমি যাচাই · মৌজা মূল্য</p>' +
      '<div style="margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">' +
      '<span class="ptype auto">⚡ স্বয়ংক্রিয়</span>' + (s.open ? '' : '<span class="ptype closed">সাময়িক বন্ধ</span>') + '</div></div>' +
      '<div class="svc-pr">৳' + bnNum(s.price) + ' থেকে' + chargeRuleHtml(s) + '</div></div>';
  }
  const closed = s.open ? '' : '<span class="ptype closed">সাময়িক বন্ধ</span>';
  const catName = s.category_name_bn || s.category_name;
  const catHtml = catName ? '<span class="cat-pill">📁 ' + esc(catName) + '</span>' : '';
  const isAuto = s.type !== 'manual';
  const summary = isAuto ? SERVICE_SUMMARIES.get(s.engine_id) : 'তথ্য দিয়ে অর্ডার করুন। অপারেটর কাজটি করবেন।';
  return '<div class="svc-card" onclick="location.href=\''+serviceDestination(s)+'\'">'+
    '<div class="svc-ico">'+esc((s.icon&&s.icon!=='🛎️')?s.icon:autoIcon(s.name_bn||s.name))+'</div>'+
    '<div class="svc-info"><h4>'+esc(s.name_bn||s.name)+'</h4>'+
    (summary ? '<p class="svc-summary">' + esc(summary) + '</p>' : '') +
    '<div style="margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">' + catHtml +
    '<span class="ptype '+(isAuto?'auto':'manual')+'">'+(isAuto?'⚡ স্বয়ংক্রিয়':'📝 ম্যানুয়াল')+'</span>'+closed+'</div></div>'+
    '<div class="svc-pr">৳'+bnNum(s.price)+(s.open?'':'<div style="font-size:11px;color:#dc2626;font-weight:600;margin-top:2px;">বন্ধ আছে</div>')+chargeRuleHtml(s)+(s.engine_id === 'bdris-apply' ? '<div class="bdris-pdf-note" style="font-size:11px;color:#64748b;font-weight:600;margin-top:2px;">' + bdrisPdfNoteHtml() + '</div>' : '')+'</div></div>';
}

let GROUPS = [];
let ALL_SERVICES = [];
let CURRENT_FILTER = 'all';

function directoryFilter(params){
  const type = params.get('type');
  return ['cats', 'auto', 'manual'].includes(type) ? type : 'all';
}

// B2#4 — BDRIS charges twice (application + original PDF). The
// catalog card shows only the application price until the PDF
// price loads from /api/bdris-apply/prices (never hardcoded).
let BDRIS_PDF_PRICE = null;
function bdrisPdfNoteHtml(){
  return BDRIS_PDF_PRICE ? '+ আসল PDF ৳' + bnNum(BDRIS_PDF_PRICE) : '';
}
function loadBdrisPdfPrice(){
  ABC.api('/bdris-apply/prices').then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.ok || !(Number(d.pdfPrice) > 0)) return;
    BDRIS_PDF_PRICE = Number(d.pdfPrice);
    document.querySelectorAll('.bdris-pdf-note').forEach(function (el) { el.textContent = bdrisPdfNoteHtml(); });
  }).catch(function () {});
}

function updateCounts(){
  const allCnt = ALL_SERVICES.length;
  const autoCnt = ALL_SERVICES.filter(s => s.type !== 'manual').length;
  const manualCnt = ALL_SERVICES.filter(s => s.type === 'manual').length;
  document.getElementById('cntAll').textContent = bnNum(allCnt);
  document.getElementById('cntAuto').textContent = bnNum(autoCnt);
  document.getElementById('cntManual').textContent = bnNum(manualCnt);
}

function switchFilter(f){
  CURRENT_FILTER = f;
  document.querySelectorAll('button.ftab').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('[data-directory-type]').forEach(link => {
    const active = link.dataset.directoryType === f;
    link.classList.toggle('on', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const targetBtn = { cats:'tabCats', all:'tabAll', auto:'tabAuto', manual:'tabManual' }[f];
  if(targetBtn) document.getElementById(targetBtn).classList.add('on');

  const q = document.getElementById('svcSearch').value.trim();
  if (q) {
    applySearch(q);
    return;
  }

  if (f === 'cats') {
    showCats();
  } else {
    showFilteredServices(f);
  }
  saveViewState();
}

function serviceTypeSection(kind){
  const manual = kind === 'manual';
  const title = manual ? 'অর্ডার সার্ভিস' : 'স্বয়ংক্রিয় সেবা';
  let count = 0;
  const sections = GROUPS.map(group => {
    const items = group.services.filter(service => (service.type === 'manual') === manual);
    count += items.length;
    return items.length ? '<section class="svc-directory-group"><h4 class="svc-directory-category">' + esc(group.name) + '</h4><div class="svc-grid">' +
      items.map(card).join('') + '</div></section>' : '';
  }).join('');
  return '<section class="svc-directory-type" data-service-kind="' + kind + '" aria-labelledby="directory-' + kind + '">' +
    '<header class="svc-directory-type-head"><h3 id="directory-' + kind + '">' + title + '</h3>' +
    '<span>' + bnNum(count) + 'টি সেবা</span></header>' +
    (sections || '<p class="svc-directory-empty">এই তালিকায় এখন কোনো সেবা নেই।</p>') + '</section>';
}

function showFilteredServices(f){
  document.getElementById('catView').style.display = 'none';
  const view = document.getElementById('svcView');
  view.style.display = '';
  view.innerHTML = f === 'all' ? '<div class="svc-directory-types">' +
    serviceTypeSection('auto') + serviceTypeSection('manual') + '</div>' : serviceTypeSection(f);
}

function onSearchInput(val){
  const clearBtn = document.getElementById('searchClear');
  document.getElementById('serviceSearchBar').hidden = !val.trim();
  if (val && val.trim()) {
    clearBtn.style.display = 'inline-flex';
    applySearch(val.trim());
  } else {
    clearBtn.style.display = 'none';
    if (CURRENT_FILTER === 'cats') showCats();
    else showFilteredServices(CURRENT_FILTER);
    saveViewState();
  }
}

function clearSearch(){
  const inp = document.getElementById('svcSearch');
  inp.value = '';
  onSearchInput('');
  inp.focus();
}

function searchKey(value){
  return String(value || '').normalize('NFKC').toLowerCase()
    .replace(/[^\p{L}\p{N}\p{M}]+/gu, '')
    .replace(/এনআইডি|nআইডি/g, 'nid')
    .replace(/জন্মনিবন্ধন/g, 'birthregistration')
    .replace(/ইপাসপোর্ট/g, 'epassport')
    .replace(/পাসপোর্ট/g, 'passport');
}

function applySearch(q){
  document.getElementById('catView').style.display = 'none';
  const v = document.getElementById('svcView');
  v.style.display = '';
  
  let baseList = ALL_SERVICES;
  if (CURRENT_FILTER === 'auto') baseList = ALL_SERVICES.filter(s => s.type !== 'manual');
  else if (CURRENT_FILTER === 'manual') baseList = ALL_SERVICES.filter(s => s.type === 'manual');

  const key = searchKey(q);
  const filtered = key ? baseList.filter(s =>
    [s.name_bn, s.name, s.category_name_bn, s.category_name, s._landSearch]
      .some(value => searchKey(value).includes(key))
  ) : [];

  v.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
    '<h3 style="font-size:17px;font-weight:800;color:#0f172a;">🔍 অনুসন্ধানের ফলাফল (' + bnNum(filtered.length) + 'টি পাওয়া গেছে)</h3>' +
    '<span class="back-nav" style="margin-bottom:0;" onclick="clearSearch()">✕ ফিল্টার মুছুন</span>' +
    '</div>' +
    '<div class="svc-grid">' +
    (filtered.map(card).join('') || '<div style="color:#64748b;padding:40px 0;grid-column:1/-1;text-align:center;background:#fff;border-radius:12px;border:1px dashed #cbd5e1;"><div style="font-size:32px;margin-bottom:8px;">🔍</div>কোনো সেবা খুঁজে পাওয়া যায়নি। সেবার নাম অন্যভাবে লিখে দেখুন।</div>') +
    '</div>';
  saveViewState();
}

function showCats(){
  document.getElementById('catView').style.display = '';
  document.getElementById('svcView').style.display = 'none';
  let h = '<div class="cat-grid">';
  GROUPS.forEach((g, i) => {
    h += '<div class="cat-card" onclick="showCat('+i+')">'+
      '<div class="cat-icon">'+esc(g.icon)+'</div>'+
      '<div class="cat-name">'+esc(g.name)+'</div>'+
      '<div class="cat-count">'+bnNum(g.services.length)+'টি সেবা উপলব্ধ</div></div>';
  });
  document.getElementById('catView').innerHTML = h + '</div>';
}

function showCat(i){
  const g = GROUPS[i]; if(!g) return;
  document.getElementById('catView').style.display = 'none';
  const v = document.getElementById('svcView'); v.style.display = '';
  v.innerHTML = '<span class="back-nav" onclick="showCats()">← সকল ক্যাটাগরিতে ফিরুন</span>' +
    '<h3 style="margin:16px 0;font-size:18px;font-weight:800;color:#0f172a;display:flex;align-items:center;gap:8px;">'+esc(g.icon)+' '+esc(g.name)+' <span style="font-size:13px;font-weight:600;color:#64748b;">('+bnNum(g.services.length)+'টি)</span></h3>' +
    '<div class="svc-grid">' +
    (g.services.map(card).join('') || '<div style="color:#64748b;padding:20px 0;">এই ক্যাটাগরিতে কোনো সেবা নেই</div>') + '</div>';
}

async function init(){
  function loginUrl(){
    return '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
  }
  function showLoadError(kind){
    // B2#2 — the real failure, not one generic message. Session
    // expiry goes to login WITH the return URL (a retry would just
    // bounce to login anyway); server/network problems get a retry.
    // Counts stay '–' while the list is unknown — never '০', which
    // would imply zero inventory.
    document.getElementById('svcView').style.display = 'none';
    const view = document.getElementById('catView');
    view.style.display = '';
    let msg, action;
    if (kind === 'session') {
      msg = 'আপনার সেশন শেষ হয়ে গেছে। আবার লগইন করুন।';
      action = '<a class="btn btn-secondary" href="' + esc(loginUrl()) + '">লগইন করুন</a>';
    } else if (kind === 'server') {
      msg = 'সার্ভার সমস্যা হচ্ছে। কিছুক্ষণ পর আবার চেষ্টা করুন।';
      action = '<button class="btn btn-secondary" onclick="init()">আবার চেষ্টা করুন</button>';
    } else if (kind === 'network') {
      msg = 'ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। সংযোগ দেখে আবার চেষ্টা করুন।';
      action = '<button class="btn btn-secondary" onclick="init()">আবার চেষ্টা করুন</button>';
    } else {
      msg = 'সেবার তালিকা আনা যায়নি। সংযোগ দেখে আবার চেষ্টা করুন।';
      action = '<button class="btn btn-secondary" onclick="init()">আবার চেষ্টা করুন</button>';
    }
    view.innerHTML = '<div class="service-load-error" role="alert">' + msg + '<br>' + action + '</div>';
  }
  // B2#2 — a failed /auth/me must not bounce the user to login
  // blindly: 401 means the session really ended (login WITH the
  // return URL); anything else is a server/network problem, shown
  // as such with a retry instead of a login bounce.
  let me = null;
  try { me = await ABC.api('/auth/me'); } catch (_) { me = null; }
  if(!me || !me.ok){
    if (me && me.status === 401) { location.href = loginUrl(); return; }
    showLoadError(me && me.status >= 500 ? 'server' : 'network');
    return;
  }
  const u=(await me.json()).user;
  document.getElementById('topUserBal').textContent = '৳' + bnNum(u.balance || 0);
  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/8801835414122?text='+encodeURIComponent('আমি '+u.name+'। সেবা সম্পর্কে জানতে চাই।'),'_blank');
  };
  let services;
  let loadKind = 'unknown';
  try {
    const r=await ABC.api('/services');
    if(!r.ok) {
      // B2#2 — keep the failure kind: 401 = session expired,
      // NETWORK_ERROR (ABC.api's synthetic 503) = offline,
      // 5xx = server problem. One generic message hid all three.
      loadKind = r.status === 401 ? 'session' : (r.status >= 500 ? 'server' : 'unknown');
      try { const b = await r.json(); if (b && b.error === 'NETWORK_ERROR') loadKind = 'network'; } catch (e) {}
      throw new Error('service-load');
    }
    ({services}=await r.json());
  } catch (_) {
    showLoadError(loadKind);
    return;
  }
  ALL_SERVICES = groupLand(services || []);
  updateCounts();
  // B2#4 — non-blocking: the catalog renders first; the BDRIS
  // PDF price fills in when the price fetch resolves.
  loadBdrisPdfPrice();

  const map = {}; GROUPS = [];
  const uncat = { id:null, name:'অন্যান্য সেবা', icon:'📦', services:[], ord:999999 };
  ALL_SERVICES.forEach(s => {
    if (s.category_id) {
      if (!map[s.category_id]) {
        map[s.category_id] = {
          id:s.category_id,
          name:s.category_name_bn||s.category_name||'ক্যাটাগরি',
          icon:((s.category_icon&&s.category_icon!=='📁')?s.category_icon:autoIcon(s.category_name_bn||s.category_name)),
          services:[],
          ord:(s.category_serial==null?999999:s.category_serial)
        };
        GROUPS.push(map[s.category_id]);
      }
      map[s.category_id].services.push(s);
    } else uncat.services.push(s);
  });
  if (uncat.services.length) GROUPS.push(uncat);
  GROUPS.sort((a,b)=>a.ord-b.ord);

  const input = document.getElementById('svcSearch');
  const saved = history.state;
  const params = new URLSearchParams(location.search);
  const query = saved?.q ?? (input.value || params.get('q') || '');
  input.value = query.trim();
  document.getElementById('serviceSearchBar').hidden = !input.value;
  document.getElementById('searchClear').style.display = input.value ? 'inline-flex' : 'none';
  switchFilter(directoryFilter(params));
}

// Back and Forward restore the directory URL and its search input.
function saveViewState(){
  try {
    const q = (document.getElementById('svcSearch').value || '').trim();
    const url = new URL(location.href);
    if (q) url.searchParams.set('q', q);
    else url.searchParams.delete('q');
    if (CURRENT_FILTER === 'all') url.searchParams.delete('type');
    else url.searchParams.set('type', CURRENT_FILTER);
    history.replaceState({ q }, '', url);
  } catch (e) {}
}
window.addEventListener('popstate', function (ev) {
  const st = (ev && ev.state) || null;
  if (!st || !ALL_SERVICES.length) return;
  const q = (st.q || '').trim();
  document.getElementById('svcSearch').value = q;
  document.getElementById('serviceSearchBar').hidden = !q;
  document.getElementById('searchClear').style.display = q ? 'inline-flex' : 'none';
  switchFilter(directoryFilter(new URLSearchParams(location.search)));
});
init();
</script>
