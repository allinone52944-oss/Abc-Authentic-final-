<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/fonts/hind-siliguri.css?v=1">
<link rel="stylesheet" href="/css/premium.css?v=1">
<link rel="stylesheet" href="/css/motion.css?v=2">
<meta name="theme-color" content="#1e40af">
<title>সকল সেবা - All In One</title>
<style>
  .search-bar-wrap {
    margin-bottom: 24px;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 14px 18px 14px 44px;
    background: #ffffff;
    border: 1px solid var(--border-light);
    border-radius: var(--r-lg);
    font-size: 15px;
    font-family: inherit;
    box-shadow: var(--shadow-xs);
    transition: all 0.2s ease;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--primary-500);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 18px;
    pointer-events: none;
  }
  .back-nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary-700);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 6px 12px;
    border-radius: var(--r-md);
    background: var(--primary-50);
    transition: all 0.15s ease;
  }
  .back-nav:hover {
    background: var(--primary-100);
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="sidebar">
    <div class="side-logo">
      <div class="logo-icon">🔷</div>
      <div>
        <h2>All In One</h2>
        <p>বিশ্বাস ও সেবার ঠিকানা</p>
      </div>
    </div>
    <nav>
      <div class="side-link" onclick="location.href='/dashboard.html'"><span class="ico">🏠</span> ড্যাশবোর্ড</div>
      <div class="side-link on"><span class="ico">🛎️</span> সকল সেবা</div>
      <div class="side-link" onclick="location.href='/orders.html'"><span class="ico">📦</span> আমার অর্ডার</div>
      <div class="side-link" onclick="location.href='/wallet.html'"><span class="ico">💳</span> ওয়ালেট ও রিচার্জ</div>
      <div class="side-link" onclick="location.href='/profile.html'"><span class="ico">👤</span> পার্সোনাল প্রোফাইল</div>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h2>🛎️ সকল ডিজিটাল সেবা</h2>
        <p>আপনার প্রয়োজনীয় সেবা বেছে নিন অথবা ক্যাটাগরি ব্রাউজ করুন</p>
      </div>
    </div>

    <!-- Live Search Bar -->
    <div class="search-bar-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="svcSearch" class="search-input" placeholder="সেবার নাম লিখে খুঁজুন (যেমন: জন্ম নিবন্ধন, NID, পাসপোর্ট...)" oninput="filterServices(this.value)">
    </div>

    <div id="catView">
      <div class="skel" style="height:120px;margin-bottom:12px;"></div>
      <div class="skel" style="height:120px;"></div>
    </div>
    <div id="svcView" style="display:none;"></div>
  </div>
</div>

<button class="wa-fab" id="waFab" aria-label="WhatsApp-এ সাহায্য চান" title="WhatsApp-এ সরাসরি সাহায্য চান"><img src="/icons/whatsapp.svg" alt="WhatsApp"></button>

<!-- Mobile Tabbar -->
<div class="m-tabbar">
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/dashboard.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>হোম</div>
  <div class="m-tab on" aria-current="page"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></div>সেবা</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/orders.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div>অর্ডার</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/wallet.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div>ওয়ালেট</div>
  <div class="m-tab" tabindex="0" role="button" onclick="location.href='/profile.html'"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>প্রোফাইল</div>
</div>

<script src="/js/app.js?v=13"></script>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bnNum(n){return Number(n||0).toLocaleString('bn-BD');}

function autoIcon(name){
  const n=String(name||'');
  if(/জন্ম|birth/i.test(n))return '👶';
  if(/মৃত্যু|death/i.test(n))return '🕊️';
  if(/এনআইডি|NID|ভোটার/i.test(n))return '🪪';
  if(/পাসপোর্ট|passport/i.test(n))return '🛂';
  if(/টিকিট|ticket/i.test(n))return '🎫';
  if(/আবেদন|apply|application/i.test(n))return '📝';
  if(/সনদ|certificate/i.test(n))return '📜';
  if(/অর্ডার|order/i.test(n))return '📦';
  if(/রিচার্জ|recharge|বিকাশ|নগদ/i.test(n))return '💳';
  return '🛎️';
}

function card(s){
  const closed = s.open ? '' : '<span class="ptype closed">সাময়িক বন্ধ</span>';
  return '<div class="svc-card" onclick="location.href=\'/service-detail.html?id='+s.id+'\'">'+
    '<div class="svc-ico">'+esc((s.icon&&s.icon!=='🛎️')?s.icon:autoIcon(s.name_bn||s.name))+'</div>'+
    '<div class="svc-info"><h4>'+esc(s.name_bn||s.name)+'</h4>'+
    '<span class="ptype '+(s.type==='manual'?'manual':'auto')+'">'+(s.type==='manual'?'ম্যানুয়াল প্রসেস':'স্বয়ংক্রিয়')+'</span>'+closed+'</div>'+
    '<div class="svc-pr">৳'+bnNum(s.price)+(s.open?'':'<div style="font-size:11px;color:#dc2626;font-weight:600;">বন্ধ আছে</div>')+'</div></div>';
}

let GROUPS = [];
let ALL_SERVICES = [];

function filterServices(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) {
    showCats();
    return;
  }
  document.getElementById('catView').style.display = 'none';
  const v = document.getElementById('svcView');
  v.style.display = '';
  const filtered = ALL_SERVICES.filter(s => {
    const bn = (s.name_bn || '').toLowerCase();
    const en = (s.name || '').toLowerCase();
    return bn.includes(q) || en.includes(q);
  });
  v.innerHTML = '<span class="back-nav" onclick="showCats()">← সকল ক্যাটাগরিতে ফিরুন</span>' +
    '<h3 style="margin:16px 0;">🔍 অনুসন্ধানের ফলাফল (' + bnNum(filtered.length) + 'টি পাওয়া গেছে)</h3>' +
    '<div class="svc-grid">' +
    (filtered.map(card).join('') || '<div style="color:#64748b;padding:20px 0;">কোনো সেবা খুঁজে পাওয়া যায়নি</div>') +
    '</div>';
}

function showCats(){
  document.getElementById('catView').style.display = '';
  document.getElementById('svcView').style.display = 'none';
  let h = '<div class="cat-grid">';
  GROUPS.forEach((g, i) => {
    h += '<div class="cat-card" onclick="showCat('+i+')">'+
      '<div class="cat-icon">'+esc(g.icon)+'</div>'+
      '<div class="cat-name">'+esc(g.name)+'</div>'+
      '<div class="cat-count">'+bnNum(g.services.length)+'টি সেবা উপলব্ধ</div></div>';
  });
  document.getElementById('catView').innerHTML = h + '</div>';
}

function showCat(i){
  const g = GROUPS[i]; if(!g) return;
  document.getElementById('catView').style.display = 'none';
  const v = document.getElementById('svcView'); v.style.display = '';
  v.innerHTML = '<span class="back-nav" onclick="showCats()">← সকল ক্যাটাগরিতে ফিরুন</span>' +
    '<h3 style="margin:16px 0;">'+esc(g.icon)+' '+esc(g.name)+'</h3><div class="svc-grid">' +
    (g.services.map(card).join('') || '<div style="color:#64748b;padding:20px 0;">এই ক্যাটাগরিতে কোনো সেবা নেই</div>') + '</div>';
}

async function init(){
  const me = await ABC.api('/auth/me');
  if(!me.ok){location.href='/login.html';return;}
  const u=(await me.json()).user;
  document.getElementById('waFab').onclick=()=>{
    window.open('https://wa.me/?text='+encodeURIComponent('আমি '+u.name+'। সেবা সম্পর্কে জানতে চাই।'),'_blank');
  };
  const r=await ABC.api('/services');
  if(!r.ok) return;
  const {services}=await r.json();
  ALL_SERVICES = services || [];
  const map = {}; GROUPS = [];
  const uncat = { id:null, name:'অন্যান্য সেবা', icon:'📦', services:[], ord:999999 };
  services.forEach(s => {
    if (s.category_id) {
      if (!map[s.category_id]) {
        map[s.category_id] = {
          id:s.category_id,
          name:s.category_name_bn||s.category_name||'ক্যাটাগরি',
          icon:((s.category_icon&&s.category_icon!=='📁')?s.category_icon:autoIcon(s.category_name_bn||s.category_name)),
          services:[],
          ord:(s.category_serial==null?999999:s.category_serial)
        };
        GROUPS.push(map[s.category_id]);
      }
      map[s.category_id].services.push(s);
    } else uncat.services.push(s);
  });
  if (uncat.services.length) GROUPS.push(uncat);
  GROUPS.sort((a,b)=>a.ord-b.ord);
  if (!GROUPS.length) {
    document.getElementById('catView').innerHTML = '<div class="svc-grid">'+services.map(card).join('')+'</div>';
  } else showCats();
}
init();
</script>
</body>
</html>
