<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All In One (Abc Authentic) - Login</title>
<link rel="stylesheet" href="/css/coffee.css?v=9">
<style>
/* Override coffee.css overflow:hidden for login page */
body { overflow-y: auto !important; overflow-x: hidden; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Hind Siliguri', sans-serif;
  background: #1a120b;
  color: #f5e6c8;
  min-height: 100vh;
  display: flex;
}
/* Left: Branding panel */
.brand-panel {
  flex: 1;
  background: linear-gradient(135deg, #2b1d14 0%, #1a120b 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  position: relative;
  overflow: hidden;
}
.brand-panel::before {
  content: '☕';
  font-size: 200px;
  opacity: 0.05;
  position: absolute;
  animation: float 6s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-20px) rotate(5deg); }
}
.brand-logo { font-size: 48px; margin-bottom: 16px; }
.brand-title {
  font-size: 32px;
  color: #d4af37;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.brand-tag {
  font-size: 16px;
  color: #c9a961;
  letter-spacing: 1px;
}
/* Right: Form panel */
.form-panel {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  background: #241811;
}
.form-card {
  width: 100%;
  max-width: 400px;
}
.tabs {
  display: flex;
  margin-bottom: 24px;
  border-bottom: 2px solid #3a2a1a;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 12px;
  cursor: pointer;
  color: #8a7355;
  font-size: 16px;
  transition: all 0.3s;
}
.tab.active {
  color: #1a120b;
  background: #d4af37;
  border-bottom: 3px solid #d4af37;
  margin-bottom: -2px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  margin-bottom: 6px;
  color: #c9a961;
  font-size: 14px;
}
.field input, .field input[type="password"] {
  width: 100%;
  padding: 14px 16px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(212,175,55,0.25);
  border-radius: 10px;
  color: #f5e6c8;
  font-size: 15px;
  outline: none;
}
.field input:focus { border-color: #d4af37; }
.btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #d4af37, #b8941f);
  border: none;
  border-radius: 10px;
  color: #1a120b;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}
.btn:hover { opacity: 0.9; }
.err { color: #ff6b6b; font-size: 14px; margin-top: 12px; text-align: center; }
/* Mobile */
@media (max-width: 768px) {
  body { flex-direction: column; }
  .brand-panel { padding: 30px 20px; }
  .brand-panel::before { font-size: 120px; }
  .brand-title { font-size: 24px; }
  .form-panel { padding: 20px; }
  .field input { font-size: 16px; } /* Prevent iOS auto-zoom */
}
</style>
</head>
<body>
<div class="brand-panel">
  <img src="/icons/abc-uncommon.svg" alt="ABC" style="width:80px;height:80px;margin-bottom:16px;">
  <div class="brand-title">ALL IN ONE</div>
  <div style="color:#d4af37;letter-spacing:2px;margin-bottom:12px;">ABC AUTHENTIC</div>
  <div class="brand-tag">বিশ্বাস ও সেবার ঠিকানা</div>
</div>
<div class="form-panel">
  <div class="form-card">
    <div class="tabs">
      <div class="tab active" onclick="showTab('login',this)">লগইন</div>
      <div class="tab" onclick="showTab('reg',this)">রেজিস্ট্রেশন</div>
    </div>
    <div id="tab-login">
      <div class="field">
        <label>মোবাইল / ইমেইল</label>
        <input type="text" id="lg_id" placeholder="01XXXXXXXXX বা ইমেইল">
      </div>
      <div class="field">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="lg_pw" placeholder="পাসওয়ার্ড">
      </div>
      <button class="btn" onclick="doLogin()">প্রবেশ করুন →</button>
      <div class="err" id="lg_err"></div>
      <div style="text-align:center;margin-top:10px;">
        <a href="#" onclick="showForgot();return false;" style="color:var(--gold);font-size:13px;">🔑 পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>
      <div id="forgotWrap" style="display:none;margin-top:10px;">
        <div class="field">
          <label>ইমেইল</label>
          <input type="email" id="fg_email" placeholder="email@example.com">
        </div>
        <button class="btn" onclick="doForgot()">রিসেট লিংক পাঠান →</button>
        <div class="err" id="fg_err"></div>
        <div class="okmsg" id="fg_ok"></div>
      </div>
    </div>
    <div id="tab-reg" style="display:none;">
      <div class="field">
        <label>নাম *</label>
        <input type="text" id="rg_name" placeholder="আপনার নাম">
      </div>
      <div class="field">
        <label>মোবাইল নম্বর *</label>
        <input type="text" id="rg_phone" placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label>WhatsApp নম্বর *</label>
        <input type="text" id="rg_wa" placeholder="01XXXXXXXXX">
      </div>
      <div class="field">
        <label>ইমেইল *</label>
        <input type="email" id="rg_email" placeholder="email@example.com">
      </div>
      <div class="field">
        <label>পাসওয়ার্ড * (min 6)</label>
        <input type="password" id="rg_pw" placeholder="পাসওয়ার্ড">
      </div>
      <button class="btn" onclick="doRegister()">রেজিস্টার করুন →</button>
      <div class="err" id="rg_err"></div>
    </div>
  </div>
</div>
<script>
function showTab(which, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-login').style.display = which === 'login' ? '' : 'none';
  document.getElementById('tab-reg').style.display = which === 'reg' ? '' : 'none';
}
// Login/Register logic will be added here (copy from old file)
function showForgot(){
  const w=document.getElementById('forgotWrap');
  w.style.display=w.style.display==='none'?'':'none';
}
async function doForgot(){
  const email=document.getElementById('fg_email').value.trim();
  const err=document.getElementById('fg_err');
  const ok=document.getElementById('fg_ok');
  err.textContent='';ok.textContent='';
  if(!email){err.textContent='ইমেইল দিন';return;}
  try{
    const r=await fetch('/api/auth/forgot-password',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    if(r.ok){ok.textContent='✅ রিসেট লিংক পাঠানো হয়েছে (ইমেইল চেক করুন)';}
    else{err.textContent='ব্যর্থ হয়েছে';}
  }catch(e){err.textContent='নেটওয়ার্ক সমস্যা';}
}
async function doLogin() {
  const id = document.getElementById('lg_id').value.trim();
  const pw = document.getElementById('lg_pw').value;
  const err = document.getElementById('lg_err');
  err.textContent = '';
  if (!id || !pw) { err.textContent = 'ID ও পাসওয়ার্ড দিন'; return; }
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: id, password: pw })
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Login ব্যর্থ'; return; }
    sessionStorage.setItem('abc_access_token', d.access_token);
    const next = new URLSearchParams(location.search).get('next') || '/dashboard.html';
    location.href = next;
  } catch (e) { err.textContent = 'নেটওয়ার্ক সমস্যা'; }
}
async function doRegister() {
  const err = document.getElementById('rg_err');
  err.textContent = '';
  const body = {
    name: document.getElementById('rg_name').value.trim(),
    phone: document.getElementById('rg_phone').value.trim(),
    whatsapp: document.getElementById('rg_wa').value.trim(),
    email: document.getElementById('rg_email').value.trim(),
    password: document.getElementById('rg_pw').value,
  };
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) { err.textContent = d.error || 'Registration ব্যর্থ'; return; }
    alert('✅ রেজিস্ট্রেশন সফল! ইমেইল যাচাই করুন।');
    showTab('login', document.querySelector('.tab'));
  } catch (e) { err.textContent = 'নেটওয়ার্ক সমস্যা'; }
}
// Hide registration tab if disabled
(async()=>{
  try{
    const r=await fetch('/api/auth/registration-status');
    const d=await r.json();
    if(d.enabled===false){
      document.querySelectorAll('.tab')[1].style.display='none';
    }
  }catch(e){}
})();
// Religion Voice Greeting
(async()=>{
  try{
    const r=await fetch('/api/auth/voice-greeting');
    const d=await r.json();
    if(!d.enabled) return;
    // Check if user disabled in localStorage
    if(localStorage.getItem('abc_voice_greeting')==='off') return;
    const greetings=d.greetings||{};
    // Use generic greeting (time-based if 'other' empty)
    let text=greetings.other||'';
    if(!text){
      const h=new Date().getHours();
      text=h<12?'সুপ্রভাত':h<17?'শুভ অপরাহ্ন':'শুভ সন্ধ্যা';
    }
    // Voice rotation: male->female->child
    const rotIdx=Number(localStorage.getItem('abc_voice_rot')||'0');
    const voices=speechSynthesis.getVoices();
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang='bn-BD';
    if(d.rotation && voices.length){
      // Try to pick different voice based on rotation
      const v=voices[rotIdx % voices.length];
      if(v) utter.voice=v;
      localStorage.setItem('abc_voice_rot', String((rotIdx+1)%3));
    }
    // Play on first user interaction (browser autoplay policy)
    const play=()=>{ try{ speechSynthesis.speak(utter); }catch(e){} document.removeEventListener('click',play); };
    document.addEventListener('click',play,{once:true});
  }catch(e){}
})();
</script>
</body>
</html>
