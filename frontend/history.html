  .hist-meta { color:#64748b; font-size:12px; margin-top:3px; line-height:1.6; }

    border:1px solid #e2e8f0; background:#f8fafc; color:#0f172a;
    padding:6px 10px; border-radius:8px; cursor:pointer; font-family: inherit;
  }
  .hist-doc:hover { border-color:#2563eb; background:#eff6ff; }
  .hist-doc.delivery { border-color:#fde68a; background:#fffbeb; }

<script src="/js/app.js?v=17"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ICON = { manual:'📝', order:'📦', engine:'🎓' };

let _items = [];

function render(){
  const box = document.getElementById('histList');
  if(!_items.length){
    box.innerHTML = '<div style="padding:16px 0; color:#94a3b8;">এখনো কোনো ডেলিভারি ফাইল পাননি। সেবা সম্পন্ন হলে ডেলিভারি ফাইল এখানে পাবেন।</div>';
    return;
  }
  box.innerHTML = _items.map((it, gi) => {
    const docs = (it.documents || []).map((d, di) =>
      '<button class="hist-doc delivery" onclick="dlHist(' + gi + ',' + di + ')">🎁 ' + esc(d.originalname || d.filename) + ' ⬇️</button>'
    ).join('');
    return '<div class="hist-item">' +
      '<div class="hist-head"><div>' +
        '<div class="hist-title">' + (ICON[it.kind] || '📄') + ' ' + esc(it.title) + '</div>' +
        '<div class="hist-meta">' + new Date(it.created_at).toLocaleString('bn-BD') + '</div>' +
      '</div></div>' +
      (docs ? '<div class="hist-docs">' + docs + '</div>' : '') +
    '</div>';
  }).join('');
}

async function dlHist(i, di){
  const it = _items[i]; if(!it) return;
  const d = (it.documents || [])[di]; if(!d) return;
  try{
    const r = await ABC.api(d.url);
    if(!r.ok){ alert('ডাউনলোড ব্যর্থ হয়েছে'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = d.originalname || d.filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }catch(e){ alert('ডাউনলোড ব্যর্থ হয়েছে'); }
}

async function init(){
  try{
    const r = await ABC.api('/history');
    if(!r.ok) throw new Error('load');
    const d = await r.json();
    _items = d.items || [];
    render();
  }catch(e){
    document.getElementById('histList').innerHTML = '<div style="color:#b91c1c;">ইতিহাস লোড করা যায়নি। আবার চেষ্টা করুন।</div>';
  }
  try{
    const me = await ABC.api('/auth/me');
    if(me.ok){
      const u = (await me.json()).user || {};
      document.getElementById('waFab').onclick = () => {
        window.open('https://wa.me/8801835414122?text=' + encodeURIComponent('আসসালামু আলাইকুম! আমি ' + u.name + ' (ফোন: ' + u.phone + ')। আমার ইতিহাস নিয়ে সাহায্য দরকার।'), '_blank');
      };
    }
  }catch(e){}
}

init();
</script>
