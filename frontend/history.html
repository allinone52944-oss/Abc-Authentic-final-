<script src="/js/app.js?v=21"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const ICON = { manual:'📝', order:'📦', engine:'🎓', bdris:'📋' }; // audit #39 — BDRIS filings appear in History
// B2#8 — kind labels: rows are labelled by group (the #histKind filter
// filters by the same kinds); the label + status line below say whether
// a row is a downloadable delivery or a record-only (billing) entry.
const KIND_LABEL = { manual:'ম্যানুয়াল সেবা', order:'অর্ডার', engine:'ইঞ্জিন সেবা', bdris:'বিডিআরআইএস আবেদন' };

let _items = [];
let _histShown = 20;
const HIST_PAGE = 20;

// Audit #35 — search + kind filter over the loaded records, rendered
// 20 at a time. The list keeps the ORIGINAL _items index (gi) so the
// download buttons still point at the right record.
function histFiltered(){
  const q = ((document.getElementById('histSearch') || {}).value || '').trim().toLowerCase();
  const k = (document.getElementById('histKind') || {}).value || '';
  const out = [];
  _items.forEach((it, gi) => {
    if (k && it.kind !== k) return;
    if (q && !((it.title || '').toLowerCase().includes(q) ||
      (it.documents || []).some(d => (d.originalname || d.filename || '').toLowerCase().includes(q)))) return;
    out.push(gi);
  });
  return out;
}
function histApplyFilter(){ _histShown = HIST_PAGE; render(); }
function histLoadMore(){ _histShown += HIST_PAGE; render(); }

function render(){
  const box = document.getElementById('histList');
  const more = document.getElementById('histMoreBtn');
  if(!_items.length){
    box.innerHTML = '<div style="padding:16px 0; color:#94a3b8;">এখনো কোনো ডেলিভারি ফাইল পাননি। সেবা সম্পন্ন হলে ডেলিভারি ফাইল এখানে পাবেন।</div>';
    if (more) more.style.display = 'none';
    return;
  }
  const list = histFiltered();
  if(!list.length){
    box.innerHTML = '<div style="padding:16px 0; color:#94a3b8;">খুঁজে কিছু পাওয়া যায়নি — অন্য শব্দে বা ধরনে খুঁজে দেখুন।</div>';
    if (more) more.style.display = 'none';
    return;
  }
  const shown = list.slice(0, _histShown);
  if (more) more.style.display = (list.length > _histShown) ? '' : 'none';
  box.innerHTML = shown.map(gi => {
    const it = _items[gi];
    const docs = (it.documents || []).map((d, di) =>
      '<button class="hist-doc delivery" onclick="dlHist(' + gi + ',' + di + ')">🎁 ' + esc(d.originalname || d.filename) + ' ⬇️</button>'
    ).join('');
    // Past-applications list (2026-11-07) — a BDRIS filing shows its
    // tracking number, a link to the filing page, and its stored
    // original PDF when retrievable: the documents array (rendered
    // above via dlHist) is the download, and this view button opens
    // the same copy in a new tab. When the copy is not retrievable
    // the row keeps the filing-page note (the page can re-fetch it).
    const hasPdf = it.kind === 'bdris' && (it.documents || []).length > 0;
    const hasDocs = (it.documents || []).length > 0;
    const isFailed = (it.title || '').includes('— ব্যর্থ');
    // B2#8 — every row states its status and the next action. History
    // only ever holds completed/delivered records (the /history SQL
    // gates), so a file-less row is a completed record with no
    // downloadable file — never a missing record. BDRIS rows with a
    // retrievable PDF already state their PDF state in `extra` below,
    // so they get no second status line.
    const statusText = isFailed
      ? '❌ ব্যর্থ হয়েছে — কোনো ফাইল তৈরি হয়নি। আবার চেষ্টা করুন।'
      : hasDocs
        ? '✅ ডেলিভারি ফাইল প্রস্তুত — নিচে ডাউনলোড করুন।'
        : (it.kind === 'bdris'
          ? (it.original_pdf_available ? '' : 'আসল PDF এখানে সংরক্ষিত নেই — আবেদন পাতা থেকে নিতে পারবেন।')
          : '✅ সম্পন্ন হয়েছে — ডাউনলোডযোগ্য ফাইল নেই (শুধু রেকর্ড)।');
    const status = statusText ? '<div class="hist-meta" style="color:#475569;">' + statusText + '</div>' : '';
    const extra = (it.kind === 'bdris'
      ? (it.original_pdf_available ? '<div class="hist-meta" style="color:#059669;">✅ আসল PDF তৈরি — ' + (hasPdf ? 'এখানেই দেখুন / নামান' : 'আবেদন পাতা থেকে নামান') + '</div>' : '') +
        ((hasPdf || it.link) ? '<div class="hist-docs">' +
          (hasPdf ? '<button class="hist-doc" onclick="viewHist(' + gi + ',0)">👁️ আসল PDF দেখুন</button>' : '') +
          (it.link ? '<button class="hist-doc" onclick="location.href=\'' + esc(it.link) + '\'">📄 আবেদন দেখুন</button>' : '') +
          '</div>' : '')
      : '');
    // B2#3 (adjacent gap) — History rows had no way to open the
    // order's detail/status/files. Only 'order' rows carry an orders
    // id that /order-detail.html serves; manual rows have no
    // customer detail page and engine/bdris ids are not order ids,
    // so they get no link here (a wrong link would 404).
    const detailUrl = it.kind === 'order' ? '/order-detail.html?id=' + encodeURIComponent(it.id) : '';
    const detailBtn = detailUrl
      ? '<button class="hist-doc" onclick="location.href=\'' + esc(detailUrl) + '\'">🔍 বিস্তারিত দেখুন</button>'
      : '';
    return '<div class="hist-item">' +
      '<div class="hist-head"><div>' +
        '<div class="hist-title">' + (ICON[it.kind] || '📄') + ' ' + esc(it.title) + (KIND_LABEL[it.kind] ? ' <span class="hist-kind">' + KIND_LABEL[it.kind] + '</span>' : '') + '</div>' +
        '<div class="hist-meta">' + new Date(it.created_at).toLocaleString('bn-BD') + '</div>' +
        status +
      '</div></div>' +
      (docs ? '<div class="hist-docs">' + docs + '</div>' : '') + extra +
      (detailBtn ? '<div class="hist-docs">' + detailBtn + '</div>' : '') +
    '</div>';
  }).join('');
}

async function dlHist(i, di){
  const it = _items[i]; if(!it) return;
  const d = (it.documents || [])[di]; if(!d) return;
  try{
    const r = await ABC.api(d.url);
    if(!r.ok){ ABC.showPageMsg(ABC.httpErrBn(r.status, 'ডাউনলোড'), 'err'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = d.originalname || d.filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }catch(e){ ABC.showPageMsg(ABC.httpErrBn(0, 'ডাউনলোড'), 'err'); }
}

// Past-applications list (2026-11-07): view a stored PDF in a new
// tab — same owner-only URL as the download (blob via JWT, never a
// bare static link, so no token ever sits in a URL).
async function viewHist(i, di){
  const it = _items[i]; if(!it) return;
  const d = (it.documents || [])[di]; if(!d) return;
  try{
    const r = await ABC.api(d.url);
    if(!r.ok){ ABC.showPageMsg(ABC.httpErrBn(r.status, 'খোলা'), 'err'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=>{ URL.revokeObjectURL(url); }, 60000);
  }catch(e){ ABC.showPageMsg(ABC.httpErrBn(0, 'খোলা'), 'err'); }
}

async function loadHistory(){
  try{
    const r = await ABC.api('/history');
    if(!r.ok) throw new Error('load');
    const d = await r.json();
    _items = d.items || [];
    render();
  }catch(e){
    document.getElementById('histList').innerHTML = '<div class="section-recovery" role="alert">ইতিহাস আনা যায়নি। <button class="btn btn-secondary" onclick="loadHistory()">আবার চেষ্টা</button></div>';
    document.getElementById('histMoreBtn').style.display = 'none';
  }
}

async function init(){
  const auth = await ABC.api('/auth/me').catch(()=>null);
  if(auth && auth.status===401){ location.href='/login.html'; return; }
  await loadHistory();
  try{
    const me = await ABC.api('/auth/me');
    if(me.ok){
      const u = (await me.json()).user || {};
      document.getElementById('waFab').onclick = () => {
        window.open('https://wa.me/8801835414122?text=' + encodeURIComponent('আসসালামু আলাইকুম! আমি ' + u.name + ' (ফোন: ' + u.phone + ')। আমার ইতিহাস নিয়ে সাহায্য দরকার।'), '_blank');
      };
    }
  }catch(e){}
}

init();
</script>
